# Shared location blocks for HTTP and HTTPS servers.
# Included by nginx.conf — do not load independently.

root /usr/share/nginx/html;
index index.html;

# Character set. Without this nginx sends text/plain with no charset, and the
# decoding falls to the reader's locale. third-party-licences.txt is where that
# shows: sixteen of the licence texts it carries have non-ASCII attribution
# lines — "Claudéric Demers", "Iconify OÜ", "Copyright © Jorge Bucaran" — and a
# mangled attribution is an attribution that did not arrive. index.html is
# unaffected, declaring its own in-band.
charset utf-8;
charset_types text/plain text/css application/json application/javascript text/xml image/svg+xml;


# Gzip compression
gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
gzip_min_length 1024;

# Docker's embedded DNS. The upstreams below are variables, so nginx resolves
# them per request through this resolver instead of once at startup: with
# `docker compose up --scale server=N --scale collab=N` the service name
# answers with every replica, and replicas added, removed or moved to a new
# address are picked up within `valid`.
resolver 127.0.0.11 valid=10s ipv6=off;

# API proxy
location /api/ {
    set $server_upstream server:3000;
    proxy_pass http://$server_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Largest request body (inner#1006). Must equal config/limits.yaml
    # request_body_max_bytes; larger bodies go through a transfer upload.
    client_max_body_size 1m;

    # SSE support (Agent chat + Text mini-tools)
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
}

# Hocuspocus WebSocket proxy
location /ws {
    set $collab_upstream collab:1234;
    proxy_pass http://$collab_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 86400s;
}

# nginx has no type for .md, so the default would make the browser download
# THIRD-PARTY.md rather than show it, and it is there to be read. Set the type
# for this one request: a `types` block here would replace the whole MIME table
# rather than add to it, and everything else would go out as a download.
location ~ \.md$ {
    default_type text/plain;
}

# The update checker must observe the current deployment, never an old cache.
location = /app-version.json {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
}

# SPA fallback — all other routes serve index.html
location / {
    try_files $uri $uri/ /index.html;
}
