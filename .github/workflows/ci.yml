name: CI

on:
  push:
    branches: [main, test_thinkai_cc]
    tags: ['v*']
  pull_request:
    branches: [main]

# Action versions are tracked to major (e.g. @v6). These majors are all the
# Node.js 24 runtime releases — pinning below major would require manual
# bumps for every security patch. See
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
# for the Node 20 → 24 runner deprecation timeline that drove these bumps.

jobs:
  dev-proxy-guard:
    name: Dev Proxy Guard
    runs-on: ubuntu-latest

    # Defense in depth with .husky/pre-commit. Both run the SAME rule —
    # breatic/no-deployed-host — so the pair cannot drift. They were separate
    # implementations once and BOTH silently died: each filtered on
    # `vite.config.ts` after the file became `.mts`, so neither ever ran
    # (#1831). The rule judges every string in the package rather than three
    # filenames, which is what retires that failure mode instead of restating
    # it in a new syntax.
    #
    # This job used to skip the Node setup and call a shell script, which was
    # cheaper but meant a second implementation of the same check. One
    # implementation with three callers is worth the install.
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check vite dev-proxy targets
        # The whole web package: the proxy is decided across three root
        # config files, and naming them here is what went blind last time.
        run: pnpm --filter @breatic/web exec eslint .

  auth-bypass-residue:
    name: Auth Bypass Residue
    runs-on: ubuntu-latest

    # Defense against re-introduction of the dev-bypass auth mode deleted in
    # #147. Every environment requires a real login; no mode switch is left,
    # so any file naming one is residue.
    #
    # This file is itself in the check's scan range — a workflow `env:` block
    # injects real environment variables, so it is a place the mode could be
    # re-introduced for real rather than merely described. That is why the
    # forbidden names are NOT spelled out here; they live in the check, which
    # assembles them from parts so that even it does not contain them.
    #
    # The end-to-end self-test the shell version ran as a second step is now
    # the check's unit tests, which plant each forbidden name and assert it
    # is found — the same assurance, without staging a probe into the index.
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan for auth-bypass residue
        # This one check by name. The repo-wide suite includes one that
        # reads build output, and this job installs without building; an
        # unknown name is a hard error, so a rename cannot make this job
        # quietly stop checking anything.
        run: pnpm lint:repo no-auth-bypass-residue

  lint-typecheck-test:
    name: Lint + Typecheck + Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Install ffmpeg (worker video-handler tests)
        # Worker `src/__tests__/handlers/local/video-*.test.ts` spawn
        # ffmpeg for fixture generation + assertion. ubuntu-latest does
        # not bundle it, so install via apt-get explicitly. The ~30s
        # install is the cost of actually running the video-processing
        # unit tests in CI.
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo lint

      - name: Lint dependency-cruiser (import-boundary rules)
        # Declarative import-boundary enforcement (CI maximal-strictness
        # guard suite, ADR 2026-06-01) over all packages/*/src via
        # .dependency-cruiser.cjs forbidden rules:
        #   - routes-no-data-layer (#1): a server route must call a
        #     *.service, never a *.repo directly.
        #   - server-no-sync-aigc (#14, PROXY): only the 3 allowlisted SSE
        #     entry points may import the AI SDK.
        #   - library-no-app-import: @breatic/core|shared|domain must NOT
        #     import an application package (@server/@worker/@collab/@web).
        #   - collab-no-domain-import: collab must NOT import @breatic/domain.
        #   - service-no-hono (#2): a *.service.ts must NOT import hono.
        # The last three were migrated from hand-rolled bash grep guards —
        # dependency-cruiser sees only real imports (not comments), so it
        # can't false-positive on a doc-comment naming a banned alias.
        run: pnpm lint:dependency-cruiser

      - name: Build packages
        run: pnpm turbo build

      - name: Repo-wide checks (repo-lint)
        # The invariants ESLint structurally cannot hold: they are about
        # files it never parses (SQL, YAML, shell, build output) or about
        # the repository rather than any one file's contents. One step for
        # all of them — each check reports its own findings, and a check
        # that cannot run at all is a failure, never a pass.
        #
        # After the build, because one of these checks reads dist: it
        # asserts no internal alias survived, and an unbuilt tree must
        # not be mistaken for a clean one.
        run: pnpm lint:repo

      - name: Typecheck (all packages)
        # tsc --noEmit across every workspace package (shared / core /
        # worker / collab / server / web). Previously filtered to just
        # server + collab, which silently left the other four packages
        # un-type-checked in CI (their tsup/vite builds transpile via
        # esbuild and do NOT type-check). web gained its typecheck script
        # in this change; backend packages already passed locally.
        run: pnpm turbo typecheck

      - name: Test (all packages)
        # Runs vitest across every workspace package (shared / core /
        # collab / worker / server / web). vitest configs already
        # exclude integration tests (`*.integration.test.ts`) which
        # require live Postgres / Redis; unit tests use mocks.
        run: pnpm turbo test
        env:
          DATABASE_URL: postgres://localhost/test
          REDIS_URL: redis://localhost/0
          REDIS_QUEUE_URL: redis://localhost/1
          REDIS_STREAM_URL: redis://localhost/2

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    # Independent job (no `needs`) so it runs in parallel with
    # lint-typecheck-test and keeps a separate infra-flaky signal; it is
    # deliberately NOT in docker's `needs`, so a slow container boot never
    # delays the image build. The `*.integration.test.ts` suites are excluded
    # from the unit `pnpm turbo test` run (they need a live PG + Redis), so
    # without this job the real-Postgres invariant tests (credit-deduction
    # atomicity, role-upgrade decide-once, etc.) never run on a PR.
    env:
      # The runner is ephemeral and global-setup.ts already calls .stop() on
      # the containers explicitly, so the Testcontainers Ryuk reaper adds no
      # value here and can be flaky in CI — disable it.
      TESTCONTAINERS_RYUK_DISABLED: "true"

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `turbo run test:integration` builds shared → core → domain first (the
      # integration suites import all three; test:integration dependsOn build,
      # build dependsOn ^build → the whole chain). Testcontainers then spin
      # ephemeral Postgres + Redis on the Docker daemon ubuntu-latest ships
      # with — no `services:` block and no harness change needed. The harness
      # sets every required env var itself (container URLs
      # etc.), so this job needs no `env:` beyond the Ryuk toggle above.
      - name: Integration tests
        run: pnpm turbo run test:integration --filter=@breatic/server

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint-typecheck-test

    # Builds both images (API-shared + web) and pushes to GHCR.
    # - PR:            build-only (no push) — smoke test that Dockerfiles still work
    # - push to main:  tags `:main` + `:latest`
    # - push to any other branch (e.g. test_thinkai_cc): tag = branch name
    # - push to v* tag: semver tags (`:1.2.3` + `:1.2`)
    #
    # docker/metadata-action@v5 generates all the tag permutations from the
    # triggering git ref — the rule table lives inline below so future edits
    # don't require reading metadata-action docs.
    #
    # Buildx + gha cache persists base-image layers across runs so we don't
    # re-pull `node:22-slim` every time and are resilient to Docker Hub 5xx.
    permissions:
      contents: read
      packages: write  # required to push images to GHCR

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags (breatic)
        id: meta-breatic
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/breatic
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build + push breatic (API/Worker/Collab/Migrate)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta-breatic.outputs.tags }}
          labels: ${{ steps.meta-breatic.outputs.labels }}
          cache-from: type=gha,scope=breatic
          cache-to: type=gha,mode=max,scope=breatic

      - name: Compute tags (breatic-web)
        id: meta-web
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/breatic-web
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build + push breatic-web (nginx + SPA)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.web
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha,scope=breatic-web
          cache-to: type=gha,mode=max,scope=breatic-web
