name: CI

on:
  push:
    branches: [main, test_thinkai_cc]
    tags: ['v*']
  pull_request:
    branches: [main]

# Action versions are tracked to major (e.g. @v6). These majors are all the
# Node.js 24 runtime releases — pinning below major would require manual
# bumps for every security patch. See
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
# for the Node 20 → 24 runner deprecation timeline that drove these bumps.

jobs:
  dev-proxy-guard:
    name: Dev Proxy Guard
    runs-on: ubuntu-latest

    # Defense in depth with .husky/pre-commit. Both run the SAME rule —
    # breatic/no-deployed-host — so the pair cannot drift. They were separate
    # implementations once and BOTH silently died: each filtered on
    # `vite.config.ts` after the file became `.mts`, so neither ever ran
    # (#1831). The rule judges every string in the package rather than three
    # filenames, which is what retires that failure mode instead of restating
    # it in a new syntax.
    #
    # This job used to skip the Node setup and call a shell script, which was
    # cheaper but meant a second implementation of the same check. One
    # implementation with three callers is worth the install.
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check vite dev-proxy targets
        # The whole web package: the proxy is decided across three root
        # config files, and naming them here is what went blind last time.
        run: pnpm --filter @breatic/web exec eslint .

  auth-bypass-residue:
    name: Auth Bypass Residue
    runs-on: ubuntu-latest

    # Defense against re-introduction of the dev-bypass auth mode deleted in
    # #147. Every environment requires a real login; no mode switch is left,
    # so any file naming one is residue.
    #
    # This file is itself in the check's scan range — a workflow `env:` block
    # injects real environment variables, so it is a place the mode could be
    # re-introduced for real rather than merely described. That is why the
    # forbidden names are NOT spelled out here; they live in the check, which
    # assembles them from parts so that even it does not contain them.
    #
    # The end-to-end self-test the shell version ran as a second step is now
    # the check's unit tests, which plant each forbidden name and assert it
    # is found — the same assurance, without staging a probe into the index.
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan for auth-bypass residue
        # This one check by name. The repo-wide suite includes one that
        # reads build output, and this job installs without building; an
        # unknown name is a hard error, so a rename cannot make this job
        # quietly stop checking anything.
        run: pnpm lint:repo no-auth-bypass-residue

  lint-typecheck-test:
    name: Lint + Typecheck + Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Install ffmpeg (worker video-handler tests)
        # Worker `src/__tests__/handlers/local/video-*.test.ts` spawn
        # ffmpeg for fixture generation + assertion. ubuntu-latest does
        # not bundle it, so install via apt-get explicitly. The ~30s
        # install is the cost of actually running the video-processing
        # unit tests in CI.
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo lint

      - name: Lint dependency-cruiser (import-boundary rules)
        # Declarative import-boundary enforcement (CI maximal-strictness
        # guard suite, ADR 2026-06-01) over all packages/*/src via
        # .dependency-cruiser.cjs forbidden rules:
        #   - routes-no-data-layer (#1): a server route must call a
        #     *.service, never a *.repo directly.
        #   - server-no-sync-aigc (#14, PROXY): only the 3 allowlisted SSE
        #     entry points may import the AI SDK.
        #   - library-no-app-import: @breatic/core|shared|domain must NOT
        #     import an application package (@server/@worker/@collab/@web).
        #   - collab-no-domain-import: collab must NOT import @breatic/domain.
        #   - service-no-hono (#2): a *.service.ts must NOT import hono.
        #   - web-layer-pages / -spaces / -features / -stores / -data / -ui /
        #     -base: the frontend layer order app → pages → spaces →
        #     features → stores → data → ui. Generated from one layer list by
        #     webLayerRules(); -base covers the bottom group below ui
        #     (components / theme / i18n / lib), which is one level.
        # Three of the seven web violation edges these rules were written for
        # were type-only, so the config sets tsPreCompilationDeps: true.
        # The three package-boundary rules above were migrated from
        # hand-rolled bash grep guards — dependency-cruiser sees only real
        # imports (not comments), so it can't false-positive on a
        # doc-comment naming a banned alias.
        run: pnpm lint:dependency-cruiser

      - name: Build packages
        run: pnpm turbo build

      - name: Route entries still ship as their own chunks
        # The unit tests pin how routes.tsx is written; this reads what the
        # build emitted, which is what decides a reader's download (#142).
        run: pnpm --filter @breatic/web verify:chunks

      - name: Repo-wide checks (repo-lint)
        # The invariants ESLint structurally cannot hold: they are about
        # files it never parses (SQL, YAML, shell, build output) or about
        # the repository rather than any one file's contents. One step for
        # all of them — each check reports its own findings, and a check
        # that cannot run at all is a failure, never a pass.
        #
        # After the build, because one of these checks reads dist: it
        # asserts no internal alias survived, and an unbuilt tree must
        # not be mistaken for a clean one.
        run: pnpm lint:repo

      - name: Typecheck (all packages)
        # tsc --noEmit across every workspace package (shared / core /
        # worker / collab / server / web). Previously filtered to just
        # server + collab, which silently left the other four packages
        # un-type-checked in CI (their tsup/vite builds transpile via
        # esbuild and do NOT type-check). web gained its typecheck script
        # in this change; backend packages already passed locally.
        run: pnpm turbo typecheck

      - name: Test (all packages)
        # Runs vitest across every workspace package (shared / core /
        # collab / worker / server / web). vitest configs already
        # exclude integration tests (`*.integration.test.ts`) which
        # require live Postgres / Redis; unit tests use mocks.
        run: pnpm turbo test
        env:
          DATABASE_URL: postgres://localhost/test
          REDIS_URL: redis://localhost/0
          REDIS_QUEUE_URL: redis://localhost/1
          REDIS_STREAM_URL: redis://localhost/2

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    # Independent job (no `needs`) so it runs in parallel with
    # lint-typecheck-test and keeps a separate infra-flaky signal; it is
    # included in docker's `needs`: release publication waits for these checks. Every `*.integration.test.ts` suite is excluded
    # from the unit `pnpm turbo test` run, so without this job the
    # real-Postgres invariant tests (credit-deduction atomicity, role-upgrade
    # decide-once, etc.), the transport layer's real-socket cases and the
    # measured crossws ping interval never run on a PR.
    #
    # Two reasons a suite is out here. @breatic/server, @breatic/collab and
    # @breatic/integration-tests want a container (started once per package by
    # the shared setup in @breatic/integration-tests). @breatic/shared wants
    # neither Postgres nor Redis — it binds port 0 on loopback — and is separated
    # because of what it costs everything else: `pnpm test` runs every
    # package at once, and a suite holding servers open for 46 or 65 seconds
    # decides the timeouts of every package running beside it.
    env:
      # The runner is ephemeral and the shared container setup
      # (packages/integration-tests/src/test-utils/containers.ts) already calls
      # .stop() on the containers explicitly, so the Testcontainers Ryuk reaper adds no
      # value here and can be flaky in CI — disable it.
      TESTCONTAINERS_RYUK_DISABLED: "true"

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `turbo run test:integration` builds shared → core → domain first (the
      # integration suites import all three; test:integration dependsOn build,
      # build dependsOn ^build → the whole chain). Testcontainers then spin
      # ephemeral Postgres + Redis on the Docker daemon ubuntu-latest ships
      # with — no `services:` block and no harness change needed. The harness
      # sets every required env var itself (container URLs
      # etc.), so this job needs no `env:` beyond the Ryuk toggle above.
      #
      # No `--filter`: every package declaring the script runs. A filter naming
      # packages one by one turns adding the script to a new package into a
      # silent no-op on CI — the suite would be excluded from `pnpm test` and
      # invoked by nothing, which is indistinguishable from deleting it.
      - name: Integration tests
        run: pnpm turbo run test:integration

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint-typecheck-test, integration-tests, dev-proxy-guard, auth-bypass-residue]

    # PRs and branch pushes build only. Version tags publish exact-tag images.
    # Serialize each tag and never cancel a publication halfway through.
    concurrency:
      group: docker-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Validate release identity
        id: release
        env:
          REF: ${{ github.ref }}
          REVISION: ${{ github.sha }}
        run: |
          node --test scripts/release.test.mjs
          node scripts/release.mjs ci "$REF" "$REVISION" >> "$GITHUB_OUTPUT"
          if [[ "$REF" == refs/tags/* ]]; then
            git merge-base --is-ancestor "$REVISION" origin/main
            node scripts/release.mjs compose-tag "${REF#refs/tags/}" docker-compose.yml
          fi

      - uses: docker/setup-buildx-action@v4

      - name: Build backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.release.outputs.image_tag }}
          build-args: |
            RELEASE_VERSION=${{ steps.release.outputs.version }}
            VCS_REF=${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=breatic
          cache-to: type=gha,mode=max,scope=breatic

      - name: Build web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.web
          platforms: linux/amd64
          push: false
          load: true
          tags: ghcr.io/${{ github.repository }}-web:${{ steps.release.outputs.image_tag }}
          build-args: |
            VITE_RELEASE_VERSION=${{ steps.release.outputs.version }}
            VITE_APP_VERSION=${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=breatic-web
          cache-to: type=gha,mode=max,scope=breatic-web

      - name: Check embedded version metadata
        env:
          BACKEND: ghcr.io/${{ github.repository }}:${{ steps.release.outputs.image_tag }}
          WEB: ghcr.io/${{ github.repository }}-web:${{ steps.release.outputs.image_tag }}
          VERSION: ${{ steps.release.outputs.version }}
          REVISION: ${{ github.sha }}
        run: |
          docker run --rm --entrypoint cat "$BACKEND" /app/build-info.json > backend-info.json
          docker run --rm --entrypoint cat "$WEB" /usr/share/nginx/html/app-version.json > web-info.json
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          for (const file of ['backend-info.json', 'web-info.json']) {
            const info = JSON.parse(readFileSync(file, 'utf8'));
            assert.equal(info.releaseVersion, process.env.VERSION);
            assert.equal(info.revision, process.env.REVISION);
          }
          JS

      # The media container is deployed by wrangler rather than pushed to GHCR,
      # so nothing here needs its image — but nothing else builds it either, and
      # the first thing that would run this Dockerfile is a production deploy.
      # Building it here is what puts its esbuild bundling stage, its apk pins
      # and the GPL artefacts ffmpeg's licence requires under a check.
      - name: Build the media container
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/ingest/Dockerfile
          push: false
          load: true
          tags: breatic-ingest-media:ci
          cache-from: type=gha,scope=ingest-media
          cache-to: type=gha,mode=max,scope=ingest-media

      # What the licence requires has to be in the image, not in the repo: the
      # image is what is distributed. The overview rides along on the same
      # check — this image is the one that is loaded locally on every event,
      # so it is the one a `docker run` can reach without a pull.
      - name: Check the media container carries what GPL requires
        run: |
          docker run --rm --entrypoint sh breatic-ingest-media:ci -c \
            'test -s /usr/share/ffmpeg-source/COPYING.GPLv2 \
             && test -s /usr/share/ffmpeg-source/COPYING.LGPLv2.1 \
             && test -s /usr/share/ffmpeg-source/SOURCE \
             && test -s /usr/share/doc/breatic/THIRD-PARTY.md \
             && cat /usr/share/ffmpeg-source/SOURCE'

      # Reserve the release before the first push. Existing releases (including
      # interrupted drafts) fail rather than silently replacing version images.
      - name: Reserve release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already reserved; use a new version tag." >&2
            exit 1
          fi
          args=()
          if [[ "$TAG" == *-rc.* ]]; then args+=(--prerelease); fi
          gh release create "$TAG" --verify-tag --draft --title "$TAG" --generate-notes "${args[@]}"

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested images and release manifest
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REVISION: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          backend="ghcr.io/$REPOSITORY:$TAG"
          web="ghcr.io/$REPOSITORY-web:$TAG"
          docker push "$backend"
          docker push "$web"
          backend_digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$backend")
          web_digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$web")
          node scripts/release.mjs manifest "$TAG" "$REVISION" "$REPOSITORY" "$backend_digest" "$web_digest" release.json
          gh release upload "$TAG" release.json
          gh release edit "$TAG" --draft=false --latest=false
