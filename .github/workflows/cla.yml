name: CLA

# Every commit author on a pull request has signed CLA.md, or is on the
# allowlist (Orime, Inc. staff and bots). A contributor signs by commenting
# the sentence the bot asks for; signatures are committed to
# signatures/cla.json on the cla-signatures branch, which stays unprotected
# so the action can write to it.
#
# pull_request_target runs this file from the base branch and never checks
# out the pull request's code, so a fork cannot change what runs here.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA signed
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/orime-org/breatic/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: ubiquition,recombyn,*[bot]
