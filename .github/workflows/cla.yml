name: CLA

# Every person on a pull request (its opener, each commit author and each
# Co-authored-by) has accepted the current Breatic CLA, is an Orime, Inc.
# account on a pull request an Orime, Inc. account opened, or has been cleared
# by a maintainer for the pull request's current head. scripts/cla-check.mjs
# decides and writes the required check `CLA signed`; docs/legal/cla/versions.json
# names the current version. Records are on the cla-signatures branch, which
# stays unprotected so this workflow can write to it.
#
# pull_request_target and issue_comment both run this file from the base
# branch, and the job checks out only that branch: no code from a pull request
# is checked out or run here. The pull request is read through the GitHub API.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

permissions:
  checks: write
  contents: write
  pull-requests: write

jobs:
  cla:
    name: CLA check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: node scripts/cla-check.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
