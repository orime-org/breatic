name: Desktop

# Builds the desktop client's installers (#1599): .dmg on macOS, the NSIS
# .exe on Windows, AppImage and .deb on Linux. Each runner builds for its own
# platform. Signing is on only where the secrets exist; without them the
# installers are unsigned builds of the same app.
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']

jobs:
  build:
    name: Desktop ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-workspace

      - name: Build the workspace libraries
        run: pnpm turbo run build --filter=@breatic/desktop^...

      - name: Build and package
        shell: bash
        run: pnpm --filter @breatic/desktop run dist
        env:
          # The address offered on first launch; a repository variable, not source.
          BREATIC_DEFAULT_SERVER_URL: ${{ vars.DESKTOP_DEFAULT_SERVER_URL }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}

      - uses: actions/upload-artifact@v4
        with:
          name: breatic-desktop-${{ matrix.os }}
          path: |
            packages/desktop/release/*.dmg
            packages/desktop/release/*.exe
            packages/desktop/release/*.AppImage
            packages/desktop/release/*.deb
          if-no-files-found: error
