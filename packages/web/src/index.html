<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Breatic - Make Creation as Natural as Breathing" />
    <title>Project - Breatic</title>
    <link rel="icon" type="image/svg+xml" href="/logo-color.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Apply the stored theme before React mounts so a cold load does
      // not flash the default theme then snap to the user's choice
      // (FOUC). Reads the same `breatic.theme` value as
      // `stores/preferences.ts` — update both sites if it changes.
      (function () {
        try {
          var stored = localStorage.getItem('breatic.theme');
          var effective = stored;
          if (stored !== 'dark' && stored !== 'light') {
            effective = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          }
          document.documentElement.dataset.theme = effective;
        } catch (e) {
          // localStorage may throw (private mode, blocked site data);
          // React's ThemeToggle effect will repair on mount.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
