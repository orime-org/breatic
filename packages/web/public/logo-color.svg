<!--
  Breatic logo N1b — brand 彩色 / 透明底 / full-bleed viewBox(留白 4，favicon 与 app icon 用)
  几何来源:marketing/logo/n1b/SPEC.md
  圆环 r=38 stroke-width=5.5 / 两椭圆 rx=18 ry=9 cy=±11.5
  brand 三色:#BC4B36(锈红 圆环)/ #15D45A(cyber lime 上椭圆)/ #0EA5E9(sky-500 下椭圆)
  每个元素显式 fill/stroke 不靠 <g> 继承(避免 raster backend 兼容问题)
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="-42 -42 84 84">
  <circle cx="0" cy="0" r="38" fill="none" stroke="#BC4B36" stroke-width="5.5"/><ellipse cx="0" cy="-11.5" rx="18" ry="9" fill="#15D45A"/><ellipse cx="0" cy="11.5" rx="18" ry="9" fill="#0EA5E9"/>
</svg>
