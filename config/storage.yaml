# Browser upload knobs (#1609 asset slice 2). Served to the frontend via
# GET /assets/upload-config (session-cached).
upload:
  # Hard upload cap (bytes). Frontend rejects oversize files on selection
  # (no network traffic); /assets/upload-ticket enforces it authoritatively
  # (413). Default 2 GiB.
  max_upload_bytes: 2147483648
  # Browser-side attempts, including the first, for the two steps that talk to
  # our own backend: the TICKET request and the FINISH. Transient errors only
  # (a 4xx is taken as a fact). The parts do not read this: they go through the
  # shared HTTP transport, which compiles its own.
  client_max_attempts: 3
  # Base backoff (ms), full-jittered, between those same browser attempts.
  # A part's backoff lives in the shared HTTP transport.
  client_retry_base_delay_ms: 1000
  # How long one part may go without a byte moving, in seconds, before it is
  # cut and sent again. An idle window, not a duration: a slow part that keeps
  # moving runs as long as it needs. A page reads progress from the upload
  # itself; our backend reads it off the socket. 60 is where Uppy's maintainers
  # moved their 30-second default after it cut uploads on slow links.
  upload_idle_timeout_seconds: 60
  # How long the browser waits between asking how its uploads ended, in
  # seconds (inner#1367). Sent as Retry-After on every status answer. A
  # finish takes a few seconds for most files, so asking every couple of
  # seconds puts the result in front of the person about when it lands.
  upload_status_poll_seconds: 2

# The ingest Worker (#173). Every figure it runs on is decided here and sent to
# it, signed into the ticket or carried on every finish and fetch, because a
# Worker cannot read this file and a second copy in
# its own deployment config is a second place for the value to drift.
ingest:
  # One part of a multipart upload, in bytes. R2 refuses a non-final part
  # under 5 MiB, which is the floor `signUploadTicket` enforces.
  #
  # Three things move together when this changes, and 8 MiB is where they were
  # balanced: how many requests one upload costs (a part is one PUT, so the
  # 2 GiB cap is 256 of them at this size), how much is thrown away when one
  # part has to be re-sent, and how many parts the browser can have in flight
  # at once. Halving it doubles the requests to save half a part on a retry;
  # doubling it does the reverse.
  part_size_bytes: 8388608
  # How long the browser has to START the upload. Checked once, when it asks
  # the Worker to begin; an upload already running is never cut off by it.
  ticket_expires_seconds: 300
  # The quality a JPEG or lossy WebP is re-encoded at when a picture shown at an
  # EXIF orientation is turned upright on ingest (1-100). Turning a JPEG
  # re-encodes it; PNG and lossless WebP stay lossless.
  upright_jpeg_quality: 90

# Transfer uploads (inner#1006): a JSON request body larger than
# limits.yaml `request_body_max_bytes` is written to storage as a transfer file
# and the route is sent a reference to it instead. Stored under `transfer/`,
# never registered as an asset; an R2 lifecycle rule deletes it after a day.
transfer:
  # Largest transfer file, per route that accepts one. Counted over the
  # whole file, signature line included; the ticket's size and the read
  # cap use the same count.
  # chat_message: the agent.yaml caps summed (user_message_max_chars plus
  #   reference markers, attachment_max_chars, current_space_max_chars x2
  #   for content and blocks) at up to 6 bytes a character once
  #   JSON.stringify escapes it, plus block metadata and the space list:
  #   about 3.3 MB, rounded up.
  # canvas_paste / node_history_snapshot: a 10 MB document
  #   (collab.yaml max_document_bytes) whose quotes, backslashes and line
  #   breaks JSON.stringify doubles, with margin.
  route_max_bytes:
    chat_message: 4194304
    canvas_paste: 25165824
    node_history_snapshot: 25165824
  # A finished transfer can be referenced only this long, and only once.
  reference_ttl_seconds: 3600
  # How long one user's in-flight transfer read holds its lock.
  read_lock_seconds: 60
  # A reference that finds the lock held tries again every read_lock_retry_ms
  # milliseconds, for up to read_lock_wait_seconds, before answering 429; two
  # large operations of one user arriving together are then read one after
  # the other instead of the second being refused.
  read_lock_wait_seconds: 10
  read_lock_retry_ms: 100
