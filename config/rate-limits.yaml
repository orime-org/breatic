# ── Per-action rate limits (abuse throttles) ────────────────────────
# Redis sliding-window counters. Tunable without a redeploy.
#   max            = requests allowed inside the window
#   window_seconds = window length in seconds
# The key DIMENSION (IP for pre-auth endpoints, user id for post-auth)
# is fixed in code per action for security; only the counts live here.
#
# Every action a route throttles MUST have an entry — a missing action
# fails loudly at startup rather than silently disabling the throttle.

# Auth (pre-auth, IP-keyed)
login:          { max: 5,   window_seconds: 60 }
register:       { max: 10,  window_seconds: 3600 }
google:         { max: 10,  window_seconds: 60 }
forgot:         { max: 3,   window_seconds: 3600 }
reset:          { max: 5,   window_seconds: 3600 }
reset-recovery: { max: 5,   window_seconds: 3600 }
verify-email:   { max: 10,  window_seconds: 60 }
resend-verify:  { max: 1,   window_seconds: 60 }

# Studio (post-auth, user-keyed)
slug-check:     { max: 60,  window_seconds: 60 }
studio-create:  { max: 10,  window_seconds: 3600 }
# Settings edits. Generous enough for normal typo-fixing, but a rename frees
# the old slug for anyone to claim, so a loop that cycles handles to squat on
# them is worth capping.
studio-update:  { max: 30,  window_seconds: 3600 }
# Avatar upload. Every call permanently adds a storage object that runtime
# never deletes, so this caps how much an admin can write to storage.
avatar-upload:  { max: 20,  window_seconds: 3600 }

# Assets (post-auth, user-keyed)
presign:        { max: 30,  window_seconds: 60 }
# Activity-feed report routes (/assets/uploaded, /assets/deleted) —
# fire once per upload / node-delete; 120/60s covers a heavy multi-file
# drag while capping a flood loop against the append-only feed table.
asset-report:   { max: 120, window_seconds: 60 }

# Reading the membership panel. It reconciles with Stripe on every read
# (#106 §10.2), so an unthrottled reader is an unthrottled caller of somebody
# else's API. Sixty a minute leaves the panel feeling instant while capping
# what one account can send outward.
membership-read: { max: 60, window_seconds: 60 }

# Reading the credits overlay. It reconciles unsettled payments with Stripe on
# every read (#13 §4.6), so the same reasoning as membership-read applies: an
# unthrottled reader is an unthrottled caller of somebody else's API.
credits-read: { max: 60, window_seconds: 60 }

# The four things a buyer does to a credit purchase (#13 §4.7). Each one
# reaches Stripe — checkout creates a session, confirm and cancel read or
# expire one — or puts a letter on the wire. Nobody buying credits needs more
# than a handful of tries a minute, and the resend is capped harder because
# each one is an email somebody receives.
payment-checkout: { max: 10, window_seconds: 60 }
payment-confirm: { max: 20, window_seconds: 60 }
payment-cancel: { max: 20, window_seconds: 60 }
payment-resend: { max: 5, window_seconds: 300 }

# The four subscription actions (#106 §7). Each one reaches Stripe: checkout
# creates a Checkout Session, the other three update a subscription. Nothing a
# person does to their own membership needs more than a handful of tries in a
# minute -- clicking "subscribe" ten times in sixty seconds is already well
# past anything the panel asks for -- while an unthrottled caller here spends
# our Stripe rate limit, and Stripe's limit is shared by every account we have.
subscription-write: { max: 10, window_seconds: 60 }
