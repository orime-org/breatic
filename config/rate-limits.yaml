# ── Per-action rate limits (abuse throttles) ────────────────────────
# Redis sliding-window counters. Tunable without a redeploy.
#   max            = requests allowed inside the window
#   window_seconds = window length in seconds
# The key DIMENSION (IP for pre-auth endpoints, user id for post-auth)
# is fixed in code per action for security; only the counts live here.
#
# Every action a route throttles MUST have an entry. A missing one is read
# when that route is first requested, and the request answers 500 — the
# throttle is never silently skipped. The parsed file is held for the life of
# the process, so an edit here reaches a running service on its next start.

# Auth (pre-auth). Keyed by the client address our proxy wrote; the three
# `*-ip` actions pair with an action keyed by that address and the email, so
# people behind one egress address do not use up each other's attempts
# (inner#1478). Numbers follow Auth0 brute-force protection (10 failed attempts
# per address and account), Supabase Auth (30 per 5 minutes per address for sign-up, recovery
# and verification; 150 per 5 minutes for token grants) and Firebase Auth (100
# new accounts an hour per address).
login-ip:       { max: 150, window_seconds: 300 }
login:          { max: 10,  window_seconds: 900 }
register:       { max: 100, window_seconds: 3600 }
register-resend: { max: 30, window_seconds: 300 }
register-verify: { max: 30, window_seconds: 300 }
google:         { max: 150, window_seconds: 300 }
forgot-ip:      { max: 30,  window_seconds: 300 }
forgot:         { max: 3,   window_seconds: 3600 }
reset:          { max: 30,  window_seconds: 300 }
reset-recovery-ip: { max: 30, window_seconds: 300 }
reset-recovery: { max: 5,   window_seconds: 3600 }

# Studio (post-auth, user-keyed)
slug-check:     { max: 60,  window_seconds: 60 }
studio-create:  { max: 10,  window_seconds: 3600 }
# Settings edits. Generous enough for normal typo-fixing, but a rename frees
# the old slug for anyone to claim, so a loop that cycles handles to squat on
# them is worth capping.
studio-update:  { max: 30,  window_seconds: 3600 }

# Assets (post-auth, user-keyed)
# Minting upload tickets, counted per request. A call writes one grant row per
# file and authorises the ingest Worker to accept its bytes; the batch form
# signs every tile of one grid export (up to 64) in a single call. This caps
# how fast one account can put work in front of the Worker and rows in the
# ledger.
upload-ticket:  { max: 30,  window_seconds: 60 }
# The node-delete report route (/assets/deleted) — fires once per delete;
# 120/60s covers clearing out a whole selection while capping a flood loop
# against the append-only feed table.
asset-report:   { max: 120, window_seconds: 60 }
# Finishing one upload (/assets/uploads/{id}/complete), counted per upload.
# One upload needs one of these, and the browser repeats it when an answer
# does not arrive (up to three deliveries), so ten a minute leaves room for
# that and stops one upload being finished over and over. How many uploads one
# person can finish is bounded by the ticket limit: a finish has to carry the
# upload id a ticket handed out, and one ticket request signs a whole grid.
upload-complete: { max: 10, window_seconds: 60 }
# Asking how uploads ended (/assets/upload-status, inner#1367). One request
# covers every upload the page is waiting on, and the page asks once per
# Retry-After (2s), so 60 a minute is two pages' worth from one person.
upload-status:   { max: 60, window_seconds: 60 }

# Handing us an address instead of bytes (#207). One call writes a grant and a
# node task row and puts a fetch of an arbitrary address in front of the ingest
# Worker, so it sits at the ticket rate: the work behind one call is the same
# size, and the ceiling on what it can pull is the same 2 GiB.
ingest-url:     { max: 30,  window_seconds: 60 }

# Keeping a copy of what a text node holds (#2175, post-auth, user-keyed).
# One call writes one row carrying a node's whole body, so a loop is a write
# amplifier on our database. A person pressing Snapshot after each round of
# edits fits well inside 60/60s.
node-history-snapshot: { max: 60,  window_seconds: 60 }

# Pasting or duplicating canvas nodes (inner#1349, post-auth, user-keyed).
# One call registers every resource a copy names and writes a history row per
# copy; a person pastes a handful of times a minute.
canvas-paste:   { max: 60,  window_seconds: 60 }

# Reading a node's media into a text node (#2175, post-auth, user-keyed).
# One call opens a task row per node it names and puts a model call behind it,
# and the rows open before the credit gate so a refusal has somewhere to be
# said. A person pressing Understand on node after node stays well inside
# 30/60s, which is where the two neighbouring write routes sit.
understand:     { max: 30,  window_seconds: 60 }

# Generating (POST /canvas/tasks, post-auth, user-keyed). Same shape as
# Understand: one call opens a task row per node it names and puts a model
# call behind it, and its run-once record (inner#1490) is kept for a day.
generate:       { max: 30,  window_seconds: 60 }

# Running a mini-tool (inner#888, post-auth, user-keyed). Same shape as
# Understand: one call opens a task row per result node and puts a model call
# or a container run behind it.
mini_tool:      { max: 30,  window_seconds: 60 }

# Reading the membership panel. Answered from our own database (#307), and
# each read sums the storage of every studio the account administers. Sixty a
# minute leaves the panel feeling instant while capping what one account can
# make that sum cost.
membership-read: { max: 60, window_seconds: 60 }

# Reading the credits overlay. It reconciles unsettled payments with Stripe on
# every read (#13 §4.6), so an unthrottled reader is an unthrottled caller of
# somebody else's API.
credits-read: { max: 60, window_seconds: 60 }

# The five things a buyer does to a credit purchase (#13 §4.7, #14 §4.7).
# Four reach Stripe — checkout creates a session, confirm and cancel read or
# expire one — or put a letter on the wire. Nobody buying credits needs more
# than a handful of tries a minute, and the resend is capped harder because
# each one is an email somebody receives. The refund ask reaches nobody
# outward, and is capped for what it does on our side: each call opens a
# transaction and takes a row lock, and each one that lands puts a case in
# front of the back office.
payment-checkout: { max: 10, window_seconds: 60 }
payment-confirm: { max: 20, window_seconds: 60 }
payment-cancel: { max: 20, window_seconds: 60 }
payment-resend: { max: 5, window_seconds: 300 }
credits-refund: { max: 20, window_seconds: 60 }

# The four subscription actions (#106 §7). Each one reaches Stripe: checkout
# creates a Checkout Session, the other three update a subscription. Nothing a
# person does to their own membership needs more than a handful of tries in a
# minute -- clicking "subscribe" ten times in sixty seconds is already well
# past anything the panel asks for -- while an unthrottled caller here spends
# our Stripe rate limit, and Stripe's limit is shared by every account we have.
subscription-write: { max: 10, window_seconds: 60 }

# Starting a conversation and creating a project (inner#1490, post-auth,
# user-keyed). Each call writes a row, and its run-once record is kept in
# Redis DB0 for a day, so a loop with a fresh key each time would grow that
# database. A person starts a handful of conversations a minute and creates
# far fewer projects.
conversation-create: { max: 30, window_seconds: 60 }
project-create: { max: 10, window_seconds: 60 }

# Asking a project's owner to let you in (#96, post-auth, user-keyed). The
# one-pending index stops repeats on one project; this caps one account ringing
# the owners of many projects. Each call writes a request row, a bell entry
# and an email.
project-join-request: { max: 20, window_seconds: 3600 }

# The back office's internal API (inner#1410, keyed by connection address:
# nothing proxies the internal port, so the peer address is the caller).
# Applied before the signature check, so a flood of unsigned requests is cut
# off before it spends HMAC work or Redis nonce writes.
internal-api: { max: 120, window_seconds: 60 }
