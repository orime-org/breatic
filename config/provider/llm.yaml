# Where LLM calls go. A model id takes the first route whose prefix
# it starts with; within a route the configured upstream of lowest weight is
# tried first, and a call moves on before its first content when an upstream
# has no key, cannot be reached, keeps answering 408, 409, 429 or 5xx, lacks the model,
# or says its balance is exhausted.
# understand_routes is the same for reading media, the official API first.
# vendor_ids is the id an upstream serves one of our models under.
# openrouter_backends pins the backend OpenRouter routes a model to. prices are
# the direct token prices, in USD per million tokens, for upstreams that report
# no cost of their own.
# gemini_inline_max_bytes is the request size past which media goes to Gemini
# through its Files API rather than inline; gemini_file_poll_ms is how often an
# uploaded file is asked about until it is ready.

routes:
  - prefix: anthropic/
    upstreams:
      - upstream: anthropic
        weight: 0
      - upstream: openrouter
        weight: 1
  - prefix: google/
    upstreams:
      - upstream: google
        weight: 0
      - upstream: openrouter
        weight: 1
  - prefix: openai/
    upstreams:
      - upstream: openai
        weight: 0
      - upstream: openrouter
        weight: 1
  - prefix: deepseek/
    upstreams:
      - upstream: deepseek
        weight: 0
      - upstream: openrouter
        weight: 1
  - prefix: ""
    upstreams:
      - upstream: openrouter
        weight: 0
understand_routes:
  - prefix: google/
    upstreams:
      - upstream: google
        weight: 0
      - upstream: openrouter
        weight: 1
vendor_ids:
  deepseek/deepseek-v4.1-flash-1017:
    deepseek: deepseek-flash
openrouter_backends:
  google/gemini-3.8-flash:
    only:
      - google-vertex
    allow_fallbacks: false
prices:
  deepseek/deepseek-v4-pro:
    input_cache_hit_per_mtok: 0.044
    input_cache_miss_per_mtok: 1.32
    output_per_mtok: 3.96
  deepseek/deepseek-v4.1-flash-1017:
    input_cache_hit_per_mtok: 0.006
    input_cache_miss_per_mtok: 0.3
    output_per_mtok: 1.2
  anthropic/claude-opus-5.5:
    input_cache_hit_per_mtok: 0.2
    input_cache_miss_per_mtok: 4
    input_cache_write_5m_per_mtok: 5
    input_cache_write_1h_per_mtok: 8
    output_per_mtok: 20
  google/gemini-2.5-flash:
    input_cache_hit_per_mtok: 0.03
    input_cache_miss_per_mtok: 0.3
    output_per_mtok: 2.5
  google/gemini-3.8-flash:
    input_cache_hit_per_mtok: 0.075
    input_cache_miss_per_mtok: 0.75
    output_per_mtok: 3.75
gemini_inline_max_bytes: 20000000
gemini_file_poll_ms: 5000
