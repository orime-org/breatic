# Where each of our tts models runs, upstream by upstream.
# Weight is priority: the lowest configured weight is tried first, and weights
# are unique per model. Each binding names the upstream's model id, the field
# the prompt goes in (`send_empty` sends it and every param even when empty),
# and how each of our params is written there: `field`,
# `values` (our value to the upstream's spelling), `item_key` (each list
# entry wrapped under it), `absent_value` (holding it sends nothing) and
# `transform`. A param this upstream has no field for is listed in `drops`:
# "*" serves the run whatever the value. `mentions` is
# how the prompt names a param's sources there ({n} counts from 1, {i} from 0).
# `pricing` is the upstream's contract: base_price in millionths of a USD, a
# JSONata formula (empty means base_price per call), discount_rate the percentage
# of the price charged (100 is full price).

models:
  realtime-tts-2:
    upstreams:
      - upstream: wavespeed
        weight: 1
        model_id: inworld/realtime-tts-2
        prompt_field: text
        params:
          speed:
            field: speaking_rate
          voice_id:
            field: voice_id
        pricing:
          kind: formula
          base_price: 50000
          formula: '{"total_price": $ceil(base_price * $length(text) / 1000)}'
          discount_rate: 100
  gemini-3.1-flash-text-to-speech:
    upstreams:
      - upstream: wavespeed
        weight: 1
        model_id: google/gemini-3.1-flash/text-to-speech
        prompt_field: text
        params:
          language:
            field: language
          speakers:
            field: speakers
          voice_id:
            field: voice
        pricing:
          kind: formula
          base_price: 200000
          formula: '{"total_price": $max([10000, $ceil(base_price * $length(text) / 1000)])}'
          discount_rate: 100
      - upstream: fal
        weight: 2
        model_id: fal-ai/gemini-3.1-flash-tts
        prompt_field: prompt
        params:
          language:
            field: language_code
            values:
              English (United States): English (US)
          speakers:
            field: speakers
            item_fields:
              speaker:
                field: speaker_id
              voice:
                field: voice
          voice_id:
            field: voice
        voice_map:
          voice_id:
            Achernar: Achernar
            Achird: Achird
            Algenib: Algenib
            Algieba: Algieba
            Alnilam: Alnilam
            Aoede: Aoede
            Autonoe: Autonoe
            Callirrhoe: Callirrhoe
            Charon: Charon
            Despina: Despina
            Enceladus: Enceladus
            Erinome: Erinome
            Fenrir: Fenrir
            Gacrux: Gacrux
            Iapetus: Iapetus
            Kore: Kore
            Laomedeia: Laomedeia
            Leda: Leda
            Orus: Orus
            Puck: Puck
            Pulcherrima: Pulcherrima
            Rasalgethi: Rasalgethi
            Sadachbia: Sadachbia
            Sadaltager: Sadaltager
            Schedar: Schedar
            Sulafat: Sulafat
            Umbriel: Umbriel
            Vindemiatrix: Vindemiatrix
            Zephyr: Zephyr
            Zubenelgenubi: Zubenelgenubi
        output_field: audio
        rejects:
          - when: $length(prompt) > 50000
            reason: fal prompt maxLength 50000
          - when: $exists(speakers[$contains(speaker, /[^\w\x80-\uffff]/)])
            reason: fal speakers[].speaker_id pattern ^\w+$
        pricing:
          kind: formula
          base_price: 50000
          formula: '{"total_price": base_price * $length(prompt) / 1000}'
          discount_rate: 100
      - upstream: sandbase
        weight: 3
        model_id: google/gemini-3.1-flash-tts
        prompt_field: prompt
        params:
          language:
            field: language_code
            values:
              English (United States): English (US)
          speakers:
            field: speakers
            item_fields:
              speaker:
                field: speaker_id
              voice:
                field: voice
          voice_id:
            field: voice
        voice_map:
          voice_id:
            Achernar: Achernar
            Achird: Achird
            Algenib: Algenib
            Algieba: Algieba
            Alnilam: Alnilam
            Aoede: Aoede
            Autonoe: Autonoe
