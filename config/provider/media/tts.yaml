            Sulafat: Sulafat
            Umbriel: Umbriel
            Vindemiatrix: Vindemiatrix
            Zephyr: Zephyr
            Zubenelgenubi: Zubenelgenubi
        fixed:
          mode: async
        rejects:
          - when: $length(prompt) > 50000
            reason: SandBase prompt maxLength 50000
          - when: $exists(speakers[$contains(speaker, /[^\w\x80-\uffff]/)])
            reason: "SandBase speakers[].speaker_id: Must be alphanumeric with no whitespace"
        pricing:
          kind: formula
          base_price: 50000
          formula: '{"total_price": $max([1, $ceil($length(prompt) / 1000)]) * base_price}'
          discount_rate: 100
