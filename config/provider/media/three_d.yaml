# Where each of our three d models runs, upstream by upstream.
# Weight is priority: the lowest configured weight is tried first, and weights
# are unique per model. Each binding names the upstream's model id, the field
# the prompt goes in (`send_empty` sends it and every param even when empty),
# and how each of our params is written there: `field`,
# `values` (our value to the upstream's spelling), `item_key` (each list
# entry wrapped under it), `absent_value` (holding it sends nothing) and
# `transform`. A param this upstream has no field for is listed in `drops`:
# "*" serves the run whatever the value. `mentions` is
# how the prompt names a param's sources there ({n} counts from 1, {i} from 0).
# `pricing` is the upstream's contract: base_price in millionths of a USD, a
# JSONata formula (empty means base_price per call), discount_rate the percentage
# of the price charged (100 is full price).

models:
  meshy6-t23d:
    upstreams:
      - upstream: wavespeed
        weight: 1
        model_id: meshy/v6/text-to-3d
        prompt_field: prompt
        send_empty: true
        params:
          topology:
            field: topology
          target_polycount:
            field: target_polycount
          enable_pbr:
            field: enable_pbr
          symmetry_mode:
            field: symmetry_mode
          ta_pose:
            field: pose_mode
            values:
              "true": t-pose
            absent_value: false
        drops:
          art_style:
            all_values: WaveSpeed's schema has no such field; Meshy deprecated art_style (docs.meshy.ai/en/api/text-to-3d)
        rejects:
          - when: $length(prompt) > 600
            reason: WaveSpeed prompt maxLength 600
        pricing:
          kind: formula
          base_price: 1440000
          formula: ""
          discount_rate: 100
      - upstream: fal
        weight: 2
        model_id: fal-ai/meshy/v6/text-to-3d
        prompt_field: prompt
        output_field: model_glb
        params:
          topology:
            field: topology
          target_polycount:
            field: target_polycount
          enable_pbr:
            field: enable_pbr
          symmetry_mode:
            field: symmetry_mode
          ta_pose:
            field: pose_mode
            values:
              "true": t-pose
              "false": ""
        drops:
          art_style:
            all_values: fal has no such field; Meshy deprecated art_style and ignores it (docs.meshy.ai/en/api/text-to-3d, read 2026-11-01)
        rejects:
          - when: $length(prompt) > 600
            reason: fal prompt maxLength 600
        pricing:
          kind: formula
          base_price: 800000
          formula: ""
          discount_rate: 100
  hunyuan3d-v3:
    upstreams:
      - upstream: wavespeed
        weight: 1
        model_id: wavespeed-ai/hunyuan3d-v3/text-to-3d
        prompt_field: prompt
        send_empty: true
        params:
          generate_type:
            field: generate_type
            supported:
              - Normal
              - Geometry
          enable_pbr:
            field: enable_pbr
          face_count:
            field: face_count
        pricing:
          kind: formula
          base_price: 450000
          formula: '{"total_price": base_price + (generate_type = "Geometry" ? 0 : 180000) + (enable_pbr = true ? 180000 : 0)}'
          discount_rate: 100
      - upstream: fal
        weight: 2
        model_id: fal-ai/hunyuan3d-v3/text-to-3d
        prompt_field: prompt
        output_field: model_glb
        params:
          generate_type:
            field: generate_type
          enable_pbr:
            field: enable_pbr
          face_count:
            field: face_count
            absent_value: 500000
        rejects:
          - when: $length(prompt) > 1024
            reason: fal prompt maxLength 1024
        pricing:
          kind: formula
          base_price: 15000
          formula: '{"total_price": base_price * ((generate_type = "Geometry" ? 15 : generate_type = "LowPoly" ? 30 : 25) + ((enable_pbr = true and $not(generate_type = "Geometry")) ? 10 : 0) + (face_count != 500000 ? 10 : 0))}'
          discount_rate: 100
  hunyuan3d-v3-i23d:
    upstreams:
      - upstream: wavespeed
        weight: 1
        model_id: wavespeed-ai/hunyuan3d-v3/image-to-3d
        send_empty: true
        params:
          image:
            field: image
          back_image:
            field: back_image
          left_image:
            field: left_image
          right_image:
            field: right_image
          generate_type:
            field: generate_type
            supported:
              - Normal
              - Geometry
          enable_pbr:
            field: enable_pbr
          face_count:
            field: face_count
        pricing:
          kind: formula
          base_price: 450000
          formula: '{"total_price": base_price + (generate_type = "Geometry" ? 0 : 180000) + (enable_pbr = true ? 180000 : 0) + ((back_image or left_image or right_image) ? 180000 : 0)}'
          discount_rate: 100
      - upstream: fal
        weight: 2
        model_id: fal-ai/hunyuan3d-v3/image-to-3d
        output_field: model_glb
        params:
          image:
            field: input_image_url
          back_image:
            field: back_image_url
          left_image:
            field: left_image_url
          right_image:
            field: right_image_url
          generate_type:
            field: generate_type
          enable_pbr:
            field: enable_pbr
          face_count:
            field: face_count
            absent_value: 500000
        pricing:
          kind: formula
          base_price: 15000
          formula: '{"total_price": base_price * ((generate_type = "Geometry" ? 15 : generate_type = "LowPoly" ? 30 : 25) + ((enable_pbr = true and $not(generate_type = "Geometry")) ? 10 : 0) + ((back_image_url or left_image_url or right_image_url) ? 10 : 0) + (face_count != 500000 ? 10 : 0))}'
          discount_rate: 100
      - upstream: sandbase
        weight: 3
        model_id: tencent/hunyuan-3d/3.0/image-to-3d
        fixed:
          mode: async
        params:
          image:
            field: image
          back_image:
            field: back_image
          left_image:
            field: left_image
          right_image:
            field: right_image
          generate_type:
            field: generate_type
          enable_pbr:
            field: enable_pbr
          face_count:
            field: face_count
            absent_value: 500000
        pricing:
          kind: formula
          base_price: 630000
          formula: '{"total_price": (generate_type = "LowPoly" ? 720000 : generate_type = "Geometry" ? 450000 : base_price) + ((enable_pbr = true and $not(generate_type = "Geometry")) ? 180000 : 0) + ((back_image or left_image or right_image) ? 180000 : 0)}'
          discount_rate: 100
  hunyuan3d-v3.1-rapid:
    upstreams:
      - upstream: wavespeed
        weight: 1
        model_id: wavespeed-ai/hunyuan-3d-v3.1/image-to-3d-rapid
        send_empty: true
        params:
          image:
            field: image
        pricing:
          kind: formula
          base_price: 270000
          formula: ""
          discount_rate: 100
