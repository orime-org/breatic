# Where each of our three d models runs, upstream by upstream.
# Weight is priority: the lowest configured weight is tried first, and weights
# are unique per model. A model's `rejects` are its vendor's own input limits,
# in our param names (the prompt as `prompt`), each with the vendor's words as
# `reason`, the vendor page as `source` and, for a limit announced for a date,
# `from`; no upstream takes a run past them. Each binding names the upstream's
# model id, the field the prompt goes in (`send_empty` sends it and every param
# even when empty), and how each of our params is written there: `field` (dots
# write under nested objects), `values` (our value to the upstream's spelling),
# `as` (a string, a number or a one-item list), `supported` (the only values
# this upstream takes), `item_fields` (the sub-fields of each item of a list),
# `item_key` (each list entry wrapped under it), `absent_value` (holding it
# sends nothing), `unset` (written when the run leaves it out) and `transform`.
# A param this upstream has no field for is listed in `drops`: "*" serves the
# run whatever the value, a list of values that send nothing serves only those,
# { values, equivalent } serves those values for the reason given and
# { all_values } any value for the reason given. `fixed` fields are sent on
# every call, `voice_map` maps our voices to the upstream's, `output_field` is
# where a fal result puts its files, `extra_steps` and `reused_by` are the
# upstream's further calls, and the binding's `rejects` hold only what this
# upstream enforces beyond the vendor. `mentions` is
# how the prompt names a param's sources there ({n} counts from 1, {i} from 0).
# `pricing` is the upstream's contract: base_price in millionths of a USD, a
# JSONata formula (empty means base_price per call), discount_rate the percentage
# of the price charged (100 is full price).

models:
  meshy6-t23d:
    rejects:
      - when: $length(prompt) > 800
        reason: "Meshy prompt: up to 800 characters; longer text returns 400"
        source: https://docs.meshy.ai/en/api/text-to-3d
      - when: target_polycount < 100 or target_polycount > 300000
        reason: "Meshy target_polycount: Remesh range 100 to 300000; a value outside the range returns 400"
        source: https://docs.meshy.ai/en/api/text-to-3d
      - when: target_polycount != $floor(target_polycount)
        reason: "Meshy target_polycount: integer"
        source: https://docs.meshy.ai/en/api/text-to-3d
    upstreams:
      - upstream: wavespeed
        weight: 1
        model_id: meshy/v6/text-to-3d
        prompt_field: prompt
        send_empty: true
        params:
          topology:
            field: topology
          target_polycount:
            field: target_polycount
          enable_pbr:
            field: enable_pbr
          symmetry_mode:
            field: symmetry_mode
          ta_pose:
            field: pose_mode
            values:
              "true": t-pose
            absent_value: false
        drops:
          art_style:
            all_values: WaveSpeed's schema has no such field; Meshy deprecated art_style (docs.meshy.ai/en/api/text-to-3d)
        rejects:
          - when: $length(prompt) > 600
            reason: WaveSpeed prompt maxLength 600
        pricing:
          kind: formula
          base_price: 1440000
          formula: ""
          discount_rate: 100
      - upstream: fal
        weight: 2
        model_id: fal-ai/meshy/v6/text-to-3d
        prompt_field: prompt
        output_field: model_glb
        params:
          topology:
            field: topology
          target_polycount:
            field: target_polycount
          enable_pbr:
            field: enable_pbr
          symmetry_mode:
            field: symmetry_mode
          ta_pose:
            field: pose_mode
            values:
              "true": t-pose
              "false": ""
        drops:
          art_style:
            all_values: fal has no such field; Meshy deprecated art_style and ignores it (docs.meshy.ai/en/api/text-to-3d, read 2026-11-01)
        rejects:
          - when: $length(prompt) > 600
            reason: fal prompt maxLength 600
        pricing:
          kind: formula
          base_price: 800000
          formula: ""
          discount_rate: 100
  hunyuan3d-v3:
    rejects:
      - when: $length(prompt) > 1024
        reason: "Tencent Hunyuan3D Pro Prompt: up to 1024 utf-8 characters"
        source: https://cloud.tencent.com/document/api/1804/123447
      - when: face_count < 3000 or face_count > 1500000
        reason: "Tencent Hunyuan3D Pro FaceCount: value range [3000, 1500000]"
        source: https://cloud.tencent.com/document/api/1804/123447
      - when: face_count != $floor(face_count)
        reason: "Tencent Hunyuan3D Pro FaceCount: Integer"
        source: https://cloud.tencent.com/document/api/1804/123447
    upstreams:
      - upstream: wavespeed
        weight: 1
        model_id: wavespeed-ai/hunyuan3d-v3/text-to-3d
        prompt_field: prompt
        send_empty: true
        params:
          generate_type:
            field: generate_type
            supported:
              - Normal
              - Geometry
          enable_pbr:
            field: enable_pbr
          face_count:
            field: face_count
        pricing:
          kind: formula
          base_price: 450000
          formula: '{"total_price": base_price + (generate_type = "Geometry" ? 0 : 180000) + (enable_pbr = true ? 180000 : 0)}'
          discount_rate: 100
      - upstream: fal
        weight: 2
        model_id: fal-ai/hunyuan3d-v3/text-to-3d
        prompt_field: prompt
        output_field: model_glb
        params:
          generate_type:
            field: generate_type
          enable_pbr:
            field: enable_pbr
          face_count:
            field: face_count
            absent_value: 500000
        pricing:
          kind: formula
          base_price: 15000
          formula: '{"total_price": base_price * ((generate_type = "Geometry" ? 15 : generate_type = "LowPoly" ? 30 : 25) + ((enable_pbr = true and $not(generate_type = "Geometry")) ? 10 : 0) + (face_count != 500000 ? 10 : 0))}'
          discount_rate: 100
  hunyuan3d-v3-i23d:
    rejects:
      - when: face_count < 3000 or face_count > 1500000
        reason: "Tencent Hunyuan3D Pro FaceCount: value range [3000, 1500000]"
        source: https://cloud.tencent.com/document/api/1804/123447
      - when: face_count != $floor(face_count)
        reason: "Tencent Hunyuan3D Pro FaceCount: Integer"
        source: https://cloud.tencent.com/document/api/1804/123447
    upstreams:
      - upstream: wavespeed
        weight: 1
        model_id: wavespeed-ai/hunyuan3d-v3/image-to-3d
        send_empty: true
        params:
          image:
            field: image
          back_image:
            field: back_image
          left_image:
            field: left_image
          right_image:
            field: right_image
          generate_type:
            field: generate_type
            supported:
              - Normal
              - Geometry
          enable_pbr:
            field: enable_pbr
          face_count:
            field: face_count
        pricing:
          kind: formula
          base_price: 450000
          formula: '{"total_price": base_price + (generate_type = "Geometry" ? 0 : 180000) + (enable_pbr = true ? 180000 : 0) + ((back_image or left_image or right_image) ? 180000 : 0)}'
          discount_rate: 100
      - upstream: fal
        weight: 2
        model_id: fal-ai/hunyuan3d-v3/image-to-3d
        output_field: model_glb
        params:
          image:
            field: input_image_url
          back_image:
            field: back_image_url
          left_image:
            field: left_image_url
          right_image:
            field: right_image_url
          generate_type:
            field: generate_type
          enable_pbr:
            field: enable_pbr
          face_count:
            field: face_count
            absent_value: 500000
        pricing:
          kind: formula
          base_price: 15000
          formula: '{"total_price": base_price * ((generate_type = "Geometry" ? 15 : generate_type = "LowPoly" ? 30 : 25) + ((enable_pbr = true and $not(generate_type = "Geometry")) ? 10 : 0) + ((back_image_url or left_image_url or right_image_url) ? 10 : 0) + (face_count != 500000 ? 10 : 0))}'
          discount_rate: 100
      - upstream: sandbase
        weight: 3
        model_id: tencent/hunyuan-3d/3.0/image-to-3d
        fixed:
          mode: async
        params:
          image:
            field: image
          back_image:
            field: back_image
          left_image:
            field: left_image
          right_image:
            field: right_image
          generate_type:
            field: generate_type
          enable_pbr:
            field: enable_pbr
          face_count:
            field: face_count
            absent_value: 500000
        pricing:
          kind: formula
          base_price: 630000
          formula: '{"total_price": (generate_type = "LowPoly" ? 720000 : generate_type = "Geometry" ? 450000 : base_price) + ((enable_pbr = true and $not(generate_type = "Geometry")) ? 180000 : 0) + ((back_image or left_image or right_image) ? 180000 : 0)}'
          discount_rate: 100
  hunyuan3d-v3.1-rapid:
    upstreams:
      - upstream: wavespeed
        weight: 1
        model_id: wavespeed-ai/hunyuan-3d-v3.1/image-to-3d-rapid
        send_empty: true
        params:
          image:
            field: image
        pricing:
          kind: formula
          base_price: 270000
          formula: ""
          discount_rate: 100
