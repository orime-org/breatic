# Where each of our three d models runs, upstream by upstream (design 4.2).
# Weight is priority: the lowest configured weight is tried first, and weights
# are unique per model. Each binding names the upstream's model id, the field
# the prompt goes in (`send_empty_prompt` sends it even when it is empty),
# and how each of our params is written there: `field`,
# `values` (our value to the upstream's spelling), `item_key` (each list
# entry wrapped under it), `absent_value` (holding it sends nothing) and
# `transform`. A param not listed is not sent to that upstream. `mentions` is
# how the prompt names a param's sources there ({n} counts from 1, {i} from 0).
# `pricing` is the upstream's contract: base_price in millionths of a USD, a
# JSONata formula (empty means base_price per call), discount_rate in percent.

models:
  meshy6-t23d:
    upstreams:
      - upstream: wavespeed
        weight: 1
        model_id: wavespeed-ai/meshy6/text-to-3d
        prompt_field: prompt
        send_empty_prompt: true
        params:
          art_style:
            field: art_style
          topology:
            field: topology
          target_polycount:
            field: target_polycount
          enable_pbr:
            field: enable_pbr
          symmetry_mode:
            field: symmetry_mode
          ta_pose:
            field: ta_pose
        pricing:
          kind: formula
          base_price: 800000
          formula: ""
          discount_rate: 100
  hunyuan3d-v3:
    upstreams:
      - upstream: wavespeed
        weight: 1
        model_id: wavespeed-ai/hunyuan3d-v3/text-to-3d
        prompt_field: prompt
        send_empty_prompt: true
        params:
          generate_type:
            field: generate_type
          enable_pbr:
            field: enable_pbr
          face_count:
            field: face_count
        pricing:
          kind: formula
          base_price: 250000
          formula: ""
          discount_rate: 100
  hunyuan3d-v3-i23d:
    upstreams:
      - upstream: wavespeed
        weight: 1
        model_id: wavespeed-ai/hunyuan3d-v3/image-to-3d
        prompt_field: prompt
        send_empty_prompt: true
        params:
          image:
            field: image
          back_image:
            field: back_image
          left_image:
            field: left_image
          right_image:
            field: right_image
          generate_type:
            field: generate_type
          enable_pbr:
            field: enable_pbr
          face_count:
            field: face_count
        pricing:
          kind: formula
          base_price: 230000
          formula: ""
          discount_rate: 100
  hunyuan3d-v3.1-rapid:
    upstreams:
      - upstream: wavespeed
        weight: 1
        model_id: wavespeed-ai/hunyuan-3d-v3.1/image-to-3d-rapid
        prompt_field: prompt
        send_empty_prompt: true
        params:
          image:
            field: image
        pricing:
          kind: formula
          base_price: 20000
          formula: ""
          discount_rate: 100
