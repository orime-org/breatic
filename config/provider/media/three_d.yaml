# Where each of our three d models runs, upstream by upstream.
# Weight is priority: the lowest configured weight is tried first, and weights
# are unique per model. A model's `rejects` are its vendor's own input limits,
# in our param names (the prompt as `prompt`), each with the vendor's words as
# `reason`, the vendor page as `source` and, for a limit announced for a date,
# `from`; no upstream takes a run past them. Each binding names the upstream's
# model id, the field the prompt goes in (`send_empty` sends it and every param
# even when empty), and how each of our params is written there: `field` (dots
# write under nested objects), `values` (our value to the upstream's spelling),
# `as` (a string, a number or a one-item list), `supported` (the only values
# this upstream takes), `item_fields` (the sub-fields of each item of a list),
# `item_key` (each list entry wrapped under it), `absent_value` (holding it
# sends nothing), `unset` (written when the run leaves it out) and `transform`.
# A param this upstream has no field for is listed in `drops`: "*" serves the
# run whatever the value, a list of values that send nothing serves only those,
# { values, equivalent } serves those values for the reason given and
# { all_values } any value for the reason given. `fixed` fields are sent on
# every call, `voice_map` maps our voices to the upstream's, `output_field` is
# where a fal result puts its files, `extra_steps` and `reused_by` are the
# upstream's further calls, and the binding's `rejects` hold only what this
# upstream enforces beyond the vendor. `mentions` is
# how the prompt names a param's sources there ({n} counts from 1, {i} from 0).
# `pricing` is the upstream's contract: base_price in millionths of a USD, a
# JSONata formula (empty means base_price per call), discount_rate the percentage
# of the price charged (100 is full price).

models:
  tripo-h3.1-t23d:
    rejects:
      - when: generate_parts = true and smart_low_poly = true
        reason: "Tripo generate_parts: Not compatible with smart_low_poly; smart_low_poly takes precedence and parts are NOT produced"
        source: https://developers.tripo3d.com/en/docs/generation-text-to-model/standard.md
    upstreams:
      - upstream: wavespeed
        weight: 1
        model_id: tripo3d/h3.1/text-to-3d
        prompt_field: prompt
        params:
          texture:
            field: texture
          pbr:
            field: pbr
          texture_quality:
            field: texture_quality
          texture_version:
            field: texture_version
            values:
              v3.0: v3.0-20250812
              v3.5: v3.5-20260815
          delight:
            field: delight
          geometry_quality:
            field: geometry_quality
          smart_low_poly:
            field: smart_low_poly
          generate_parts:
            field: generate_parts
          face_limit:
            field: face_limit
          auto_size:
            field: auto_size
          export_uv:
            field: export_uv
          model_seed:
            field: model_seed
          texture_seed:
            field: texture_seed
          negative_prompt:
            field: negative_prompt
        rejects:
          - when: $type(face_limit) = "number" and face_limit < 48
            reason: "WaveSpeed face_limit: minimum 48"
        pricing:
          kind: formula
          base_price: 120000
          formula: '{"total_price": base_price + (((texture or pbr) and generate_parts != true) ? (texture_quality = "detailed" ? 240000 : (texture_quality = "extreme" ? 360000 : 120000)) : 0) + (geometry_quality = "detailed" ? 240000 : 0) + (smart_low_poly ? 120000 : 0) + (generate_parts ? 240000 : 0)}'
          discount_rate: 100
      - upstream: fal
        weight: 2
        model_id: tripo3d/h3.1/text-to-3d
        prompt_field: prompt
        output_field: model_mesh
        params:
          texture:
            field: texture
          pbr:
            field: pbr
          texture_quality:
            field: texture_quality
            supported:
              - standard
              - detailed
          geometry_quality:
            field: geometry_quality
          face_limit:
            field: face_limit
          auto_size:
            field: auto_size
          model_seed:
            field: model_seed
          texture_seed:
            field: texture_seed
          negative_prompt:
            field: negative_prompt
        drops:
          texture_version:
            values:
              - v3.0
            equivalent: fal has no texture_version field; Tripo derives texture v3.0-20250812 from the v3.x geometry model when none is sent (developers.tripo3d.com text-to-model, texture_version)
          delight: []
          smart_low_poly:
            - false
          generate_parts:
            - false
          export_uv:
            values:
              - true
            equivalent: fal has no export_uv field; Tripo's own default is true (developers.tripo3d.com text-to-model, export_uv)
        rejects:
          - when: face_limit < 1000
            reason: "fal face_limit: minimum 1000"
        pricing:
          kind: formula
          base_price: 10000
          formula: '{"total_price": base_price * (((texture or pbr) ? (texture_quality = "detailed" ? 30 : 20) : 10) + (geometry_quality = "detailed" ? 20 : 0))}'
          discount_rate: 100
      - upstream: sandbase
        weight: 3
        model_id: tripo3d/tripo-h3.1/text-to-3d
        prompt_field: prompt
        fixed:
          mode: async
        params:
          texture:
            field: texture
          pbr:
            field: pbr
          texture_quality:
            field: texture_quality
            supported:
              - standard
              - detailed
          geometry_quality:
            field: geometry_quality
          face_limit:
            field: face_limit
          model_seed:
            field: seed
          negative_prompt:
            field: negative_prompt
        drops:
          texture_version:
            values:
              - v3.0
            equivalent: SandBase has no texture_version field; Tripo derives texture v3.0-20250812 from the v3.x geometry model when none is sent (developers.tripo3d.com text-to-model, texture_version)
          delight: []
          smart_low_poly:
            - false
          generate_parts:
            - false
          export_uv:
            values:
              - true
            equivalent: SandBase has no export_uv field; Tripo's own default is true (developers.tripo3d.com text-to-model, export_uv)
          auto_size:
            - false
          texture_seed: []
        rejects:
          - when: face_limit < 1000
            reason: "SandBase face_limit: minimum 1000"
        pricing:
          kind: formula
          base_price: 120000
          formula: '{"total_price": base_price + ((texture or pbr) ? (texture_quality = "detailed" ? 240000 : 120000) : 0) + (geometry_quality = "detailed" ? 240000 : 0)}'
          discount_rate: 100
