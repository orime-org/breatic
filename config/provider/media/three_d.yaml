# Where each of our three d models runs, upstream by upstream.
# Weight is priority: the lowest configured weight is tried first, and weights
# are unique per model. Each binding names the upstream's model id, the field
# the prompt goes in (`send_empty` sends it and every param even when empty),
# and how each of our params is written there: `field`,
# `values` (our value to the upstream's spelling), `item_key` (each list
# entry wrapped under it), `absent_value` (holding it sends nothing) and
# `transform`. A param not listed is not sent to that upstream. `mentions` is
# how the prompt names a param's sources there ({n} counts from 1, {i} from 0).
# `pricing` is the upstream's contract: base_price in millionths of a USD, a
# JSONata formula (empty means base_price per call), discount_rate the percentage
# of the price charged (100 is full price).

models:
  tripo-h3.1-t23d:
    upstreams:
      - upstream: wavespeed
        weight: 1
        model_id: tripo3d/h3.1/text-to-3d
        prompt_field: prompt
        params:
          texture:
            field: texture
          pbr:
            field: pbr
          texture_quality:
            field: texture_quality
          texture_version:
            field: texture_version
            values: &a1
              v3.0: v3.0-20250812
              v3.5: v3.5-20260815
          delight:
            field: delight
          geometry_quality:
            field: geometry_quality
          smart_low_poly:
            field: smart_low_poly
          generate_parts:
            field: generate_parts
          face_limit:
            field: face_limit
          auto_size:
            field: auto_size
          export_uv:
            field: export_uv
          model_seed:
            field: model_seed
          texture_seed:
            field: texture_seed
          negative_prompt:
            field: negative_prompt
        extra_steps:
          - kind: rig
            endpoint: tripo3d/rig
            at: after
            for_param: rig_skeleton
            optional: true
            pricing:
              kind: formula
              base_price: 300000
              formula: ""
              discount_rate: 100
        pricing:
          kind: formula
          base_price: 120000
          formula: '{"total_price": base_price + (((texture or pbr) and generate_parts != true) ? (texture_quality = "detailed" ? 240000 : (texture_quality = "extreme" ? 360000 : 120000)) : 0) + (geometry_quality = "detailed" ? 240000 : 0) + (smart_low_poly ? 120000 : 0) + (generate_parts ? 240000 : 0)}'
          discount_rate: 100
  tripo-h3.1-i23d:
    upstreams:
      - upstream: wavespeed
        weight: 1
        model_id: tripo3d/h3.1/image-to-3d
        params:
          image:
            field: image
          texture:
            field: texture
          pbr:
            field: pbr
          texture_quality:
            field: texture_quality
          texture_version:
            field: texture_version
            values: *a1
          delight:
            field: delight
          geometry_quality:
            field: geometry_quality
          smart_low_poly:
            field: smart_low_poly
          generate_parts:
            field: generate_parts
          face_limit:
            field: face_limit
          auto_size:
            field: auto_size
          export_uv:
            field: export_uv
          model_seed:
            field: model_seed
          texture_seed:
            field: texture_seed
          texture_alignment:
            field: texture_alignment
          orientation:
            field: orientation
          enable_image_autofix:
            field: enable_image_autofix
        extra_steps:
          - kind: rig
            endpoint: tripo3d/rig
            at: after
            for_param: rig_skeleton
            optional: true
            pricing:
              kind: formula
              base_price: 300000
              formula: ""
              discount_rate: 100
        pricing:
          kind: formula
          base_price: 240000
          formula: '{"total_price": base_price + (((texture or pbr) and generate_parts != true) ? (texture_quality = "detailed" ? 240000 : (texture_quality = "extreme" ? 360000 : 120000)) : 0) + (geometry_quality = "detailed" ? 240000 : 0) + (smart_low_poly ? 120000 : 0) + (generate_parts ? 240000 : 0)}'
          discount_rate: 100
  tripo-h3.1-multiview:
    upstreams:
      - upstream: wavespeed
        weight: 1
        model_id: tripo3d/h3.1/multiview-to-3d
        params:
          images:
            field: images
          texture:
            field: texture
          pbr:
            field: pbr
          texture_quality:
            field: texture_quality
          texture_version:
            field: texture_version
            values: *a1
          delight:
            field: delight
          geometry_quality:
            field: geometry_quality
          smart_low_poly:
            field: smart_low_poly
          generate_parts:
            field: generate_parts
          face_limit:
            field: face_limit
          auto_size:
            field: auto_size
          export_uv:
            field: export_uv
          model_seed:
            field: model_seed
          texture_seed:
            field: texture_seed
          texture_alignment:
            field: texture_alignment
          orientation:
            field: orientation
          enable_image_autofix:
            field: enable_image_autofix
        extra_steps:
          - kind: rig
            endpoint: tripo3d/rig
            at: after
            for_param: rig_skeleton
            optional: true
            pricing:
              kind: formula
              base_price: 300000
              formula: ""
              discount_rate: 100
        pricing:
          kind: formula
          base_price: 240000
          formula: '{"total_price": base_price + (((texture or pbr) and generate_parts != true) ? (texture_quality = "detailed" ? 240000 : (texture_quality = "extreme" ? 360000 : 120000)) : 0) + (geometry_quality = "detailed" ? 240000 : 0) + (smart_low_poly ? 120000 : 0) + (generate_parts ? 240000 : 0)}'
          discount_rate: 100
