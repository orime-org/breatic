# Where each of our video models runs, upstream by upstream.
# Weight is priority: the lowest configured weight is tried first, and weights
# are unique per model. Each binding names the upstream's model id, the field
# the prompt goes in (`send_empty` sends it and every param even when empty),
# and how each of our params is written there: `field`,
# `values` (our value to the upstream's spelling), `item_key` (each list
# entry wrapped under it), `absent_value` (holding it sends nothing) and
# `transform`. A param this upstream has no field for is listed in `drops`:
# "*" serves the run whatever the value. `mentions` is
# how the prompt names a param's sources there ({n} counts from 1, {i} from 0).
# `pricing` is the upstream's contract: base_price in millionths of a USD, a
# JSONata formula (empty means base_price per call), discount_rate the percentage
# of the price charged (100 is full price).

models:
  gemini-omni-1.1-flash-text-to-video:
    upstreams:
      - upstream: wavespeed
        weight: 1
        model_id: google/gemini-omni-1.1-flash/text-to-video
        prompt_field: prompt
        params:
          aspect_ratio:
            field: aspect_ratio
          duration:
            field: duration
          resolution:
            field: resolution
        drops:
          shots: "*"
        pricing:
          kind: formula
          base_price: 100000
          formula: '{"total_price": base_price * (duration ? duration : 8) * (resolution = "360p" ? 0.3 : resolution = "1080p" ? 1.5 : resolution = "4k" ? 3 : 1)}'
          discount_rate: 100
      - upstream: fal
        weight: 2
        model_id: google/gemini-omni-flash/v1.1/text-to-video
        prompt_field: prompt
        output_field: video
        params:
          aspect_ratio:
            field: aspect_ratio
          duration:
            field: duration
          resolution:
            field: resolution
        drops:
          shots: "*"
        rejects:
          - when: $length(prompt) > 20000
            reason: fal prompt maxLength 20000
        pricing:
          kind: formula
          base_price: 30000
          formula: '{"total_price": base_price * duration * (resolution = "720p" ? 10 / 3 : resolution = "1080p" ? 5 : resolution = "4k" ? 10 : 1)}'
          discount_rate: 100
      - upstream: sandbase
        weight: 3
        model_id: google/gemini-omni-flash/1.1/text-to-video
        prompt_field: prompt
        params:
          aspect_ratio:
            field: aspect_ratio
          duration:
            field: duration
          resolution:
            field: resolution
        drops:
          shots: "*"
        fixed:
          mode: async
        rejects:
          - when: $length(prompt) > 20000
            reason: SandBase prompt maxLength 20000
        pricing:
          kind: formula
          base_price: 100000
          formula: '{"total_price": base_price * duration * (resolution = "360p" ? 0.3 : resolution = "1080p" ? 1.5 : resolution = "4k" ? 3 : 1)}'
          discount_rate: 100
  wan-3.0-text-to-video:
    upstreams:
      - upstream: wavespeed
        weight: 1
        model_id: alibaba/wan-3.0/text-to-video
        prompt_field: prompt
        params:
          aspect_ratio:
            field: aspect_ratio
          duration:
            field: duration
          generate_audio:
            field: generate_audio
          resolution:
            field: resolution
        drops:
          shots: "*"
        pricing:
          kind: formula
          base_price: 500000
          formula: '{"total_price": base_price * (resolution = "1080p" ? 2 : (resolution = "480p" ? 0.5 : 1)) * $min([$max([$ceil(duration), 2]), 30]) / 5}'
          discount_rate: 95
      - upstream: fal
