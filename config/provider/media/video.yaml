                field: duration
                as: string
          shot_type:
            field: shot_type
          auto_shots:
            field: shot_type
            values:
              "true": intelligent
            absent_value: false
          negative_prompt:
            field: negative_prompt
            unset: ""
          generate_audio:
            field: generate_audio
