# Where each of our video models runs, upstream by upstream.
# Weight is priority: the lowest configured weight is tried first, and weights
# are unique per model. A model's `rejects` are its vendor's own input limits,
# in our param names (the prompt as `prompt`), each with the vendor's words as
# `reason`, the vendor page as `source` and, for a limit announced for a date,
# `from`; no upstream takes a run past them. Each binding names the upstream's
# model id, the field the prompt goes in (`send_empty` sends it and every param
# even when empty), and how each of our params is written there: `field` (dots
# write under nested objects), `values` (our value to the upstream's spelling),
# `as` (a string, a number or a one-item list), `supported` (the only values
# this upstream takes), `item_fields` (the sub-fields of each item of a list),
# `item_key` (each list entry wrapped under it), `absent_value` (holding it
# sends nothing), `unset` (written when the run leaves it out) and `transform`.
# A param this upstream has no field for is listed in `drops`: "*" serves the
# run whatever the value, a list of values that send nothing serves only those,
# { values, equivalent } serves those values for the reason given and
# { all_values } any value for the reason given. `fixed` fields are sent on
# every call, `voice_map` maps our voices to the upstream's, `output_field` is
# where a fal result puts its files, `extra_steps` and `reused_by` are the
# upstream's further calls, and the binding's `rejects` hold only what this
# upstream enforces beyond the vendor. `mentions` is
# how the prompt names a param's sources there ({n} counts from 1, {i} from 0).
# `pricing` is the upstream's contract: base_price in millionths of a USD, a
# JSONata formula (empty means base_price per call), discount_rate the percentage
# of the price charged (100 is full price).

models:
  gemini-omni-1.1-flash-text-to-video:
    upstreams:
      - upstream: wavespeed
        weight: 1
        model_id: google/gemini-omni-1.1-flash/text-to-video
        prompt_field: prompt
        params:
          aspect_ratio:
            field: aspect_ratio
          duration:
            field: duration
          resolution:
            field: resolution
        drops:
          shots: "*"
        pricing:
          kind: formula
          base_price: 100000
          formula: '{"total_price": base_price * (duration ? duration : 8) * (resolution = "360p" ? 0.3 : resolution = "1080p" ? 1.5 : resolution = "4k" ? 3 : 1)}'
          discount_rate: 100
      - upstream: fal
        weight: 2
        model_id: google/gemini-omni-flash/v1.1/text-to-video
        prompt_field: prompt
        output_field: video
        params:
          aspect_ratio:
            field: aspect_ratio
          duration:
            field: duration
          resolution:
            field: resolution
        drops:
          shots: "*"
        rejects:
          - when: $length(prompt) > 20000
            reason: fal prompt maxLength 20000
        pricing:
          kind: formula
          base_price: 30000
          formula: '{"total_price": base_price * duration * (resolution = "720p" ? 10 / 3 : resolution = "1080p" ? 5 : resolution = "4k" ? 10 : 1)}'
          discount_rate: 100
      - upstream: sandbase
        weight: 3
        model_id: google/gemini-omni-flash/1.1/text-to-video
        prompt_field: prompt
        params:
          aspect_ratio:
            field: aspect_ratio
          duration:
            field: duration
          resolution:
            field: resolution
        drops:
          shots: "*"
        fixed:
          mode: async
        rejects:
          - when: $length(prompt) > 20000
            reason: SandBase prompt maxLength 20000
        pricing:
          kind: formula
          base_price: 100000
          formula: '{"total_price": base_price * duration * (resolution = "360p" ? 0.3 : resolution = "1080p" ? 1.5 : resolution = "4k" ? 3 : 1)}'
          discount_rate: 100
  wan-3.0-text-to-video:
    rejects:
      - when: $length(prompt) > 20000
        reason: "Alibaba Wan3.0 prompt: maximum of 20,000 characters (content beyond it is truncated)"
        source: https://www.alibabacloud.com/help/en/model-studio/wan3-video-generation-api-reference
      - when: duration < 2 or duration > 30 or duration != $floor(duration)
        reason: "Alibaba Wan3.0 duration: without video input, an integer in the range [2, 30]"
        source: https://www.alibabacloud.com/help/en/model-studio/wan3-video-generation-api-reference
    upstreams:
      - upstream: wavespeed
        weight: 1
        model_id: alibaba/wan-3.0/text-to-video
        prompt_field: prompt
        params:
          aspect_ratio:
            field: aspect_ratio
          duration:
            field: duration
          generate_audio:
            field: generate_audio
          resolution:
            field: resolution
        drops:
          shots: "*"
        pricing:
          kind: formula
          base_price: 500000
          formula: '{"total_price": base_price * (resolution = "1080p" ? 2 : (resolution = "480p" ? 0.5 : 1)) * $min([$max([$ceil(duration), 2]), 30]) / 5}'
          discount_rate: 95
      - upstream: fal
        weight: 2
        model_id: alibaba/wan-3.0/text-to-video
        prompt_field: prompt
        output_field: video
        params:
          aspect_ratio:
            field: aspect_ratio
          duration:
            field: duration
          generate_audio:
            field: audio
          resolution:
            field: resolution
        drops:
          shots: "*"
        fixed:
          enable_prompt_expansion: false
        pricing:
          kind: formula
          base_price: 50000
          formula: '{"total_price": base_price * duration * (resolution = "1080p" ? 4 : resolution = "720p" ? 2 : 1)}'
          discount_rate: 100
  seedance-2.5-text-to-video:
    rejects:
      - when: get_duration(videos) > 30
        reason: "Seedance 2.5 reference videos: up to 10 reference videos with a total duration of no more than 30 seconds"
        source: https://docs.byteplus.com/en/docs/ModelArk/1520757
      - when: get_duration(videos, min=2, max=1000000, total=1000000) > get_duration(videos)
        reason: "Seedance 2.5 reference videos: Non-video-editing tasks: each video must be 2-30 seconds long"
        source: https://docs.byteplus.com/en/docs/ModelArk/1520757
      - when: get_duration(audios) > 30
        reason: "Seedance 2.5 reference audio: up to 10 clips, total duration no more than 30 seconds"
        source: https://docs.byteplus.com/en/docs/ModelArk/1520757
      - when: get_duration(audios, min=2, max=1000000, total=1000000) > get_duration(audios)
        reason: "Seedance 2.5 reference audio: each audio clip must be 2-30 seconds long"
        source: https://docs.byteplus.com/en/docs/ModelArk/1520757
      - when: duration < 4 or duration > 30 or duration != $floor(duration)
        reason: "Seedance 2.5 duration: integer, supports [4, 30] or -1"
        source: https://docs.byteplus.com/en/docs/ModelArk/1520757
    upstreams:
      - upstream: wavespeed
        weight: 1
        model_id: bytedance/seedance-2.5/text-to-video
        prompt_field: prompt
        params:
          aspect_ratio:
            field: aspect_ratio
          duration:
            field: duration
          generate_audio:
            field: generate_audio
          audios:
            field: reference_audios
          images:
            field: reference_images
          videos:
            field: reference_videos
          resolution:
            field: resolution
        drops:
          style_images: "*"
          shots: "*"
        mentions:
          audios: "@audio{n}"
          images: "@image{n}"
          videos: "@video{n}"
        pricing:
          kind: formula
          base_price: 900000
          formula: '{"total_price": ($scale := (resolution = "4k" ? 10 : resolution = "1080p" ? 5 : resolution = "720p" ? 2 : 1); $count(reference_videos) > 0 ? ($reference_duration := $min([$ceil(get_duration(reference_videos, min=2, max=30, total=30)), 30]); 110000 * $scale * ($max([2, $reference_duration]) + (duration ? duration : $max([4, $reference_duration])))) : base_price * $scale * duration / 5)}'
          discount_rate: 90
      - upstream: fal
        weight: 2
        model_id: bytedance/seedance-2.5/us/text-to-video
        prompt_field: prompt
        output_field: video
        params:
          aspect_ratio:
            field: aspect_ratio
          duration:
            field: duration
            as: string
          generate_audio:
            field: generate_audio
          resolution:
            field: resolution
            supported: ["480p", "720p", "1080p"]
        drops:
          audios: []
          images: []
          videos: []
          style_images: "*"
          shots: "*"
        mentions:
          images: "@image{n}"
        pricing:
          kind: formula
          base_price: 21400
          formula: '{"total_price": base_price * duration * (resolution = "1080p" ? 1.164 : resolution = "480p" ? 0.2205 : 0.473) / 0.0214}'
          discount_rate: 100
      - upstream: sandbase
        weight: 3
        model_id: bytedance/seedance/2.5/text-to-video
        prompt_field: prompt
        params:
          aspect_ratio:
            field: aspect_ratio
          duration:
            field: duration
          generate_audio:
            field: generate_audio
          resolution:
            field: resolution
            supported: ["480p", "720p", "1080p"]
        drops:
          audios: []
          images: []
          videos: []
          style_images: "*"
          shots: "*"
        mentions:
          images: "@image{n}"
        fixed:
          mode: async
        rejects:
          - when: $length(prompt) > 50000
            reason: SandBase prompt maxLength 50000
          - when: $length(prompt) < 3
            reason: SandBase prompt minLength 3
        pricing:
          kind: formula
          base_price: 360000
          formula: '{"total_price": base_price * duration * (resolution = "1080p" ? 2.5 : resolution = "480p" ? 0.5 : 1)}'
          discount_rate: 100
