            field: aspect_ratio
          duration:
            field: duration
          multi_prompt:
            field: multi_prompt
          shot_type:
            field: shot_type
          auto_shots:
            field: shot_type
            values:
              "true": intelligence
            absent_value: false
          negative_prompt:
            field: negative_prompt
          generate_audio:
            field: sound
        pricing:
          kind: formula
          base_price: 2100000
          formula: '{"total_price": base_price * duration / 5}'
