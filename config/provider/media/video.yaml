            absent_value: false
          negative_prompt:
            field: negative_prompt
          generate_audio:
            field: sound
        pricing:
          kind: formula
          base_price: 2100000
          formula: '{"total_price": base_price * duration / 5}'
          discount_rate: 100
      - upstream: fal
        weight: 2
        model_id: fal-ai/kling-video/v3/4k/text-to-video
