              - 1080p
        drops:
          audios: []
          images: []
          videos: []
          style_images: "*"
          shots: "*"
        mentions:
          images: "@image{n}"
        pricing:
          kind: formula
          base_price: 21400
          formula: '{"total_price": base_price * duration * (resolution = "1080p" ? 1.164 : resolution = "480p" ? 0.2205 : 0.473) / 0.0214}'
          discount_rate: 100
      - upstream: sandbase
        weight: 3
        model_id: bytedance/seedance/2.5/text-to-video
