            field: aspect_ratio
          duration:
            field: duration
          generate_audio:
            field: generate_audio
          resolution:
            field: resolution
            supported:
              - 480p
              - 720p
              - 1080p
        drops:
          audios: []
          images: []
          videos: []
          style_images: "*"
          shots: "*"
        mentions:
          images: "@image{n}"
        fixed:
          mode: async
        rejects:
          - when: $length(prompt) > 50000
            reason: SandBase prompt maxLength 50000
          - when: $length(prompt) < 3
            reason: SandBase prompt minLength 3
        pricing:
          kind: formula
          base_price: 360000
          formula: '{"total_price": base_price * duration * (resolution = "1080p" ? 2.5 : resolution = "480p" ? 0.5 : 1)}'
