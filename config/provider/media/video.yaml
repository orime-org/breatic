# Where each of our video models runs, upstream by upstream (design 4.2).
# Weight is priority: the lowest configured weight is tried first, and weights
# are unique per model. Each binding names the upstream's model id, the field
# the prompt goes in (`send_empty` sends it and every param even when empty),
# and how each of our params is written there: `field`,
# `values` (our value to the upstream's spelling), `item_key` (each list
# entry wrapped under it), `absent_value` (holding it sends nothing) and
# `transform`. A param not listed is not sent to that upstream. `mentions` is
# how the prompt names a param's sources there ({n} counts from 1, {i} from 0).
# `pricing` is the upstream's contract: base_price in millionths of a USD, a
# JSONata formula (empty means base_price per call), discount_rate in percent.

models:
  gemini-omni-1.1-flash-text-to-video:
    upstreams:
      - upstream: wavespeed
        weight: 1
        model_id: google/gemini-omni-1.1-flash/text-to-video
        prompt_field: prompt
        params:
          aspect_ratio:
            field: aspect_ratio
          duration:
            field: duration
          resolution:
            field: resolution
          shots:
            field: shots
        pricing:
          kind: formula
          base_price: 100000
          formula: '{"total_price": base_price * (duration ? duration : 8) * (resolution = "360p" ? 0.3 : resolution = "1080p" ? 1.5 : resolution = "4k" ? 3 : 1)}'
          discount_rate: 100
  wan-3.0-text-to-video:
    upstreams:
      - upstream: wavespeed
        weight: 1
        model_id: alibaba/wan-3.0/text-to-video
        prompt_field: prompt
        params:
          aspect_ratio:
            field: aspect_ratio
          duration:
            field: duration
          generate_audio:
            field: enable_audio
          resolution:
            field: resolution
          shots:
            field: shots
        pricing:
          kind: formula
          base_price: 500000
          formula: '{"total_price": base_price * (resolution = "1080p" ? 2 : (resolution = "480p" ? 0.5 : 1)) * $min([$max([$ceil(duration), 2]), 30]) / 5}'
          discount_rate: 95
  seedance-2.5-text-to-video:
    upstreams:
      - upstream: wavespeed
        weight: 1
        model_id: bytedance/seedance-2.5/text-to-video
        prompt_field: prompt
        params:
          aspect_ratio:
            field: aspect_ratio
          duration:
            field: duration
          generate_audio:
            field: generate_audio
          audios:
            field: reference_audios
          images:
            field: reference_images
          videos:
            field: reference_videos
          resolution:
            field: resolution
          shots:
            field: shots
        mentions:
          audios: "@audio{n}"
          images: "@image{n}"
          videos: "@video{n}"
        pricing:
          kind: formula
          base_price: 900000
          formula: '{"total_price": ($scale := (resolution = "4k" ? 10 : resolution = "1080p" ? 5 : resolution = "720p" ? 2 : 1); $count(reference_videos) > 0 ? ($reference_duration := $min([$ceil(get_duration(reference_videos, min=2, max=30, total=30)), 30]); 110000 * $scale * ($max([2, $reference_duration]) + (duration ? duration : $max([4, $reference_duration])))) : base_price * $scale * duration / 5)}'
          discount_rate: 90
  minimax-h3-text-to-video:
    upstreams:
      - upstream: wavespeed
        weight: 1
        model_id: minimax/h3/text-to-video
        prompt_field: prompt
        params:
          aspect_ratio:
            field: aspect_ratio
          duration:
            field: duration
          resolution:
            field: resolution
          shots:
            field: shots
        pricing:
          kind: formula
          base_price: 700000
          formula: '{"total_price": $min([duration, 15]) / 5 * base_price * (resolution = "768p" ? 5 / 7 : 1)}'
          discount_rate: 100
