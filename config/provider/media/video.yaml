  seedance-2.5-text-to-video:
    upstreams:
      - upstream: wavespeed
        weight: 1
        model_id: bytedance/seedance-2.5/text-to-video
        prompt_field: prompt
        params:
          aspect_ratio:
            field: aspect_ratio
          duration:
            field: duration
          generate_audio:
            field: generate_audio
          audios:
            field: reference_audios
