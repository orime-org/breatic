# Where each of our audio models runs, upstream by upstream.
# Weight is priority: the lowest configured weight is tried first, and weights
# are unique per model. Each binding names the upstream's model id, the field
# the prompt goes in (`send_empty` sends it and every param even when empty),
# and how each of our params is written there: `field`,
# `values` (our value to the upstream's spelling), `item_key` (each list
# entry wrapped under it), `absent_value` (holding it sends nothing) and
# `transform`. A param this upstream has no field for is listed in `drops`:
# "*" serves the run whatever the value. `mentions` is
# how the prompt names a param's sources there ({n} counts from 1, {i} from 0).
# `pricing` is the upstream's contract: base_price in millionths of a USD, a
# JSONata formula (empty means base_price per call), discount_rate the percentage
# of the price charged (100 is full price).

models:
  mureka-v9.5-generate-song:
    upstreams:
      - upstream: wavespeed
        weight: 1
        model_id: mureka-ai/mureka-v9.5/generate-song
        prompt_field: prompt
        params:
          lyrics:
            field: lyrics
          melody:
            field: melody_id
          song:
            field: reference_id
          vocal:
            field: vocal_id
        extra_steps:
          - kind: upload_reference
            endpoint: mureka-ai/create-upload-id
            at: before
            for_param: song
            pricing:
              kind: formula
              base_price: 10000
              formula: ""
              discount_rate: 100
          - kind: upload_melody
            endpoint: mureka-ai/create-upload-id
            at: before
            for_param: melody
            pricing:
              kind: formula
              base_price: 10000
              formula: ""
              discount_rate: 100
          - kind: vocal
            endpoint: mureka-ai/vocal-clone
            at: before
            for_param: vocal
            reused: true
            pricing:
              kind: formula
              base_price: 7500000
              formula: ""
              discount_rate: 100
        pricing:
          kind: formula
          base_price: 225000
          formula: ""
          discount_rate: 100
      - upstream: fal
        weight: 2
        model_id: mureka/v9.5/generate/song
        prompt_field: prompt
        output_field: audio
        params:
          lyrics:
            field: lyrics
          melody:
            field: melody_id
          song:
            field: reference_id
          vocal:
            field: vocal_id
        extra_steps:
          - kind: upload_reference
            endpoint: mureka/api/files/upload
            at: before
            for_param: song
            pricing:
              kind: formula
              base_price: 10000
              formula: ""
              discount_rate: 100
          - kind: upload_melody
            endpoint: mureka/api/files/upload
            at: before
            for_param: melody
            pricing:
              kind: formula
              base_price: 10000
              formula: ""
              discount_rate: 100
          - kind: vocal
            endpoint: mureka/api/voice/clone
            at: before
            for_param: vocal
            reused: true
            pricing:
              kind: formula
              base_price: 5000000
              formula: ""
              discount_rate: 100
        rejects:
          - when: $length(prompt) > 2000
            reason: fal prompt maxLength 2000
          - when: $exists(melody_id) and ($exists(prompt) or $exists(reference_id) or $exists(vocal_id))
            reason: "fal melody_id: This cannot be combined with prompt, reference_id, or vocal_id"
          - when: $not($exists(prompt) or $exists(lyrics))
            reason: "fal prompt: Required when lyrics is omitted"
          - when: $exists(lyrics) and $length(prompt) > 1024
            reason: "fal prompt: With lyrics, it acts as a music-style control and supports up to 1,024 characters"
          - when: $length(lyrics) > 5000
            reason: fal lyrics maxLength 5000
        pricing:
          kind: formula
          base_price: 5000
          formula: '{"total_price": base_price * (lyrics ? 30 : 100)}'
          discount_rate: 100
  mureka-v9.5-generate-bgm:
    upstreams:
      - upstream: wavespeed
        weight: 1
        model_id: mureka-ai/mureka-v9.5/generate-bgm
        prompt_field: prompt
        pricing:
          kind: formula
          base_price: 225000
          formula: ""
          discount_rate: 100
      - upstream: fal
        weight: 2
        model_id: mureka/v9.5/generate/instrumental
        prompt_field: prompt
        output_field: audio
        rejects:
          - when: $length(prompt) > 1024
            reason: fal prompt maxLength 1024
        pricing:
          kind: formula
          base_price: 5000
          formula: '{"total_price": base_price * 30}'
          discount_rate: 100
  lyria-3-pro-music:
    upstreams:
      - upstream: wavespeed
        weight: 1
        model_id: google/lyria-3-pro/music
        prompt_field: prompt
        params:
          image:
            field: image
        pricing:
          kind: formula
          base_price: 80000
          formula: ""
          discount_rate: 100
      - upstream: fal
        weight: 2
        model_id: fal-ai/lyria3/pro
        prompt_field: prompt
        output_field: audio
        params:
          image:
            field: image_url
        rejects:
          - when: $length(prompt) > 5000
            reason: fal prompt maxLength 5000
        pricing:
          kind: formula
          base_price: 80000
          formula: ""
          discount_rate: 100
  minimax-music-cover:
    upstreams:
      - upstream: wavespeed
        weight: 1
        model_id: minimax/music-cover
        prompt_field: prompt
        params:
          audio:
            field: audio
        pricing:
          kind: formula
          base_price: 150000
          formula: ""
          discount_rate: 100
  sonilo-video-to-music:
    upstreams:
      - upstream: wavespeed
        weight: 1
        model_id: sonilo/video-to-music
        prompt_field: prompt
        params:
          video:
            field: video
        pricing:
          kind: formula
          base_price: 9000
          formula: '{"total_price": base_price * $max([10, $min([$ceil(get_duration(video)), 360])])}'
          discount_rate: 100
  sfx-1.6-text-to-audio:
    upstreams:
      - upstream: wavespeed
        weight: 1
        model_id: mirelo-ai/sfx-1.6/text-to-audio
        prompt_field: text_prompt
        params:
          duration:
            field: duration
          num_samples:
            field: num_samples
        drops:
          loop:
            - false
          double_output:
            - false
        pricing:
          kind: formula
          base_price: 10000
          formula: '{"total_price": base_price * duration * num_samples}'
          discount_rate: 100
      - upstream: fal
        weight: 2
        model_id: mirelo-ai/sfx1.6/text-to-audio
        prompt_field: text_prompt
        output_field: audio
        params:
          loop:
            field: ambience
          double_output:
            field: double_output
          duration:
            field: duration
          num_samples:
            field: num_samples
        rejects:
          - when: ambience = true and duration < 1
            reason: "fal duration: The minimum is 0.1s for ordinary sound effects and 1s when ambience=true"
        pricing:
          kind: formula
          base_price: 10000
          formula: '{"total_price": base_price * duration * num_samples}'
          discount_rate: 100
  sonilo-sfx-v1:
    upstreams:
      - upstream: wavespeed
        weight: 1
        model_id: sonilo/v1/text-to-sfx
        prompt_field: prompt
        params:
          audio_format:
            field: audio_format
          duration:
            field: duration
        pricing:
          kind: formula
          base_price: 2000
          formula: '{"total_price": base_price * $max([3, $min([duration, 180])])}'
          discount_rate: 100
  hunyuan-video-foley:
    upstreams:
      - upstream: wavespeed
        weight: 1
        model_id: wavespeed-ai/hunyuan-video-foley
        prompt_field: prompt
        params:
          video:
            field: video
        pricing:
          kind: formula
          base_price: 50000
          formula: ""
          discount_rate: 100
      - upstream: fal
        weight: 2
        model_id: fal-ai/hunyuan-video-foley
        prompt_field: text_prompt
        send_empty: true
        output_field: video
        params:
          video:
            field: video_url
        pricing:
          kind: formula
          base_price: 100000
          formula: '{"total_price": base_price * $max([1, $ceil(get_duration(video_url) / 10)])}'
          discount_rate: 100
  vocal-remover:
    upstreams:
      - upstream: wavespeed
        weight: 1
        model_id: wavespeed-ai/audio-vocal-isolator
        params:
          audio:
            field: audio
        pricing:
          kind: formula
          base_price: 1000
          formula: '{"total_price": $min([$ceil(get_duration(audio)), 600]) * base_price}'
          discount_rate: 100
  veed-clean-audio:
    upstreams:
      - upstream: fal
        weight: 2
        model_id: veed/clean-audio
        output_field: audio
        params:
          audio:
            field: audio_url
          strength:
            field: strength
          target_lufs:
            field: target_lufs
          output_format:
            field: output_format
        pricing:
          kind: formula
          base_price: 12500
          formula: '{"total_price": $min([$max([$ceil(get_duration(audio_url) / 60), 1]), 30]) * base_price}'
          discount_rate: 100
  sfx-1.6-extend-audio:
    upstreams:
      - upstream: fal
        weight: 2
        model_id: mirelo-ai/sfx1.6/extend-audio
        prompt_field: text_prompt
        output_field: audio
        params:
          ambience:
            field: ambience
          append_duration:
            field: append_duration
          audio:
            field: audio_url
          double_output:
            field: double_output
          num_samples:
            field: num_samples
        rejects:
          - when: get_duration(audio_url) > 59
            reason: "fal audio_url: The prefix duration must be 3–59 seconds"
          - when: get_duration(audio_url, min=3, max=1000000, total=1000000) > get_duration(audio_url)
            reason: "fal audio_url: The prefix duration must be 3–59 seconds"
          - when: get_duration(audio_url) + append_duration > 60
            reason: "fal audio_url: the total output (prefix + append_duration) is capped at 60 seconds"
        pricing:
          kind: formula
          base_price: 10000
          formula: '{"total_price": base_price * append_duration * num_samples}'
          discount_rate: 100
