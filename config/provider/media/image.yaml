# Where each of our image models runs, upstream by upstream.
# Weight is priority: the lowest configured weight is tried first, and weights
# are unique per model. Each binding names the upstream's model id, the field
# the prompt goes in (`send_empty` sends it and every param even when empty),
# and how each of our params is written there: `field`,
# `values` (our value to the upstream's spelling), `item_key` (each list
# entry wrapped under it), `absent_value` (holding it sends nothing) and
# `transform`. A param this upstream has no field for is listed in `drops`:
# "*" serves the run whatever the value. `mentions` is
# how the prompt names a param's sources there ({n} counts from 1, {i} from 0).
# `pricing` is the upstream's contract: base_price in millionths of a USD, a
# JSONata formula (empty means base_price per call), discount_rate the percentage
# of the price charged (100 is full price).

models:
  gpt-image-2.5-sunburst-text-to-image:
    upstreams:
      - upstream: wavespeed
        weight: 1
        model_id: openai/gpt-image-2.5-sunburst/text-to-image
        prompt_field: prompt
        params:
          aspect_ratio:
            field: aspect_ratio
          quality:
            field: quality
          resolution:
            field: resolution
        pricing:
          kind: formula
          base_price: 24000
          formula: '{"total_price": ((quality = "low") ? (resolution = "4k" ? 30000 : (resolution = "2k" ? 20000 : 10000)) : ((quality = "high") ? (resolution = "4k" ? 270000 : (resolution = "2k" ? 150000 : 90000)) : ((quality = "xhigh") ? (resolution = "4k" ? 480000 : (resolution = "2k" ? 270000 : 160000)) : ((quality = "max") ? (resolution = "4k" ? 1000000 : (resolution = "2k" ? 600000 : 360000)) : (resolution = "4k" ? 70000 : (resolution = "2k" ? 40000 : 24000))))))}'
          discount_rate: 100
      - upstream: fal
        weight: 2
        model_id: openai/gpt-image-2.5/sunburst/text-to-image
        prompt_field: prompt
        output_field: images
        params:
          aspect_ratio:
            field: image_size
            values:
              1:1: square_hd
              4:3: landscape_4_3
              3:4: portrait_4_3
              16:9: landscape_16_9
              9:16: portrait_16_9
            supported:
              - 1:1
              - 4:3
              - 3:4
              - 16:9
              - 9:16
          quality:
            field: quality
        drops:
          resolution:
            - 1k
        pricing:
          kind: formula
          base_price: 1000000
          formula: '{"total_price": base_price * $lookup((image_size in ["4:3", "3:4"]) ? {"low": 0.00402, "medium": 0.00903, "high": 0.03612, "xhigh": 0.0642, "max": 0.14445} : ((image_size in ["16:9", "9:16"]) ? {"low": 0.00441, "medium": 0.00951, "high": 0.03945, "xhigh": 0.07014, "max": 0.1578} : {"low": 0.00588, "medium": 0.01317, "high": 0.05268, "xhigh": 0.09366, "max": 0.21072}), $exists(quality) ? quality : "high")}'
          discount_rate: 100
      - upstream: sandbase
        weight: 3
        model_id: openai/gpt-image-2.5-sunburst
        prompt_field: prompt
        params:
          aspect_ratio:
            field: aspect_ratio
          quality:
            field: quality
          resolution:
            field: resolution
        fixed:
          mode: async
        pricing:
          kind: formula
          base_price: 90000
          formula: '{"total_price": (quality = "low") ? (resolution = "4k" ? 30000 : (resolution = "2k" ? 20000 : 10000)) : ((quality = "medium") ? (resolution = "4k" ? 70000 : (resolution = "2k" ? 40000 : 24000)) : ((quality = "xhigh") ? (resolution = "4k" ? 480000 : (resolution = "2k" ? 270000 : 160000)) : ((quality = "max") ? (resolution = "4k" ? 1000000 : (resolution = "2k" ? 600000 : 360000)) : (resolution = "4k" ? 270000 : (resolution = "2k" ? 150000 : 90000)))))}'
          discount_rate: 100
  grok-imagine-image-v2.0-text-to-image:
    upstreams:
      - upstream: wavespeed
        weight: 1
        model_id: x-ai/grok-imagine-image-v2.0/text-to-image
        prompt_field: prompt
        params:
          aspect_ratio:
            field: aspect_ratio
          resolution:
            field: resolution
        pricing:
          kind: formula
