# Where each of our image models runs, upstream by upstream (design 4.2).
# Weight is priority: the lowest configured weight is tried first, and weights
# are unique per model. Each binding names the upstream's model id, the field
# the prompt goes in (`send_empty_prompt` sends it even when it is empty),
# and how each of our params is written there: `field`,
# `values` (our value to the upstream's spelling), `item_key` (each list
# entry wrapped under it), `absent_value` (holding it sends nothing) and
# `transform`. A param not listed is not sent to that upstream. `mentions` is
# how the prompt names a param's sources there ({n} counts from 1, {i} from 0).
# `pricing` is the upstream's contract: base_price in millionths of a USD, a
# JSONata formula (empty means base_price per call), discount_rate in percent.

models:
  gpt-image-2.5-sunburst-text-to-image:
    upstreams:
      - upstream: wavespeed
        weight: 1
        model_id: openai/gpt-image-2.5-sunburst/text-to-image
        prompt_field: prompt
        params:
          aspect_ratio:
            field: aspect_ratio
          quality:
            field: quality
          resolution:
            field: resolution
        pricing:
          kind: formula
          base_price: 24000
          formula: '{"total_price": ((quality = "low") ? (resolution = "4k" ? 30000 : (resolution = "2k" ? 20000 : 10000)) : ((quality = "high") ? (resolution = "4k" ? 270000 : (resolution = "2k" ? 150000 : 90000)) : ((quality = "xhigh") ? (resolution = "4k" ? 480000 : (resolution = "2k" ? 270000 : 160000)) : ((quality = "max") ? (resolution = "4k" ? 1000000 : (resolution = "2k" ? 600000 : 360000)) : (resolution = "4k" ? 70000 : (resolution = "2k" ? 40000 : 24000))))))}'
          discount_rate: 100
  grok-imagine-image-v2.0-text-to-image:
    upstreams:
      - upstream: wavespeed
        weight: 1
        model_id: x-ai/grok-imagine-image-v2.0/text-to-image
        prompt_field: prompt
        params:
          aspect_ratio:
            field: aspect_ratio
          resolution:
            field: resolution
        pricing:
          kind: formula
          base_price: 50000
          formula: ""
          discount_rate: 100
  nano-banana-2:
    upstreams:
      - upstream: wavespeed
        weight: 1
        model_id: google/nano-banana-2/text-to-image
        prompt_field: prompt
        params:
          aspect_ratio:
            field: aspect_ratio
          enable_image_search:
            field: enable_image_search
          enable_web_search:
            field: enable_web_search
          resolution:
            field: resolution
        pricing:
          kind: formula
          base_price: 70000
          formula: '{"total_price": ((resolution = "0.5k" ? 45000 : base_price * (resolution = "2k" ? 1.5 : (resolution = "4k" ? 2 : 1))) + (enable_web_search ? 14000 : 0) + (enable_image_search ? 14000 : 0)) }'
          discount_rate: 90
  nano-banana-2-relight:
    upstreams:
      - upstream: wavespeed
        weight: 1
        model_id: google/nano-banana-2/edit
        prompt_field: prompt
        params:
          aspect_ratio:
            field: aspect_ratio
            absent_value: auto
          images:
            field: images
          output_format:
            field: output_format
          resolution:
            field: resolution
        pricing:
          kind: formula
          base_price: 70000
          formula: '{"total_price": (resolution = "0.5k" ? 45000 : (resolution = "2k" ? 105000 : (resolution = "4k" ? 140000 : base_price)))}'
          discount_rate: 100
  nano-banana-2-quick-edit:
    upstreams:
      - upstream: wavespeed
        weight: 1
        model_id: google/nano-banana-2/edit
        prompt_field: prompt
        params:
          images:
            field: images
          output_format:
            field: output_format
          resolution:
            field: resolution
        pricing:
          kind: formula
          base_price: 70000
          formula: '{"total_price": (resolution = "0.5k" ? 45000 : (resolution = "2k" ? 105000 : (resolution = "4k" ? 140000 : base_price)))}'
          discount_rate: 100
  recraft-v4.1-pro-text-to-vector:
    upstreams:
      - upstream: wavespeed
        weight: 1
        model_id: recraft-ai/recraft-v4.1-pro/text-to-vector
        prompt_field: prompt
        params:
          aspect_ratio:
            field: image_size
        pricing:
          kind: formula
          base_price: 300000
          formula: ""
          discount_rate: 100
  riverflow-2.0-pro-text-to-image:
    upstreams:
      - upstream: wavespeed
        weight: 1
        model_id: sourceful/riverflow-2.0-pro/text-to-image
        prompt_field: prompt
        params:
          aspect_ratio:
            field: aspect_ratio
          resolution:
            field: resolution
          transparency:
            field: transparency
        pricing:
          kind: formula
          base_price: 150000
          formula: '{"total_price": base_price * (resolution = "4k" ? 11/5 : 1)}'
          discount_rate: 100
  krea-v2-large-text-to-image:
    upstreams:
      - upstream: wavespeed
        weight: 1
        model_id: wavespeed-ai/krea-v2-large/text-to-image
        prompt_field: prompt
        params:
          aspect_ratio:
            field: aspect_ratio
          creativity:
            field: creativity
          style_images:
            field: reference
            item_key: image
        pricing:
          kind: formula
          base_price: 60000
          formula: '{"total_price": base_price + (($count(reference) > 0) ? 5000 : 0)}'
          discount_rate: 100
  ideogram-v3-quality:
    upstreams:
      - upstream: wavespeed
        weight: 1
        model_id: ideogram-ai/ideogram-v3-quality
        prompt_field: prompt
        params:
          aspect_ratio:
            field: aspect_ratio
          rendering:
            field: style
          style_images:
            field: reference_images
        pricing:
          kind: formula
          base_price: 90000
          formula: ""
          discount_rate: 100
  recraft-v4-style-text-to-image:
    upstreams:
      - upstream: wavespeed
        weight: 1
        model_id: recraft-ai/recraft-v4-style/text-to-image
        prompt_field: prompt
        params:
          aspect_ratio:
            field: aspect_ratio
          style_match:
            field: style_match
          style_images:
            field: images
        pricing:
          kind: formula
          base_price: 38500
          formula: '{"total_price": base_price + (($exists(images) and $count(images) > 0) ? 5500 : 0)}'
          discount_rate: 100
  gpt-image-2.5-sunburst-edit:
    upstreams:
      - upstream: wavespeed
        weight: 1
        model_id: openai/gpt-image-2.5-sunburst/edit
        prompt_field: prompt
        params:
          aspect_ratio:
            field: aspect_ratio
            absent_value: auto
          images:
            field: images
          quality:
            field: quality
          resolution:
            field: resolution
        mentions:
          images: image {n}
        pricing:
          kind: formula
          base_price: 39000
          formula: '{"total_price": ((quality = "low") ? (resolution = "4k" ? 45000 : (resolution = "2k" ? 35000 : 25000)) : ((quality = "high") ? (resolution = "4k" ? 285000 : (resolution = "2k" ? 165000 : 105000)) : ((quality = "xhigh") ? (resolution = "4k" ? 495000 : (resolution = "2k" ? 285000 : 175000)) : ((quality = "max") ? (resolution = "4k" ? 1015000 : (resolution = "2k" ? 615000 : 375000)) : (resolution = "4k" ? 85000 : (resolution = "2k" ? 55000 : 39000)))))) + (($count(images) - 1) * 15000)}'
          discount_rate: 100
  muse-image-edit:
    upstreams:
      - upstream: wavespeed
        weight: 1
        model_id: meta/muse-image/edit
        prompt_field: prompt
        params:
          aspect_ratio:
            field: aspect_ratio
            absent_value: auto
          images:
            field: image_urls
          output_format:
            field: output_format
        mentions:
          images: image {n}
        pricing:
          kind: formula
          base_price: 11000
          formula: ""
          discount_rate: 100
  nano-banana-pro-edit-ultra:
    upstreams:
      - upstream: wavespeed
        weight: 1
        model_id: google/nano-banana-pro/edit-ultra
        prompt_field: prompt
        params:
          aspect_ratio:
            field: aspect_ratio
            absent_value: auto
          images:
            field: images
          resolution:
            field: resolution
        mentions:
          images: image {n}
        pricing:
          kind: formula
          base_price: 150000
          formula: '{"total_price": base_price * (resolution = "4k" ? 1 : (resolution = "8k" ? 1.2 : 1))}'
          discount_rate: 100
  qwen-image-edit-multiple-angles:
    upstreams:
      - upstream: wavespeed
        weight: 1
        model_id: wavespeed-ai/qwen-image/edit-multiple-angles
        prompt_field: prompt
        params:
          distance:
            field: distance
          horizontal_angle:
            field: horizontal_angle
          images:
            field: images
          output_format:
            field: output_format
          vertical_angle:
            field: vertical_angle
        mentions:
          images: image {n}
        pricing:
          kind: formula
          base_price: 25000
          formula: ""
          discount_rate: 100
  pro-upscaler:
    upstreams:
      - upstream: wavespeed
        weight: 1
        model_id: clarity-ai/pro-upscaler
        params:
          creativity:
            field: creativity
          image:
            field: image
          target_megapixels:
            field: target_megapixels
        pricing:
          kind: formula
          base_price: 30000
          formula: '{"total_price": base_price * target_megapixels}'
          discount_rate: 100
  bria-remove-background:
    upstreams:
      - upstream: wavespeed
        weight: 1
        model_id: bria/remove-background
        params:
          image:
            field: image
        pricing:
          kind: formula
          base_price: 18000
          formula: ""
          discount_rate: 100
  bria-genfill:
    upstreams:
      - upstream: wavespeed
        weight: 1
        model_id: bria/fibo-edit/genfill
        prompt_field: prompt
        params:
          image:
            field: image
          mask_image:
            field: mask_image
        pricing:
          kind: formula
          base_price: 40000
          formula: ""
          discount_rate: 100
  bria-eraser:
    upstreams:
      - upstream: wavespeed
        weight: 1
        model_id: bria/eraser
        params:
          image:
            field: image
          mask_image:
            field: mask_image
        pricing:
          kind: formula
          base_price: 40000
          formula: ""
          discount_rate: 100
  seedream-v4.5-edit:
    upstreams:
      - upstream: wavespeed
        weight: 1
