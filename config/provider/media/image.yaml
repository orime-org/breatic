# Where each of our image models runs, upstream by upstream.
# Weight is priority: the lowest configured weight is tried first, and weights
# are unique per model. A model's `rejects` are its vendor's own input limits,
# in our param names (the prompt as `prompt`), each with the vendor's words as
# `reason`, the vendor page as `source` and, for a limit announced for a date,
# `from`; no upstream takes a run past them. Each binding names the upstream's
# model id, the field the prompt goes in (`send_empty` sends it and every param
# even when empty), and how each of our params is written there: `field` (dots
# write under nested objects), `values` (our value to the upstream's spelling),
# `as` (a string, a number or a one-item list), `supported` (the only values
# this upstream takes), `item_fields` (the sub-fields of each item of a list),
# `item_key` (each list entry wrapped under it), `absent_value` (holding it
# sends nothing), `unset` (written when the run leaves it out) and `transform`.
# A param this upstream has no field for is listed in `drops`: "*" serves the
# run whatever the value, a list of values that send nothing serves only those,
# { values, equivalent } serves those values for the reason given and
# { all_values } any value for the reason given. `fixed` fields are sent on
# every call, `voice_map` maps our voices to the upstream's, `output_field` is
# where a fal result puts its files, `extra_steps` and `reused_by` are the
# upstream's further calls, and the binding's `rejects` hold only what this
# upstream enforces beyond the vendor. `mentions` is
# how the prompt names a param's sources there ({n} counts from 1, {i} from 0).
# `pricing` is the upstream's contract: base_price in millionths of a USD, a
# JSONata formula (empty means base_price per call), discount_rate the percentage
# of the price charged (100 is full price).

models:
  gpt-image-2.5-sunburst-text-to-image:
    rejects:
      - when: $length(prompt) > 32000
        reason: 'OpenAI GPT Image prompt: "The maximum length is 32000 characters"'
        source: https://developers.openai.com/api/reference/resources/images/methods/generate.md
    upstreams:
      - upstream: wavespeed
        weight: 1
        model_id: openai/gpt-image-2.5-sunburst/text-to-image
        prompt_field: prompt
        params:
          aspect_ratio:
            field: aspect_ratio
          quality:
            field: quality
          resolution:
            field: resolution
        pricing:
          kind: formula
          base_price: 24000
          formula: '{"total_price": ((quality = "low") ? (resolution = "4k" ? 30000 : (resolution = "2k" ? 20000 : 10000)) : ((quality = "high") ? (resolution = "4k" ? 270000 : (resolution = "2k" ? 150000 : 90000)) : ((quality = "xhigh") ? (resolution = "4k" ? 480000 : (resolution = "2k" ? 270000 : 160000)) : ((quality = "max") ? (resolution = "4k" ? 1000000 : (resolution = "2k" ? 600000 : 360000)) : (resolution = "4k" ? 70000 : (resolution = "2k" ? 40000 : 24000))))))}'
          discount_rate: 100
      - upstream: fal
        weight: 2
        model_id: openai/gpt-image-2.5/sunburst/text-to-image
        prompt_field: prompt
        output_field: images
        params:
          aspect_ratio:
            field: image_size
            values:
              1:1: square_hd
            supported:
              - 1:1
          quality:
            field: quality
        drops:
          resolution:
            values:
              - 1k
            equivalent: fal square_hd 1024x1024 equals WaveSpeed 1k at 1:1 (measured 1024x1024; 4:3 is 1184x880)
        pricing:
          kind: formula
          base_price: 1000000
          formula: '{"total_price": base_price * ($lookup({"low": 0.00588, "medium": 0.01317, "high": 0.05268, "xhigh": 0.09366, "max": 0.21072}, quality) + 0.000005 * ($length(prompt) - 0.75 * $length($replace(prompt, /[^\x00-\x7F]/, ""))))}'
          discount_rate: 100
      - upstream: sandbase
        weight: 3
        model_id: openai/gpt-image-2.5-sunburst
        prompt_field: prompt
        params:
          aspect_ratio:
            field: aspect_ratio
          quality:
            field: quality
          resolution:
            field: resolution
        fixed:
          mode: async
        rejects:
          - when: $length(prompt) < 3
            reason: SandBase prompt minLength 3
        pricing:
          kind: formula
          base_price: 90000
          formula: '{"total_price": (quality = "low") ? (resolution = "4k" ? 30000 : (resolution = "2k" ? 20000 : 10000)) : ((quality = "medium") ? (resolution = "4k" ? 70000 : (resolution = "2k" ? 40000 : 24000)) : ((quality = "xhigh") ? (resolution = "4k" ? 480000 : (resolution = "2k" ? 270000 : 160000)) : ((quality = "max") ? (resolution = "4k" ? 1000000 : (resolution = "2k" ? 600000 : 360000)) : (resolution = "4k" ? 270000 : (resolution = "2k" ? 150000 : 90000)))))}'
          discount_rate: 100
