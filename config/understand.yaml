# Reading a node's media into text (#2175).
#
# The canvas path has its own figures rather than the agent's, because the two
# runs differ in what is waiting on them: the agent holds a conversation open
# while it reads up to five pieces of media in turn, and a canvas run is one
# press producing one task that nobody is watching.

# The largest file a run will take, in bytes, for images, video and audio
# alike. What this server will carry, not what the endpoint would accept:
# video and audio are downloaded here, base64'd and held inside a JSON body,
# so one call at this ceiling occupies several times it in memory.
#
# The browser refuses a larger file before it builds anything, and says this
# number — so it is the figure a reader is told, and 20 MiB is what "20 MB"
# means to the file manager they got the file from.
max_media_bytes: 20971520

# There is no time figure here: a canvas reading is a task, and its fetch, the
# read of the body and the model call each get what is left of the task's
# deadline (inner#1367, `default_budget_ms` in config/node-tasks.yaml).

# How much the model may write about one piece of media, in tokens.
# What it writes is the whole of what the new text node holds, and a reader
# who asked for a description of a video is reading all of it.
max_output_tokens: 8192

# How much a transcription may write, in tokens (inner#856). Separate from the
# figure above because a transcript can be much longer than a description:
# a measured 21-minute speech sample produced 5290 tokens. The byte limit
# does not imply a duration limit; formats and bitrates vary.
transcribe_max_output_tokens: 65536

# How many readings one worker process holds in memory at once.
# The tasks queue runs many jobs at a time, and each reading here may hold up
# to max_media_bytes several times over. A reading that finds every place
# taken goes back to the queue and comes back one poll interval later.
max_concurrent: 5

# Long audio/video readings share one operation across Agent and canvas. The
# values frozen on an operation are copied into each Cloudflare media job.
long_media:
  max_source_bytes: 2147483648
  max_sources: 10
  max_segment_bytes: 20000000
  audio_core_seconds: 300
  video_core_seconds: 60
  overlap_seconds: 2
  max_active_leaves: 512
  delivery_concurrency: 2
  per_operation_delivery_concurrency: 1
  operation_lease_ms: 30000
  container_class: LongMediaContainerStd4
  container_max_instances: 2
  profile_version: channel-v1
  audio_codec: libmp3lame
  audio_bitrate: 128k
  video_codec: libx264
  video_crf: 23
  video_audio_codec: aac
  video_audio_bitrate: 128k
