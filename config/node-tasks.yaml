# Node task budgets (#186).
#
# Every task on a canvas node carries a conservative time: within it the task
# will certainly finish under normal conditions, and failing to finish means
# something outside what we promise went wrong. A timer Durable Object holds
# that deadline and knocks on the server when it passes.
#
# Bias long. Judging a live task dead costs the user their wait and their
# credits; judging late costs them a longer wait.

upload:
  # Floor. A small file's transfer time is seconds, while the handshake, the
  # row, the signed ticket and the browser's own queueing are not — this is
  # where they live. 15 minutes.
  min_budget_ms: 900000
  # Ceiling. `max_upload_bytes` at `client_put_min_bytes_per_sec` is 9.1
  # hours; this sits above it so the largest allowed file is bounded by its
  # own transfer estimate rather than by this number. 12 hours.
  max_budget_ms: 43200000
  # Added on top of the transfer estimate. A video's cover is extracted after
  # the bytes land, and the task is not done until that has had its chance.
  # 10 minutes.
  cover_reserve_ms: 600000
