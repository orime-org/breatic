# ── Canvas reference pool ──────────────────────────────
# canvas_reference_pool_cap: max entries in ONE node's reference pool —
#   incoming reference edges + focus crops combined (#1782). A UI sanity
#   cap enforced by the frontend at add time (the pool lives in Yjs; the
#   server never gates collaborative writes). Distinct from the per-model
#   `images.max_items` payload cap enforced at execute time (#1735).
canvas_reference_pool_cap: 50

# ── Node history paging ────────────────────────────────
# node_history_page_size: page size the frontend requests per infinite-
#   scroll page of GET /canvas/nodes/:id/history (#1619). Served to the
#   frontend via GET /canvas/limits alongside canvas_reference_pool_cap.
node_history_page_size: 20

# ── Activity feed paging ───────────────────────────────
# Keyset page size for GET /projects/:id/activities.
#   activity_feed_page_default: page size when the client omits ?limit
#   activity_feed_page_max:     hard ceiling a client ?limit is clamped to
activity_feed_page_default: 50
activity_feed_page_max: 100

# ── Studio project list paging ─────────────────────
# Keyset page size for GET /studio/:slug/projects (inner#1020).
#   studio_project_page_default: page size when the client omits ?limit
#   studio_project_page_max:     hard ceiling a client ?limit is clamped to
studio_project_page_default: 50
studio_project_page_max: 100

# ── Credit paging ──────────────────────────────────────
# Keyset page size for the credit overlay's purchase list and ledger.
#   credit_page_default: page size when the client omits ?limit
#   credit_page_max:     hard ceiling a client ?limit is clamped to
credit_page_default: 30
credit_page_max: 100

# ── Decision window ────────────────────────────────────
# How long a person has to answer something that is waiting on them, in
# days. One number covers all five such flows: being invited to a studio
# or to a project, being handed a studio or a project, and being asked to
# approve a role upgrade. Past it a request is closed to BOTH answers —
# neither accepting nor declining is possible any more.
#
# Four things read it, and they must not disagree: the deadline stored on
# the row, the expiry of the invite link's Redis key, the sentence in the
# invitation and transfer emails, and the day count on the invite landing
# page. Copy that states one duration while enforcement uses another is
# the product lying to the person reading it.
#
# Changing this affects rows written from then on; rows already carrying a
# deadline keep the one they were stamped with.
#
# NOT covered here, deliberately: password reset, email verification and
# session lifetime. Those are account-security lifetimes, each set against
# its own threat rather than against how long someone reasonably takes to
# answer. (Recovery codes have no lifetime at all — single use, then
# rotated.)
decision_window_days: 7

# ── Storage-full notice window ─────────────────────────
# storage_notice_window_seconds: how long one account's "storage is full"
# notice silences the next one, in seconds (#89). Keyed by the ADMIN's
# ACCOUNT, not by studio: the ceiling is an account-wide sum, so a team
# account with four studios would otherwise get four notices for one
# event, three of them naming a studio that holds hardly anything.
#
# Only the bell row and the email are silenced. Every refusal is still
# logged — the bell is for the admin and is deliberately quiet, the log
# is for whoever is on call and must not be.
storage_notice_window_seconds: 86400

# ── Request body ───────────────────────────────────
# request_body_max_bytes: the largest request body any public API route
#   reads (inner#1006). Larger bodies are refused with 413 before a route
#   runs. The three routes that can legitimately carry more move the body
#   through a transfer upload instead (config/storage.yaml `transfer:`).
#   docker/breatic-locations.conf `client_max_body_size` must equal it.
request_body_max_bytes: 1048576

# request_body_linger_seconds: after a body over a limit is refused, how
#   long the server keeps reading and discarding the rest of it before it
#   closes the connection (inner#1782). The 413 says `Connection: close`;
#   the server half-closes, reads on, and closes once the body ends or this
#   many seconds pass; a client that closes first is closed by Node. Shared
#   by the public app and the internal API. 30 is nginx's `lingering_time`
#   default; at most 300, Node's own limit on how long a request may take.
request_body_linger_seconds: 30

# ── Shutdown ───────────────────────────────────────────
# server_shutdown_deadline_ms: how long the server waits on SIGTERM for
#   in-flight work -- an Agent chat run storing its failed ending, a sent
#   mail -- before it closes its database and Redis pools anyway (inner#1717).
server_shutdown_deadline_ms: 4000
