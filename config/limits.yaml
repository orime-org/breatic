# ── Member capacity limits ─────────────────────────
# Soft business caps, tunable without a redeploy. NOT a perf limit —
# concurrency is bounded separately by collab.yaml's
# `max_connections_per_document`.
#
# studio_member_cap: max active members in one studio. A studio is a
#   shared-credit team, so this bounds how many people can spend from
#   one wallet (abuse guard). Raise it for larger teams.
#
# project_collaborator_cap: max people EXPLICITLY invited to one project
#   (any role: editor / viewer). Auto-materialized baseline viewers —
#   studio members who just opened the project (open baseline) — are
#   EXEMPT and never counted, so this never blocks viewing access; it
#   only bounds the explicit invite roster.
studio_member_cap: 100
project_collaborator_cap: 100

# ── Canvas reference pool ──────────────────────────────
# canvas_reference_pool_cap: max entries in ONE node's reference pool —
#   incoming reference edges + focus crops combined (#1782). A UI sanity
#   cap enforced by the frontend at add time (the pool lives in Yjs; the
#   server never gates collaborative writes). Distinct from the per-model
#   `images.max_items` payload cap enforced at execute time (#1735).
canvas_reference_pool_cap: 50

# ── Node history paging ────────────────────────────────
# node_history_page_size: page size the frontend requests per infinite-
#   scroll page of GET /canvas/nodes/:id/history (#1619). Served to the
#   frontend via GET /canvas/limits alongside canvas_reference_pool_cap.
node_history_page_size: 20

# ── Activity feed paging ───────────────────────────────
# Keyset page size for GET /projects/:id/activities.
#   activity_feed_page_default: page size when the client omits ?limit
#   activity_feed_page_max:     hard ceiling a client ?limit is clamped to
activity_feed_page_default: 50
activity_feed_page_max: 100

# ── Decision window ────────────────────────────────────
# How long a person has to answer something that is waiting on them, in
# days. One number covers all five such flows: being invited to a studio
# or to a project, being handed a studio or a project, and being asked to
# approve a role upgrade.
#
# It is one number by decision (2026-06-08, re-affirmed 2026-08-02), not by
# coincidence — before this it was the literal 7 written separately into
# four services, with the role-upgrade flow having no deadline at all.
#
# Everything downstream reads this: the deadline stored on the row, the
# expiry of the invite link's Redis key, and the sentence in the
# invitation and transfer emails that tells the recipient how long they
# have. Changing this number changes all of them together, which is the
# point — copy that states a duration and enforcement that uses another
# is the product lying to the person reading it.
#
# NOT covered here, deliberately: password reset, email verification,
# session lifetime and recovery codes. Those are account-security
# lifetimes, and each is set against its own threat, not against how long
# someone reasonably takes to answer.
decision_window_days: 7
