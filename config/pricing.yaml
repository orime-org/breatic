# Credit purchase tiers.
#
# The five figures come from the credits decision of 2026-07-31, recalculated
# 2026-08-25. Credits per tier are fixed by one formula and never rounded up:
#
#   credits = floor( dollars × (1 − worst-case cost − 0.5%) × 100 / 10 ) × 10
#
# `price_cents` is what the tier is listed at, before tax. Stripe Tax adds the
# buyer's local tax on top at checkout, so the number shown on the page is not
# the number the buyer pays. Every Price created for these tiers carries
# `tax_behavior: exclusive`, which Stripe cannot change once set.
#
# Each tier carries a test and a live Stripe Price ID; the backend picks by ENV
# (dev/staging → test, prod → live). Both stay empty until the Prices exist.
#
# `name` is one string doing two jobs: the key a checkout request names a pack
# by, and the name a buyer reads. It stays English in all five locales and is
# never translated, so that the pack a buyer picked, the line on the Stripe
# page, the row in their purchase history and the line in the confirmation
# email all read the same. Each one has to match the Stripe Product's name
# character for character.

tiers:
  - name: "830 Credits"
    credits: 830
    price_cents: 1000
    currency: usd
    description: ""
    stripe_price_id:
      test: ""
      live: ""

  - name: "1,700 Credits"
    credits: 1700
    price_cents: 2000
    currency: usd
    description: ""
    stripe_price_id:
      test: ""
      live: ""

  - name: "4,320 Credits"
    credits: 4320
    price_cents: 5000
    currency: usd
    description: ""
    stripe_price_id:
      test: ""
      live: ""

  - name: "8,690 Credits"
    credits: 8690
    price_cents: 10000
    currency: usd
    description: ""
    stripe_price_id:
      test: ""
      live: ""

  - name: "43,660 Credits"
    credits: 43660
    price_cents: 50000
    currency: usd
    description: ""
    stripe_price_id:
      test: ""
      live: ""
