# Credit purchase tiers.
#
# The five figures come from the credits decision of 2026-07-31, recalculated
# 2026-08-25. Credits per tier are fixed by one formula and never rounded up:
#
#   credits = floor( dollars × (1 − worst-case cost − 0.5%) × 100 / 10 ) × 10
#
# `price_cents` is what the tier is listed at, before tax. Stripe Tax adds the
# buyer's local tax on top at checkout, so the number shown on the page is not
# the number the buyer pays. Every Price created for these tiers carries
# `tax_behavior: exclusive`, which Stripe cannot change once set.
#
# Each tier carries a test and a live Stripe Price ID; the backend picks by ENV
# (dev/staging → test, prod → live). Both stay empty until the Prices exist.
#
# `name` identifies a tier to whoever edits this file, and appears in the
# message for a tier with no Price ID configured. No screen reads it: a buyer
# picks a pack by its price and what it grants, and a checkout request names
# one by `price_cents`.

tiers:
  - name: "830 Credits"
    credits: 830
    price_cents: 1000
    currency: usd
    stripe_price_id:
      test: "price_1U8aBUGeRYMxofheEfpNDked"
      live: ""

  - name: "1,700 Credits"
    credits: 1700
    price_cents: 2000
    currency: usd
    stripe_price_id:
      test: "price_1U8aC0GeRYMxofhevMFDox6Z"
      live: ""

  - name: "4,320 Credits"
    credits: 4320
    price_cents: 5000
    currency: usd
    stripe_price_id:
      test: "price_1U8aCuGeRYMxofhe2WVbQEso"
      live: ""

  - name: "8,690 Credits"
    credits: 8690
    price_cents: 10000
    currency: usd
    stripe_price_id:
      test: "price_1U8aDGGeRYMxofheU2u9PGh8"
      live: ""

  - name: "43,660 Credits"
    credits: 43660
    price_cents: 50000
    currency: usd
    stripe_price_id:
      test: "price_1U8aDcGeRYMxofheekj677zO"
      live: ""

# Repairing payments that neither the return-side confirmation nor the webhook
# finished. It runs on every read of the credits overview, so it is bounded on
# three sides.
reconcile:
  # How many payments one pass asks Stripe about. Three round trips fit inside
  # one page load; the rest wait for the next.
  batch_size: 3
  # How old a payment has to be before a pass touches it. Younger than this and
  # the buyer is most likely still on the Stripe page filling in a card, where
  # the answer is certainly `unpaid` and the round trip buys nothing.
  min_age_seconds: 120

# How long a confirmation email may sit in `sending` before the resend control
# offers it again. A process replaced between claiming the send and writing the
# result strands the row there, and nothing sweeps it: this screen is its only
# reader, so this is the timeout that frees it.
stale_sending_minutes: 10

# How long the page waits for the confirmation endpoint before it stops
# waiting. The purchase is unharmed either way — the webhook and reconciling
# both settle it — so this is only about not holding a buyer behind a spinner
# that may never stop. The value lives here and the timer runs in the browser,
# so it is carried on the pack list the buy screen already reads.
confirm_timeout_ms: 15000
