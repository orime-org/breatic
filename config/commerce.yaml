# ── The billing service (inner#1993) ──────────────────────────────────
# Read by packages/core/src/config/commerce.ts: the server's outbox relay
# runs when the internal API is on and COMMERCE_API_URL is set; the worker's
# daily lot-mirror reconcile runs on the same condition.

# How long the relay waits between passes, and the most rows one pass sends.
relay_interval_ms: 2000
relay_batch: 100

# How long one delivery to the billing service may take. The row stays locked
# for the call, so this is kept short.
relay_call_timeout_ms: 10000

# Deliveries the billing service could not take are retried with exponential
# backoff between these bounds; after this many attempts the row moves to the
# dead letters and an error is logged. 50 attempts at these bounds is about
# two days of the billing service being down.
relay_max_attempts: 50
relay_backoff_base_seconds: 10
relay_backoff_max_seconds: 3600

# The daily lot-mirror reconcile: when it runs (cron, UTC), and how far back
# a lot that is active again must have changed to be sent once more.
lot_mirror_reconcile_cron: "0 3 * * *"
lot_mirror_reconcile_window_days: 30
