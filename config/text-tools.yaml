# Text Mini-Tool Configuration
# One model for every text tool (polish, expand, shorten, summarize, translate,
# rewrite, custom, continue, generate, character, storyboard, script).
model: google/gemini-3.8-flash

# How long the model thinks before answering: low | medium | high. Google
# recommends low for latency-sensitive everyday tasks; Gemini 3.8 Flash
# defaults to medium when nothing is sent.
thinking_level: low

# Longest selection, in characters, a text tool runs on. A longer selection is
# refused with 422 before the model runs.
selection_max_chars: 40000

# Longest document context, in characters, sent alongside the selection. The
# browser sends a window around the selection that fits; the server refuses
# anything longer with 422. Must be at least selection_max_chars.
context_max_chars: 200000

# Milliseconds between words as the answer streams out. The model sends its
# text in bursts; the server splits each burst into words and spaces them by
# this much, so the reader sees the answer being written.
stream_delay_ms: 20
