# ── Regions (inner#1955) ───────────────────────────────
# Read by every deployment; a single-region deployment calls everything in
# process and never waits on these timeouts.
#
# global_api_timeout_ms: how long a region waits for one call to the global
#   region's internal API before treating it as failed.
# region_probe_timeout_ms: how long the global region waits for a region to
#   answer the probe before creating a Studio there.
# cross_region_fanout_timeout_ms: how long the global region waits for each
#   other region when merging recents, notifications and invitation
#   previews; a region that does not answer in time is reported unavailable.
# outbox_relay_interval_ms: how often a region relays its outbox to the
#   global region.
# transfer_accepting_sweep_interval_ms: how often a region looks for Studio
#   transfers left between the global admin change and the role swap.
# transfer_accepting_stale_ms: how long a transfer may stay in that window
#   before the sweep finishes it.
# studio_creation_sweep_interval_ms: how often the global region looks for
#   Studio creations left pending in another region.
# studio_creation_stale_ms: how long a creation may stay pending before the
#   sweep asks the region whether it landed.
# profile_cache_ttl_ms: how long a region caches names and avatars read from
#   the global region. The relay interval plus this stays within sixty
#   seconds, so a rename reaches every region within a minute.
# limits_cache_ttl_ms: how long a region caches what the global region says
#   about a Studio's membership: collab's editor ceiling when a Space opens,
#   and the storage ceiling with the usage of the admin's other regions.
# storage_usage_sync_interval_ms: how often each region reports what its
#   Studios store to the global region.
# slug_reservation_sweep_interval_ms: how often the global region looks for
#   slugs held for a rename that never reached it.
# slug_reservation_stale_ms: how long after a rename reserves its slug the
#   sweep asks the Studio's region which slug it holds, then lets the
#   directory take it or lets it go.
# slug_reservation_sweep_batch: how many past-due reservations one sweep
#   settles.
# outbox_relay_batch: how many outbox events one relay pass reads.
# storage_usage_report_batch: how many Studios one storage usage report
#   carries.
# region_api_body_max_bytes: the largest request body one region accepts
#   from another. A Studio snapshot carries every member and Project id and a
#   collab session recheck every session id an instance holds, so this is
#   sized for them; the back office's own calls keep their smaller limit.
global_api_timeout_ms: 5000
region_probe_timeout_ms: 2000
cross_region_fanout_timeout_ms: 2000
outbox_relay_interval_ms: 1000
profile_cache_ttl_ms: 30000
limits_cache_ttl_ms: 60000
storage_usage_sync_interval_ms: 30000
slug_reservation_sweep_interval_ms: 60000
slug_reservation_stale_ms: 600000
transfer_accepting_sweep_interval_ms: 60000
transfer_accepting_stale_ms: 60000
studio_creation_sweep_interval_ms: 60000
studio_creation_stale_ms: 120000
slug_reservation_sweep_batch: 50
region_api_body_max_bytes: 4194304
outbox_relay_batch: 100
storage_usage_report_batch: 500
