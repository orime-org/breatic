# BullMQ Worker configuration.
#
# Tunable parameters for task execution.
# Restart the worker service after editing.

# ── Concurrency ───────────────────────────────────
# Max number of jobs processed simultaneously.
concurrency: 5

# ── BullMQ Job Retry ──────────────────────────────
# Max attempts per job. BullMQ schedules retries with exponential
# backoff when the handler throws. Duplicate-provider-call protection
# on retries (#1628): a SUCCESSFUL provider call sets provider_result_url
# (re-entry guard: never invoked again); ASYNC providers persist the
# vendor task id at submit, so a retry resumes polling instead of
# re-submitting; SYNC providers ARE re-invoked on retry (accepted
# policy: UX over the narrow duplicate-external-cost window, which is
# monitored via provider_reinvoked_on_retry_potential_duplicate_cost).
job_attempts: 3

# Base backoff delay (ms) for BullMQ retries: delay = base * 2^attempt.
job_backoff_delay_ms: 2000

# BullMQ lock duration (ms). Worker must renew within this window
# or the job is reclaimed as "stalled". 10 minutes covers our
# slowest single-step operation (large video upload, 3D generation).
lock_duration_ms: 600000

# HTTP retry count and backoff base are no longer configured here: they are
# fixed inside the shared HTTP transport (@breatic/shared) so the worker, the
# agent tools and the browser upload cannot drift apart. Per-attempt timeouts
# are still per-caller — they come from each model's `timeout`.

# ── Polling (async AIGC tasks) ────────────────────
# Default interval (ms) between poll requests.
poll_interval: 3000

# Max wait time (ms) before giving up on an async task.
poll_max_wait: 300000            # 5 minutes

# Longer ceiling for 3D generation, which routinely runs past the 5-minute
# default. Every other modality uses `poll_max_wait` above — this is the only
# per-modality override, so it is spelled out rather than generalised into a
# per-modality table nobody else would fill in.
poll_max_wait_3d: 600000         # 10 minutes

# ── Billing ───────────────────────────────────────
# Timeout (ms) for WaveSpeed billing API queries.
billing_timeout: 30000
