# BullMQ Worker configuration.
#
# Tunable parameters for task execution.
# Restart the worker service after editing.

# ── Concurrency ───────────────────────────────────
# Jobs one worker process runs at once, per queue.
#
# A task waiting on an upstream goes back to the queue between two questions
# about it, so waiting holds no slot: a tasks job holds one while it works —
# submits, asks once, reads media, rewrites or describes before a submit,
# stores outputs. The figure for tasks bounds how many of those run at once.
# WaveSpeed queues a prediction past an account's concurrency instead of
# refusing it; its per-minute submit limit answers 429, which the transport
# replays with backoff, and a submit still refused after that is an ordinary
# submit failure that spends an attempt.
concurrency:
  default: 5
  per_queue:
    tasks: 50
    # Each of these waits on the ingest Worker for as long as the task's two
    # hours allow (inner#1367), the way `tasks` waits on an upstream, so five
    # slow ones would hold every place.
    upload-finish: 50
    url-ingest: 50
    media-read: 50
    # Each reads a whole audio object on one of the few media containers that
    # live uploads also wait on, so few run at once (inner#1305 §4.4).
    audio-peaks: 2
    # One durable SQL outbox scan runs at a time; its jobs only enqueue stable operation wakes.
    long-media-dispatch: 1
    # One charge sweep round runs at a time; settlements lock their own rows.
    credit-charge-sweep: 1

# ── BullMQ Job Retry ──────────────────────────────
# Max attempts per job. BullMQ schedules retries with exponential
# backoff when the handler throws. Waiting on an upstream is not a retry:
# a task still going goes back to the queue without spending an attempt.
# Duplicate-provider-call protection on retries (#1628): a SUCCESSFUL
# provider call sets provider_result_url (re-entry guard: never invoked
# again); ASYNC providers persist the vendor task id at submit, so a later
# pickup asks about it instead of re-submitting; SYNC providers ARE
# re-invoked on retry (accepted policy: UX over the narrow
# duplicate-external-cost window, which is monitored via
# provider_reinvoked_on_retry_potential_duplicate_cost, once per retry).
job_attempts: 3

# Base backoff delay (ms) for BullMQ retries: delay = base * 2^attempt.
job_backoff_delay_ms: 2000

# BullMQ lock duration (ms). Worker must renew within this window
# or the job is reclaimed as "stalled". 10 minutes covers our
# slowest single-step operation (large video upload). Waiting on an
# upstream holds no lock: the job is back on the queue between questions.
lock_duration_ms: 600000

# ── Polling (async AIGC tasks) ────────────────────
# An async vendor task is "submit, get an id, then keep asking whether it
# is done". Each pickup of the job asks once; a task still going goes back
# to the queue and is picked up again after this interval, without spending
# an attempt, until the task's two-hour budget (config/node-tasks.yaml).
poll_interval: 3000

# ── Running-task gate (inner#1968) ────────────────
# A person's task past their tier's running_tasks_per_user waits, and is
# judged again after a poll interval scaled by its place in line.
# A waiting task not judged for this long no longer holds its place in line.
slot_wait_stale_ms: 120000
# The longest a waiting task is put off before it is judged again. This
# value plus a third of slot_wait_stale_ms must stay below slot_wait_stale_ms,
# or a waiter still in line reads as stale; the loader refuses it otherwise.
slot_wait_max_delay_ms: 30000
# How often the sweep for tasks still waiting runs.
slot_wait_sweep_interval_ms: 60000
# How many stale waiters one round of that sweep looks at.
slot_wait_sweep_batch_size: 200
# How often the sweep runs that expires 3D Space task rows past their budget
# and tells each such Space through its document.
scene_task_sweep_interval_ms: 60000
# How long a pickup tries for the person's gate lock, held only for the
# milliseconds another pickup of theirs counts, before it goes back to the
# queue for one poll interval without writing anything.
slot_lock_wait_ms: 200


# ── Credit charge sweep (inner#1617) ──────────────
# A delivered result's charge is recorded as a pending request and settled
# right away; the sweep settles the ones that failed or whose process died
# first. A row that keeps failing stays pending, is logged each round and moves
# to the back of the queue.
credit_charge_sweep:
  # How often the sweep runs.
  interval_ms: 60000
  # A request created or last tried less than this ago is left alone: a new one
  # to the process that recorded it, a failed one until the next round.
  min_age_ms: 30000
  # Requests one round settles at most.
  batch_size: 100
