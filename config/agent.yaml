# Agent Configuration
# Controls MainAgent behavior, memory system, tools, and worker limits.
# These values can be overridden by environment variables (uppercase, e.g. MAX_TOOL_ITERATIONS=50).

# ── Agent Loop ────────────────────────────────────────────
# Maximum number of tool-call round-trips the agent loop will execute.
max_tool_iterations: 40

# Step ceiling for a worker task running one skill. Separate from the number
# above because the two are different situations: chat has someone waiting,
# a worker task is a bounded job.
skill_agent_max_steps: 15

# ── Models ────────────────────────────────────────────────
# Default model for MainAgent chat.
default_model: deepseek/deepseek-v4-pro

# Model used for memory consolidation (summarizing old turns). The same model
# that writes a conversation reads it back: two would put the summary in one
# voice and the reply in another, and name two providers on one bill.
consolidation_model: deepseek/deepseek-v4-pro

# ── Memory System ─────────────────────────────────────────
# Number of recent turns (user → agent round-trips) before triggering consolidation.
# A "turn" = one user message + all agent steps (tool calls + final reply).
memory_window: 20

# How much of a conversation's first message is kept as its title. The rest is
# cut with an ellipsis so a list of conversations stays readable.
conversation_title_max_chars: 60

# How many conversations one page of the history list holds. The list asks for
# the next page when the reader reaches the bottom of this one, so this is a
# round-trip size rather than a ceiling: there is no limit on how many
# conversations a project may have.
conversation_page_size: 30

# How many messages one page of a conversation holds. Same figure as the list
# above, on purpose: the two are the same kind of dial. A page is cut on a
# turn boundary, so what arrives is at most this and lands on whole turns.
message_page_size: 30

# How often the chat stream says it is still alive, in milliseconds. The
# client treats three missed beats as a stream that has gone; that count is
# in code and not here, because the server garbage collects and two misses in
# a row happen to a stream that is doing fine.
sse_heartbeat_interval_ms: 5000

# Number of recent turns to keep unconsolidated during memory consolidation.
memory_keep_recent_turns: 3

# Number of recent turns to preserve full step detail (tool calls + results)
# when building LLM context. Older unconsolidated turns are compressed to
# user message + assistant final reply only.
full_detail_turns: 3

# Maximum character length for project memory injected into AI calls.
memory_project_max_size: 3072

# Maximum character length for user memory injected into AI calls.
memory_user_max_size: 2048

# ── Tools ─────────────────────────────────────────────────
# Maximum characters returned from web_fetch tool output.
web_fetch_max_chars: 50000

# How long ONE DELIVERY of a web_fetch request may take, in milliseconds.
# Not the whole fetch: the shared HTTP transport may deliver a request up to
# three times, and each delivery gets this figure. A redirect chain multiplies
# it again, once per hop.
web_fetch_timeout_ms: 30000

# The same figure for web_search, which is one request with no redirects.
# Lower because a search API answers or does not; a page can be slow for
# reasons of its own.
web_search_timeout_ms: 10000

# ── Thinking ──────────────────────────────────────────────
# Whether to ask the provider for the model's working while it answers.
#
# Off, because asking for it changes nothing that comes back. Measured twice
# on the model this build actually calls: 2026-08-20, deepseek/deepseek-v4-pro
# through OpenRouter, this switch on, two turns — one of them asking in so
# many words for the working to be written out. Both turns opened a reasoning
# channel and closed it again about 300ms later with zero reasoning-delta
# between: the stream carries reasoning-start and reasoning-end and nothing
# else. The earlier measurement said the same thing about a different model
# (2026-08-11, claude-sonnet-4-6, three turns, nothing).
#
# And the reason is now known: nothing is asked for. `@ai-sdk/openai@4.0.37`
# decides whether a model reasons from its id (the o-series, gpt-5 and up),
# and `deepseek/deepseek-v4-pro` matches neither — so `reasoningEffort` is
# dropped with an `unsupported` warning and never reaches the request body
# (`dist/index.js:6306-6311`). Turning this on today spends the ask on every
# turn for a fold with nothing in it. Making it actually work is a separate
# piece of work; see the agent backlog.
thinking_enabled: false

# ── LLM resilience ────────────────────────────────────────
# Retry budget (maxRetries) for every LLM call, injected by the model-call
# wrapper (generateTextRetry / streamTextRetry). AI SDK default is 2 (#1625).
llm_max_retries: 2
