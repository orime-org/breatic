# Agent Configuration
# Controls MainAgent behavior, memory system, tools, and worker limits.
# These values can be overridden by environment variables (uppercase, e.g. MAX_TOOL_ITERATIONS=50).

# ── Agent Loop ────────────────────────────────────────────
# Maximum number of tool-call round-trips the agent loop will execute.
max_tool_iterations: 40

# Step ceiling for a worker task running one skill. Separate from the number
# above because the two are different situations: chat has someone waiting,
# a worker task is a bounded job.
skill_agent_max_steps: 15

# ── Models ────────────────────────────────────────────────
# Default model for MainAgent chat.
default_model: deepseek/deepseek-v4-pro

# Model used for memory consolidation (summarizing old turns). The same model
# that writes a conversation reads it back: two would put the summary in one
# voice and the reply in another, and name two providers on one bill.
consolidation_model: deepseek/deepseek-v4-pro

# ── Memory System ─────────────────────────────────────────
# How much of a conversation's first message is kept as its title. The rest is
# cut with an ellipsis so a list of conversations stays readable.
conversation_title_max_chars: 60

# How many conversations one page of the history list holds. The list asks for
# the next page when the reader reaches the bottom of this one, so this is a
# round-trip size rather than a ceiling: there is no limit on how many
# conversations a project may have.
conversation_page_size: 30

# How many messages one page of a conversation holds. Same figure as the list
# above, on purpose: the two are the same kind of dial. A page is cut on a
# turn boundary, so what arrives is at most this and lands on whole turns.
message_page_size: 30

# How often the chat stream says it is still alive, in milliseconds. The
# client treats three missed beats as a stream that has gone; that count is
# in code and not here, because the server garbage collects and two misses in
# a row happen to a stream that is doing fine.
sse_heartbeat_interval_ms: 5000

# How many of the most recent tool uses keep their result when building LLM
# context. Older tool results are replaced by a placeholder; the call record
# — name and arguments — stays, as does every user message and reply.
#
# Counted in tool use/result pairs, not turns: one turn can run forty model
# calls and all of them land in a single stored row, so a turn-shaped window
# would be three orders of magnitude coarser than what actually fills the
# context. Three is the figure Anthropic's clear_tool_uses_20250919 keeps.
tool_result_keep: 3

# Maximum character length for project memory injected into AI calls.
memory_project_max_size: 3072

# Maximum character length for conversation memory injected into AI calls.
# Consolidation rewrites this layer whole every time it runs, so it is the one
# segment that grows from its own output.
memory_conversation_max_size: 3072

# The ceiling on one model call's answer, in tokens. Per call, not per turn:
# a turn can make many calls and each of them is bounded by this.
max_output_tokens: 16384

# How long one turn's question may be, in characters. Measured on what
# reaches the model: a message carries the canvas content the reader attached
# folded in front of it, and a skill command carries its name and input.
# Both entrances measure the same way.
#
# The browser draws a lower line (10,000) and says so as the reader types;
# this one is where a client cannot skip it.
user_message_max_chars: 15000

# How long an assembled request may be before a consolidation runs, in
# characters. Measured against everything about to go to the model: system
# prompt, skill bodies, memory, tool definitions, history and this turn's
# question.
#
# Characters rather than tokens because no library counts tokens for a model
# reached through OpenRouter, and a character is never more than a token in
# the tokenizers this build meets — so this can only fire early.
memory_budget_chars: 850000

# What one consolidation leaves behind, in characters. A pass takes whole
# turns from the oldest end until what remains is under this, less the room
# the fold may add to memory — the two memory ceilings, doubled, since they
# are counted in code points and the payload is measured in code units.
memory_keep_chars: 500000

# ── Tools ─────────────────────────────────────────────────
# How much page text one web_search asks for, in tokens. The service refuses
# anything under 1024 and states 32768 as its own ceiling. Measured: 8192
# returns about three times the text of 2048 and costs 19ms more.
web_search_max_tokens: 8192

# How long ONE DELIVERY of a web_search request may take, in milliseconds.
# Not the whole search: the shared HTTP transport may deliver a request up to
# three times, and each delivery gets this figure.
web_search_timeout_ms: 10000

# ── Thinking ──────────────────────────────────────────────
# There is no switch here for the model's working.
#
# Whether a call wants it is the call's own business: chat asks for it and
# shows it, memory consolidation does not. One setting across all of them
# would have to be wrong for one of the two.
#
# A call that has a preference states it where it makes the call, by passing
# a boolean to `reasoningFor` in `@breatic/domain`, which turns that into
# whatever the provider on the other end takes. Chat and memory consolidation
# do that today; the rest take whatever their provider does by default.

# ── LLM resilience ────────────────────────────────────────
# Retry budget (maxRetries) for every LLM call, injected by the model-call
# wrapper (generateTextRetry / streamTextRetry). AI SDK default is 2 (#1625).
llm_max_retries: 2
