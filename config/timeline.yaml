defaults:
  width: 1920
  height: 1080
  fps:
    num: 24
    den: 1
assets:
  page_size: 50
  page_max: 100
  backfill_batch_size: 200
# Web-animation executions (inner#1711). A task's deadline is
# default_budget_ms in node-tasks.yaml; nothing here shortens it.
web_animation:
  prompt_max_length: 4000
  duration_seconds:
    min: 1
    max: 60
    # Where the creation dialog opens; lies within min..max.
    default: 4
  viewports:
    "16:9": { width: 1920, height: 1080 }
    "9:16": { width: 1080, height: 1920 }
    "1:1": { width: 1080, height: 1080 }
  model: deepseek/deepseek-v4.1-flash-1017
  max_tokens: 32000
  # One model call's limit; a cancel or the deadline waits at most this long to drain it.
  call_timeout_ms: 300000
  max_package_bytes: 5000000
  font_set_version: 3
  preview_token_ttl_ms: 3600000
  player_load_timeout_ms: 15000
  # The preview loads a video clip's element or a web copy's page this far ahead of its first visible frame, hidden.
  preview_premount_ms: 2000
  # Loaded preview pages no copy uses that are kept for reuse; beyond this the oldest is unloaded.
  preview_idle_instances_max: 8
  sweep_interval_ms: 30000
  sweep_batch_size: 200
  poll_interval_ms: 5000
  source_refresh_interval_ms: 10000
  # The instance a run is billed for, at the prices in mini-tools.yaml.
  container:
    vcpu: 1
    memory_gib: 6
    disk_gb: 12
# Multi-video preview sync (#1410), in seconds except the steer rate.
preview:
  # Drift past which a lane's playback rate is steered by drift_steer_rate.
  drift_steer_seconds: 0.04
  # Drift, or a drift jump, past which a lane is hard-synced and the preview waits for it.
  drift_hard_sync_seconds: 0.5
  # Drift past which a lane is hard-synced however gradually it grew.
  drift_catastrophic_seconds: 3
  # When a wait ends, lanes not waited for are sought only when further off than this.
  resume_seek_seconds: 0.15
  drift_steer_rate: 0.03
