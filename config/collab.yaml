# Hocuspocus collaboration server configuration.
#
# These values are BEHAVIOUR knobs and can be tuned without code changes.
# Restart the collab service after editing.
#
# The WebSocket port is deliberately NOT here — it lives with the other two
# service ports in the core env schema (`COLLAB_PORT`, default 1234). Keeping
# one kind of setting in one place. It used to be a plain key here with a
# schema default, which made it the one service port that could not be set
# from `.env` and left a duplicate copy of 1234 hard-coded in the vite dev
# proxy (#1831).

# ── Document Lifecycle ────────────────────────────
# Unload documents from memory when all clients disconnect.
# true = free memory immediately, false = keep in memory for fast reconnect.
unload_immediately: true

# Max time (ms) to wait before persisting a document after changes.
# Higher = fewer DB writes, lower = less data loss on crash.
debounce: 2000
max_debounce: 10000

# How often the transport pings every connection. The WebSocket layer is
# crossws, whose `idleTimeout` option defaults to 30 seconds, and Hocuspocus
# passes crossws only `serverOptions` and `hooks` — it has no such setting of
# its own to pass. So this is a DECLARATION about the transport's behaviour,
# not a knob that changes it. An integration test measures the real interval and
# goes red if the two ever diverge.
#
# Two expiries are derived from it, both at twice the interval:
#
#   a seat in the per-document registry
#   a presence record in the project's meta document
#
# Twice, because the transport checks on this same period and does both jobs
# in one pass: a sweep terminates any socket that has shown no sign of life
# since the previous sweep, and pings the rest. A socket's last pong can
# therefore be almost a whole period old when the sweep that arms it runs,
# which puts termination up to two periods after the last sign of life — and
# that is the figure an expiry has to cover. Deriving both from one value is
# what keeps them in step: they answer the same question, so they cannot be
# allowed to drift apart.
connection_ping_interval_ms: 30000

# ── Document Size Limit ───────────────────────────
# Max Yjs document size in bytes (0 = unlimited).
# Rejects new updates that would push the document over this limit.
# A typical canvas with 100 nodes ≈ 200KB. Default 10MB covers most use cases.
max_document_bytes: 10485760     # 10 MB

# ── Connection Limits ─────────────────────────────
# The per-document ceiling on WRITABLE connections is NOT here. It comes from
# the membership tier of the studio that owns the project — `concurrent_editors`
# in config/membership.yaml — so it differs per project and cannot be a
# process-wide constant (#88). A connection beyond it is degraded to read-only,
# not refused.
#
# How many documents one socket may carry is not here either: it follows the
# Space cap in @breatic/shared (MAX_SPACES_PER_PROJECT, plus the meta doc), and
# the library ceilings that close a whole socket are derived from it in
# infra/socket-ceilings.ts.

# ── Throttle ──────────────────────────────────────
# Coarse per-address DoS backstop, counted per IPv4 address or IPv6 /64.
# Loopback peers are exempt — see infra/connection-gate.ts, which decides from the raw peer address during the
# WebSocket upgrade.
# An attempt is one new WebSocket, or one WebSocket whose authentication failed
# (its documents failing together count once; past a full project's documents,
# every further failure on it counts). One WebSocket carries a
# whole project, so opening every Space is one attempt; the threshold stays
# generous because many members can share one address (an office NAT), and
# fine-grained abuse control belongs at the authenticated-user layer, not per-IP.
throttle_enabled: true
throttle_max_attempts: 200       # max attempts per address within the 60s window before a ban
throttle_ban_time: 1             # ban duration in MINUTES (shared-throttle.ts sets the ban key with EX minutes*60 — NOT ms)

# ── Persistence ───────────────────────────────────
# Quiet mode: suppress internal Hocuspocus logs (use our pino logger instead).
quiet: true

# ── Cross-service events (inner#1497) ────────────
# Every collab instance reads the task-events and project-lifecycle streams
# as one Redis consumer group, so each event is held by one instance at a
# time; an event not acknowledged is taken over by another once idle past
# event_claim_idle_ms. Task events
# are written one document batch at a time under a per-document lease in the
# coordination database (DB3).
event_max_held: 128               # most entries one instance holds per stream at once, writing and queued; entries waiting out a failure backoff are not counted
event_block_ms: 5000              # longest a read blocks when nothing is waiting
event_doc_concurrency: 16         # most documents one instance writes at once; a read takes at most this many free slots
event_doc_lease_ms: 30000         # document lease length; extended while writing
event_lease_retry_ms: 1000        # hold on a document after a wait (lease busy, peer waiting, hand-over not reached); also caps a read while writes run; a waiter mark lives twice this
event_handoff_poll_ms: 50         # gap between checks that the previous holder's writes arrived
event_handoff_wait_ms: 5000       # longest wait for them before the batch is retried
event_claim_interval_ms: 15000    # gap between sweeps that take over idle entries
event_claim_idle_ms: 60000        # idle time after which another instance's entry is taken over
# Retrying an event whose handling threw, then giving up. Google Pub/Sub's
# defaults: backoff from 10 s doubling to 600 s, five attempts — waits of 10,
# 20, 40 and 80 s, about two and a half minutes before an event goes to the
# dead-letter stream.
event_retry_min_ms: 10000
event_retry_max_ms: 600000
event_max_failures: 5
# On SIGTERM the consumers stop first: this bounds their wait for the running
# writes, and the hand-over of the rest follows. After it come a log flush of
# up to 0.5 s, the 4 s drains, another log flush of up to 0.5 s and a Sentry
# flush of up to 2 s; docker's default grace period is 10 s.
event_stop_deadline_ms: 3000
# A consumer idle this long with nothing pending is removed from its group;
# instance ids change on every start, so stopped instances leave names behind.
event_forget_idle_consumer_ms: 86400000

# ── Unload store retry (inner#1497) ──────────────
# Another instance holding the same document can hold its store lock while
# this one unloads it; the Redis extension then skips our store. That lock
# lasts 1 s and is not extended, so the unload retries a little past it. During
# shutdown the retries stop early enough to leave `unload_rescue_reserve_ms`
# for the rescue file, its note and the alert.
unload_store_retry_ms: 1200
unload_store_retry_interval_ms: 200
unload_rescue_reserve_ms: 1000

# ── Timed Store (#40) ─────────────────────────────
# Storing runs on a timer, not on "somebody changed something". The two
# settings above (debounce / max_debounce) still describe when Hocuspocus
# FIRES its own store hook — that call now returns without writing anything,
# because only the timed loop and the unload gate are allowed to write. They
# stay because raising them instead is not an option: `shouldUnloadDocument`
# is false the whole time a store is pending, so a large debounce strands
# every document in memory.
#
# The interval is a WRITE-LOAD knob, not a safety knob. Every case that would
# otherwise lose content is covered elsewhere: a user closing a tab and a
# normal restart both go through the unload gate, and one instance dying
# leaves the others holding the same content (they count relayed updates too,
# so they store it themselves). What is left is losing power to every instance
# at once, and 2 seconds versus 10 makes no difference to that — the answer
# there is the rescue file plus the alert, not storing more often.
store_interval_ms: 10000

# ── Project edit time (inner#1020) ─────────────────────
# After a Space document's store lands, or a Space is created, renamed,
# locked, deleted or restored, collab records the project as edited for the
# studio list's "last edited" sort. One instance writes a project at most
# once per this many milliseconds, so the list's edit time is at most this
# stale and the business database sees at most one small write per edited
# project per interval from each collab instance.
project_edit_touch_interval_ms: 60000

# There is deliberately no timeout over a store, here or anywhere. A store is
# one event with two outcomes — it lands or it does not — and only the write
# itself can say which. A clock racing it cancels nothing, so giving up on one
# produces no answer at all, just a third state ("cannot say") that then gets
# the document rescued to disk and an operator mailed about it. That is not
# hypothetical: three such alerts fired in smoke against a healthy database
# answering in 250ms.
#
# There is one store path and one only: a document about to leave memory is
# stored to the database, and its content goes to disk only if that does not
# land. The timed round above does not write to disk at all — a failed round
# needs nothing but the next round.

# Where content goes when the final attempt does not land. Relative paths are
# resolved from the monorepo root; in Docker this sits under the mounted
# ./logs volume so the files survive the container. They are NEVER removed
# automatically — each one is the only remaining copy of somebody's work.
store_rescue_dir: logs/collab/rescue

# Who to tell when that happens. LEAVE THIS SET IN PRODUCTION: a rescue file
# nobody is told about is a file nobody reads. Note EMAIL_BACKEND defaults to
# `disabled` and both env templates ship it disabled — with it disabled the
# alert only reaches the log, which collab says explicitly rather than
# failing quietly.
store_alert_email: ""

# One outage means one failure per open document per round. Alerts collapse
# to one per document per window.
store_alert_window_ms: 600000

# How long the mail transport gets before the alert is written off. It needs
# its own bound: the transport's timeouts (config/mail.yaml) bound one send up
# to the greeting by (resolved addresses x connection timeout) + greeting
# timeout, host resolution is not fully bounded, and the unload gate waits for
# the alert. An unreachable SMTP host during a database outage would otherwise
# hold every unloading document in memory for that long each.
store_alert_timeout_ms: 3000

# The published document-editor vocabulary (inner#1619). A collab instance
# writes its build's version into each project's meta, never over a version
# released later than its own. A rollback turns force_publish on so the build
# it goes back to can write its earlier version, and turns it off again once
# every instance runs that build.
document_schema:
  force_publish: false

# How long one instance holds the per-document lock under which it converts
# stored tables into tables whose cells hold blocks (inner#1619). The lock is
# never released, only expires; it has to outlast store_interval_ms by far.
doc_table_migrate_lock_ms: 300000

