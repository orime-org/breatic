# Hocuspocus collaboration server configuration.
#
# These values are BEHAVIOUR knobs and can be tuned without code changes.
# Restart the collab service after editing.
#
# The WebSocket port is deliberately NOT here — it lives with the other two
# service ports in the core env schema (`COLLAB_PORT`, default 1234). Keeping
# one kind of setting in one place. It used to be a plain key here with a
# schema default, which made it the one service port that could not be set
# from `.env` and left a duplicate copy of 1234 hard-coded in the vite dev
# proxy (#1831).

# ── Document Lifecycle ────────────────────────────
# Unload documents from memory when all clients disconnect.
# true = free memory immediately, false = keep in memory for fast reconnect.
unload_immediately: true

# Max time (ms) to wait before persisting a document after changes.
# Higher = fewer DB writes, lower = less data loss on crash.
debounce: 2000
max_debounce: 10000

# Presence. Only the server writes these records, and NOTHING writes "offline"
# when a socket closes — a socket ending is not evidence its owner left, since
# they may hold another one on this or another instance. So "online" is only
# ever asserted (on connect, and on each heartbeat) and absence is inferred:
# a record nobody anywhere is refreshing is turned off after the threshold.
#
# The threshold must clear the widest real gap between two heartbeats. Every
# heartbeat is written, so that gap is exactly the browser's beat interval —
# and the slowest beat is NOT the awake one: a hidden browser tab has its
# timers throttled to once a minute while its socket stays open (Chrome, after
# 5 minutes hidden), so a connected person can legitimately look ~60s stale.
# 60000 would sit exactly on that cycle and flip them once a minute forever;
# 90000 clears it by half again. A test pins the relationship.
presence_stale_after_ms: 90000

# ── Document Size Limit ───────────────────────────
# Max Yjs document size in bytes (0 = unlimited).
# Rejects new updates that would push the document over this limit.
# A typical canvas with 100 nodes ≈ 200KB. Default 10MB covers most use cases.
max_document_bytes: 10485760     # 10 MB

# ── Connection Limits ─────────────────────────────
# Max WebSocket connections per document (0 = unlimited).
max_connections_per_document: 100

# How many documents one socket must be able to carry.
#
# One browser tab holds ONE socket for a project and puts every document it
# needs on it: the meta doc plus one per open Space tab. A member who has
# never closed a tab has every Space open, because the tab list is seeded
# from the full Space directory the first time they open the project. So the
# real figure is "however many Spaces the project has", and nothing caps that.
#
# This one number feeds SEVERAL library limits, each of which closes the WHOLE
# socket when crossed — every Space on it goes blank and the client reconnects
# into the same wall. They are derived together in
# infra/socket-ceilings.ts rather than listed here, because raising one alone
# is not a fix: that is exactly what happened when only the pending-document
# limit was raised, and the socket then died on the frame-count limit at half
# the number written here. Measured for a 1000-document socket carrying the
# frames a real client sends:
#
#   pending documents    library default 100    fires first        -> derived
#   queued frame count   library default 1000   fires at ~500 docs -> derived
#   queued frame bytes   library default 5 MB   ~390 KB used       -> left alone
#   idle timeout         library default 60 s   client beats well inside -> left alone
#
# The byte ceiling is deliberately left at the library's value: it is the one
# that actually bounds memory, so it stays as a real guard behind the two
# generous derived ones. Per-IP abuse is bounded by the throttle below.
#
# Residual: a project past this many Spaces hits the wall again. The answer
# then is a cap on Spaces per project, not a bigger number here.
max_documents_per_socket: 1000

# ── Throttle ──────────────────────────────────────
# Coarse per-IP DoS backstop. Loopback peers are exempt — see
# infra/connection-gate.ts, which decides from the raw peer address during the
# WebSocket upgrade.
# One user opens many doc-connections (meta + every Space, x2 under dev StrictMode),
# so keep the threshold generous to avoid false-banning legitimate users; fine-grained
# abuse control belongs at the authenticated-user layer, not per-IP.
throttle_enabled: true
throttle_max_attempts: 200       # max connections per IP within the 60s window before a ban
throttle_ban_time: 1             # ban duration in MINUTES (the extension multiplies by 60*1000 — NOT ms)

# ── Persistence ───────────────────────────────────
# Quiet mode: suppress internal Hocuspocus logs (use our pino logger instead).
quiet: true

# ── Timed Store (#40) ─────────────────────────────
# Storing runs on a timer, not on "somebody changed something". The two
# settings above (debounce / max_debounce) still describe when Hocuspocus
# FIRES its own store hook — that call now returns without writing anything,
# because only the timed loop and the unload gate are allowed to write. They
# stay because raising them instead is not an option: `shouldUnloadDocument`
# is false the whole time a store is pending, so a large debounce strands
# every document in memory.
#
# The interval is a WRITE-LOAD knob, not a safety knob. Every case that would
# otherwise lose content is covered elsewhere: a user closing a tab and a
# normal restart both go through the unload gate, and one instance dying
# leaves the others holding the same content (they count relayed updates too,
# so they store it themselves). What is left is losing power to every instance
# at once, and 2 seconds versus 10 makes no difference to that — the answer
# there is the rescue file plus the alert, not storing more often.
store_interval_ms: 10000

# There is deliberately no timeout over a store, here or anywhere. A store is
# one event with two outcomes — it lands or it does not — and only the write
# itself can say which. A clock racing it cancels nothing, so giving up on one
# produces no answer at all, just a third state ("cannot say") that then gets
# the document rescued to disk and an operator mailed about it. That is not
# hypothetical: three such alerts fired in smoke against a healthy database
# answering in 250ms.
#
# There is one store path and one only: a document about to leave memory is
# stored to the database, and its content goes to disk only if that does not
# land. The timed round above does not write to disk at all — a failed round
# needs nothing but the next round.

# Where content goes when the final attempt does not land. Relative paths are
# resolved from the monorepo root; in Docker this sits under the mounted
# ./logs volume so the files survive the container. They are NEVER removed
# automatically — each one is the only remaining copy of somebody's work.
store_rescue_dir: logs/collab/rescue

# Who to tell when that happens. LEAVE THIS SET IN PRODUCTION: a rescue file
# nobody is told about is a file nobody reads. Note EMAIL_BACKEND defaults to
# `disabled` and both env templates ship it disabled — with it disabled the
# alert only reaches the log, which collab says explicitly rather than
# failing quietly.
store_alert_email: ""

# One outage means one failure per open document per round. Alerts collapse
# to one per document per window.
store_alert_window_ms: 600000

# How long the mail transport gets before the alert is written off. It needs
# its own bound: the transport is built without timeout options, so it
# inherits nodemailer's two-minute connection timeout, and the unload gate
# waits for the alert. An unreachable SMTP host during a database outage would
# otherwise hold every unloading document in memory for two minutes each.
store_alert_timeout_ms: 3000

# ── Handling Lease (#1580) ────────────────────────
# 'handling' is fragile shared Yjs state; its driver (a browser uploading,
# a Worker running AIGC) can die silently. These tune the collab sweeper, the
# ONLY consumer of these values — server/worker just stamp timestamps, and web
# derives an expired-lease display state from the shared HANDLING_TIMEOUT_MS
# constant, never from this file.
#
# NOT the same as worker.yaml's `lock_duration_ms` (10min): that is BullMQ's
# own stalled-worker detection (fast path → the worker.on failed net); THIS
# lease is the last-resort Yjs-node backstop (1h).
handling_lease:
  # Default lease budget (ms) per phase. A backend op has TWO phases, each
  # re-stamped and each measured against a budget: 'queued' (enqueue→pickup)
  # always uses this default; 'running' (execution) uses budget_overrides
  # below if the node's operation matches, else this default. 1h is generous
  # by design — its job is to bound rare zombies, not to fit op durations.
  default_budget_ms: 3600000        # 1 hour
  # Per-operation execution-budget overrides (ms), keyed by the canvas node's
  # `data.operation`. Raise for genuinely long ops (e.g. video export) so the
  # sweeper does not reclaim a live job. Empty = every op uses the default.
  budget_overrides: {}
  #   video_export: 7200000         # example: 2h for video export
