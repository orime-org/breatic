# Prices for the agent's paid service calls that report no cost of their own,
# in US dollars per request. Model calls are priced by provider
# (config/provider/llm.yaml).

services:
  # https://api-dashboard.search.brave.com/app/plans ($5 per 1,000 requests)
  brave_web_search:
    per_request: 0.005
  brave_image_search:
    per_request: 0.005
