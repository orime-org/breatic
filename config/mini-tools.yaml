# Mini-tools that run in the media container (inner#888 §8, §9).
#
# Each container operation names the container class it runs in and the
# seconds the credit precheck holds the user to. The precheck is a floor, not
# the bill: a run is charged for the seconds it actually used, priced below.
# How long a run may take is the node task budget (config/node-tasks.yaml),
# the one ceiling every task has.

# How often the worker asks the ingest Worker how a job is doing.
poll_interval_ms: 5000

executions:
  video.remove-bg:
    model: "bria-fibo-video-background-remover"
    # Encoding the model's input runs on standard-4, held to the same precheck as its other tools.
    preparation:
      container_class: "MiniToolContainerStd4"
      precheck_seconds: 300
  # Provisional: reuse the existing eight-output job contract and cut's 300 s
  # precheck, not measured capacity. Std4 worst-sample qualification is pending.
  video.extract-frames:
    container_class: "MiniToolContainerStd4"
    precheck_seconds: 300
    max_outputs: 8
    # Outputs one batch job writes; at most the job contract's eight.
    max_outputs_per_job: 8
  video.split:
    container_class: "MiniToolContainerStd4"
    precheck_seconds: 300
    max_outputs: 8
    max_outputs_per_job: 8
  # A video focus crop takes one grid frame from the tool source, as frame extraction does; the platform pays for it.
  video.focus-crop:
    container_class: "MiniToolContainerStd4"
    precheck_seconds: 300
  # Lip-sync (inner#1306): each model's schema_fingerprint is the sha256 of its live model_run request_schema
  # serialized with sorted keys; a changed fingerprint means the provider changed the request contract. Both
  # models completed a one-frame clip, so the floor is one frame at 25 fps; the ceilings are the catalog's.
  video.lip-sync:
    container_class: "MiniToolContainerStd4"
    precheck_seconds: 300
    max_outputs: 1
    models:
      - name: "sync-lipsync-3"
        schema_fingerprint: "b8ce4750db984012285fd6086a514fb109ffd91f804863bf6d4cb7f0d0f73981"
        min_duration_seconds: 0.04
        max_duration_seconds: 300
        crop_size: 512
        accepts_sync_mode: false
    tracking:
      model: "sam3-video-rle"
      min_duration_seconds: 0.04
      max_duration_seconds: 600
    max_people: 2
    max_dialogues: 8
    # The composite feathers each face's edge over this fraction of the face's shorter side.
    face_feather: 0.1
  # Encode chunks and the stitch run on standard-4; the overlap window renders on the GL image at the same size.
  video.transitions:
    container_class: "MiniToolContainerStd4"
    window_container_class: "MiniToolContainerGl"
    precheck_seconds: 300
    max_outputs: 1
  # Erase (inner#1306): Bria's masked eraser keeps 24-30 fps and VFR frame for frame and refuses 60 fps with code 1401, so
  # inputs above 30 fps are resampled on a 30 fps grid; it accepted inputs from 1 s to 5 s. The matte widens the tracked
  # mask and softens its edge, in source pixels.
  video.erase:
    container_class: "MiniToolContainerStd4"
    precheck_seconds: 300
    max_outputs: 1
    model:
      name: "bria-video-eraser-mask"
      min_seconds: 1
      max_seconds: 5
      max_grid_fps: 30
      async_rejection:
        path: "code"
        equals: 1401
    matte:
      dilate: 4
      feather: 4
  # Expand (inner#1306): VACE windows of at most 10 s at 16 fps overlapping 0.625 s; a source up to 180 s fits the two-hour
  # task budget at the slowest measured window, and the target's long side is held to 4096 pixels.
  video.expand:
    container_class: "MiniToolContainerStd4"
    precheck_seconds: 300
    max_outputs: 1
    model:
      name: "wan-2.1-14b-vace"
      max_window_seconds: 10
      overlap_seconds: 0.625
      model_fps: 16
    max_duration_seconds: 180
    max_target_side: 4096

# Chunked full-resolution encoding. Each chunk targets chunk_share of the
# remaining task budget; a run uses at most max_parallel_chunks chunks, and a
# presentation needing more fails as too_long. Encode jobs run only on
# standard-4 (basic only probes and copies), so the rates are configured for it:
# a job's seconds are start_seconds + (encoded + pre-roll frames) x (source
# pixels / decode-convert rate [+ source pixels / tone-map rate] + output pixels
# / encode rate). Rates were measured on a maintainer machine held to
# standard-4 limits; replace them with readings taken on Cloudflare standard-4.
encoding:
  chunk_share: 0.5
  max_parallel_chunks: 8
  # A failed chunk attempt is retried this many times before the presentation fails.
  chunk_retries: 3
  # Decoded frames one job holds to play a tracking clip backwards; a longer reversed clip is reversed in chunks
  # stitched latest first. 2 GiB is a sixth of standard-4's 12 GiB.
  reverse_buffer_bytes: 2147483648
  # The share of a job's instance disk (classes.<class>.disk_gb) its raw decoded frames may fill; the rest holds its
  # downloaded inputs and encoded output. A lip-sync plan freezes it at admission: a clip's reused crops and a composite
  # chunk whose source goes back, decoded to a raw file, stay within it; every other frame streams through pipes.
  raw_disk_share: 0.5
  encoder:
    container_class: "MiniToolContainerStd4"
    start_seconds: 3
    # Local Docker readings at nproc 4 (encode-throughput nproc4 and 12-bit runs),
    # to be replaced by measurements on Cloudflare standard-4.
    encode_pixels_per_second: 248000000
    # The original's source pixels per second, by its source decode key (frames-split §5.4): each key's slowest covered
    # codec, 4-thread maintainer readings, to be replaced by measurements on Cloudflare standard-4. sdr_8bit is 8-bit
    # 4:4:4 VP9, sdr_10bit and sdr_12bit 10- and 12-bit 4:4:4 VP9, sdr_alpha_layer HEVC with an alpha layer,
    # sdr_prores ProRes 4444, sdr_dnx DNxHR 444, sdr_av1_* 4:4:4 AV1, sdr_jpeg2000 12/16-bit RGB JPEG2000, sdr_ffv1
    # 16-bit FFV1, sdr_png 16-bit PNG, sdr_other MJPEG.
    decode_convert_pixels_per_second:
      sdr_8bit: 910000000
      sdr_10bit: 810000000
      sdr_12bit: 690000000
      sdr_alpha_layer: 600000000
      sdr_prores: 820000000
      sdr_dnx: 735000000
      sdr_av1_8bit: 740000000
      sdr_av1_10bit: 570000000
      sdr_av1_12bit: 610000000
      sdr_jpeg2000: 25000000
      sdr_ffv1: 75000000
      sdr_png: 340000000
      sdr_other: 1080000000
    # Source pixels an HDR original's edit-file encode tone maps per second: the slowest measured filter graph (odd sizes).
    tonemap_pixels_per_second: 420000000
    # Output pixels per second each edit-file tier encodes; provisional until measured on Cloudflare standard-4.
    edit_h264_intra_8bit_420_pixels_per_second: 300000000
    edit_h264_intra_10bit_420_pixels_per_second: 250000000
    edit_h264_intra_8bit_444_pixels_per_second: 200000000
    edit_h264_intra_10bit_444_pixels_per_second: 180000000
    edit_prores_pixels_per_second: 400000000
    # Audio seconds encoded to AAC 48 kHz per second, for the dispatched copy's estimate.
    # Local Docker reading at nproc 4 (aac-encode-rate run), to be replaced by a measurement on Cloudflare standard-4.
    aac_encode_seconds_per_second: 100
    # Picture pixels per second YuNet searches in the lip-sync faces step, one detector thread: a maintainer-machine reading
    # (arm64 Docker at standard-4 limits, 1080p frames), to be replaced by a Cloudflare standard-4 measurement.
    face_detect_pixels_per_second: 13000000
  # Source pixels per second each edit-file tier decodes when a tool reads the edit file; provisional until measured
  # on Cloudflare standard-4.
  decoder:
    edit_h264_intra_8bit_420_pixels_per_second: 1500000000
    edit_h264_intra_10bit_420_pixels_per_second: 1200000000
    edit_h264_intra_8bit_444_pixels_per_second: 1100000000
    edit_h264_intra_10bit_444_pixels_per_second: 900000000
    edit_prores_pixels_per_second: 950000000

# Frozen into each planned job; oversized output fails without being truncated.
plan_limits:
  probeStdoutBytes: 268435456
  analysisStdoutBytes: 16777216
  stderrTailBytes: 65536

# Automatic presentation preparation is platform funded and uses the metadata container.
presentation:
  container_class: "MediaContainer"
  # The target presentation policy; raise it when a policy change must prepare every source again.
  policy_version: 1
  # Frames the probe decodes to classify alpha and colour: one classified every measured fixture.
  probe_sample_frames: 1
  # How long a single-frame source is shown.
  single_frame_duration_ms: 5000
  # The frame-rate rule's cap: a source above it gets its rate from its packets.
  max_fps: 120
  # The playback file's keyframe interval in seconds.
  playback_gop_seconds: 2
  # The most bytes the probe may print.
  probe_output_max_bytes: 67108864
  # Equal to storage.yaml upload.max_upload_bytes: every uploadable video is presented.
  max_source_bytes: 2147483648
  max_packed_bytes: 1073741824
  crf: 18
  preset: "medium"
  # The edit file tools read when the original cannot be read frame-accurately: all-intra H.264 or ProRes 4444.
  # bytes_per_pixel estimates its size before it is written; it and max_edit_bytes are provisional until measured.
  max_edit_bytes: 21474836480
  edit:
    crf: 15
    preset: "medium"
    prores_profile: "4444"
    bytes_per_pixel: 0.5
  # An encoded carrier: short side at most max_short_side, labelled SDR BT.709;
  # it is encoded on encoding.encoder.container_class.
  carrier:
    max_short_side: 1080
    color:
      primaries: "bt709"
      transfer: "bt709"
      matrix: "bt709"
      range: "tv"

# Canonical results remain discoverable until their delivery is acknowledged.
delivery:
  discovery_interval_ms: 30000
  discovery_page_size: 100

# A billing lookup lease and retry delay; neither changes the node task budget.
settlement:
  lease_ms: 60000
  retry_ms: 30000
  lookup_timeout_ms: 15000
  discovery_interval_ms: 30000
  discovery_page_size: 100

# Cloudflare's published per-second prices
# (https://developers.cloudflare.com/containers/pricing/, read 2026-10-07).
prices:
  vcpu_second_usd: 0.00002
  memory_gib_second_usd: 0.0000025
  disk_gb_second_usd: 0.00000007

# One class per instance type, each with the instance type's published size.
classes:
  MediaContainer:
    instance_type: "basic"
    vcpu: 0.25
    memory_gib: 1
    disk_gb: 4
  MiniToolContainerStd1:
    instance_type: "standard-1"
    vcpu: 0.5
    memory_gib: 4
    disk_gb: 8
  MiniToolContainerStd4:
    instance_type: "standard-4"
    vcpu: 4
    memory_gib: 12
    disk_gb: 20
  MiniToolContainerGl:
    instance_type: "standard-4"
    vcpu: 4
    memory_gib: 12
    disk_gb: 20
    # Output pixels the headless-gl renderer draws per second on llvmpipe: provisional, the encoder's rate until a
    # Cloudflare standard-4 measurement replaces it.
    render_pixels_per_second: 248000000
  # The page reader web_fetch runs (inner#1664); no op names it.
  WebReaderContainer:
    instance_type: "standard-2"
    vcpu: 1
    memory_gib: 6
    disk_gb: 12

ops:
  crop:
    container_class: "MiniToolContainerStd1"
    precheck_seconds: 300
  speed:
    container_class: "MiniToolContainerStd1"
    precheck_seconds: 300
  cut:
    container_class: "MiniToolContainerStd1"
    precheck_seconds: 300
  adjust:
    container_class: "MiniToolContainerStd1"
    precheck_seconds: 300
  audio_denoise:
    container_class: "MiniToolContainerStd1"
    precheck_seconds: 300
  stabilize:
    container_class: "MiniToolContainerStd4"
    precheck_seconds: 900
  hdr:
    container_class: "MiniToolContainerStd4"
    precheck_seconds: 900
  # inner#1305: the audio operations, each one ffmpeg run, one pipe through sox,
  # or (normalize) a measuring ffmpeg pass and then one ffmpeg run.
  denoise:
    container_class: "MiniToolContainerStd1"
    precheck_seconds: 300
  normalize:
    container_class: "MiniToolContainerStd1"
    precheck_seconds: 300
  audio_speed:
    container_class: "MiniToolContainerStd1"
    precheck_seconds: 300
  audio_cut:
    container_class: "MiniToolContainerStd1"
    precheck_seconds: 300
  eq:
    container_class: "MiniToolContainerStd1"
    precheck_seconds: 300
  compress:
    container_class: "MiniToolContainerStd1"
    precheck_seconds: 300
  pan:
    container_class: "MiniToolContainerStd1"
    precheck_seconds: 300
  reverb:
    container_class: "MiniToolContainerStd1"
    precheck_seconds: 300
  voice:
    container_class: "MiniToolContainerStd1"
    precheck_seconds: 300
  pitch:
    container_class: "MiniToolContainerStd1"
    precheck_seconds: 300
  # inner#1825: the joins read every clip and write their sum, so they run on
  # the 20 GB disk; a crossfade re-encodes every clip.
  join:
    container_class: "MiniToolContainerStd4"
    precheck_seconds: 900
  audio_join:
    container_class: "MiniToolContainerStd4"
    precheck_seconds: 900

# The most clips one join takes, its source included (inner#1825 §6.3). The
# join panel's add tile and slot pick stop here; at most
# MINI_TOOL_JOB_MAX_EXTRA_INPUTS + 1, which the job contract can carry.
join_max_clips: 20

# The audio cut band draws the source's waveform from the peaks file beside it
# (inner#1305 §4.4). An audio without one yet is decoded in the browser only
# under both of these: the length bounds the memory the decode holds (decoding
# 600 s of 48 kHz stereo audio takes Chromium to about 650 MB), the size what it
# downloads.
waveform_max_seconds: 600
waveform_max_bytes: 200000000
# A band over those, open before its peaks are written, reads them again this
# often for this long.
waveform_peaks_retry_ms: 5000
waveform_peaks_retry_max_ms: 600000
# A video tool panel asks for a quote once the inputs it prices have held still this long,
# so a playing video does not ask on every frame.
quote_debounce_ms: 300

# Frozen public detector/provider profiles for accepted analyses (inner#1306).
# The worker consumes the accepted profile; later config changes apply to new runs.
analyses:
  people:
    container_class: "MiniToolContainerStd1"
    precheck_seconds: 300
    profile:
      id: "opencv-yunet-2023mar"
      version: "2023mar"
      weightsHash: "8f2383e4dd3cfbb4553ea8718107fc0423210dc964f9f4280604804ed2552fa4"
      params:
        scoreThreshold: 0.6
        nmsThreshold: 0.3
        topK: 5000
  scene_cuts:
    container_class: "MiniToolContainerStd1"
    precheck_seconds: 300
    profile:
      id: "pyscenedetect-content"
      version: "0.7.2"
      weightsHash: null
      params:
        threshold: 27
        minSceneLength: 15
  tracked_mask:
    container_class: "MiniToolContainerStd1"
    precheck_seconds: 300
    profile:
      id: "sam3-video-rle"
      version: "wavespeed-ai/sam3-video-rle"
      weightsHash: null
      params:
        apply_mask: false
        # The prompt sent when the selection's description is empty.
        default_prompt: "object"
    # The forward and reversed tracking clips are prepared on standard-4.
    preparation:
      container_class: "MiniToolContainerStd4"
      precheck_seconds: 300
