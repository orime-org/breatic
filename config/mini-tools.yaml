# Mini-tools that run in the media container (inner#888 §8, §9).
#
# Each container operation names the container class it runs in and the
# seconds the credit precheck holds the reader to. The precheck is a floor, not
# the bill: a run is charged for the seconds it actually used, priced below.
# How long a run may take is the node task budget (config/node-tasks.yaml),
# the one ceiling every task has.

# How often the worker asks the ingest Worker how a job is doing.
poll_interval_ms: 5000

# Cloudflare's published per-second prices
# (https://developers.cloudflare.com/containers/pricing/, read 2026-10-07).
prices:
  vcpu_second_usd: 0.00002
  memory_gib_second_usd: 0.0000025
  disk_gb_second_usd: 0.00000007

# One class per instance type, each with the instance type's published size.
classes:
  MiniToolContainerStd1:
    instance_type: "standard-1"
    vcpu: 0.5
    memory_gib: 4
    disk_gb: 8
  MiniToolContainerStd4:
    instance_type: "standard-4"
    vcpu: 4
    memory_gib: 12
    disk_gb: 20

ops:
  crop:
    container_class: "MiniToolContainerStd1"
    precheck_seconds: 300
  speed:
    container_class: "MiniToolContainerStd1"
    precheck_seconds: 300
  cut:
    container_class: "MiniToolContainerStd1"
    precheck_seconds: 300
  adjust:
    container_class: "MiniToolContainerStd1"
    precheck_seconds: 300
  audio_denoise:
    container_class: "MiniToolContainerStd1"
    precheck_seconds: 300
  stabilize:
    container_class: "MiniToolContainerStd4"
    precheck_seconds: 900
  hdr:
    container_class: "MiniToolContainerStd4"
    precheck_seconds: 900
  # inner#1305: the audio operations, each one ffmpeg run, one pipe through sox,
  # or (normalize) a measuring ffmpeg pass and then one ffmpeg run.
  denoise:
    container_class: "MiniToolContainerStd1"
    precheck_seconds: 300
  normalize:
    container_class: "MiniToolContainerStd1"
    precheck_seconds: 300
  audio_speed:
    container_class: "MiniToolContainerStd1"
    precheck_seconds: 300
  audio_cut:
    container_class: "MiniToolContainerStd1"
    precheck_seconds: 300
  eq:
    container_class: "MiniToolContainerStd1"
    precheck_seconds: 300
  compress:
    container_class: "MiniToolContainerStd1"
    precheck_seconds: 300
  pan:
    container_class: "MiniToolContainerStd1"
    precheck_seconds: 300
  reverb:
    container_class: "MiniToolContainerStd1"
    precheck_seconds: 300
  voice:
    container_class: "MiniToolContainerStd1"
    precheck_seconds: 300
  pitch:
    container_class: "MiniToolContainerStd1"
    precheck_seconds: 300

# The audio cut band draws the source's waveform from the peaks file beside it
# (inner#1305 §4.4). An audio without one yet is decoded in the browser only
# under both of these: the length bounds the memory the decode holds (decoding
# 600 s of 48 kHz stereo audio takes Chromium to about 650 MB), the size what it
# downloads.
waveform_max_seconds: 600
waveform_max_bytes: 200000000
# A band over those, open before its peaks are written, reads them again this
# often for this long.
waveform_peaks_retry_ms: 5000
waveform_peaks_retry_max_ms: 600000
