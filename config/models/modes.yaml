# Mode definitions for AIGC providers.
# Each modality lists its supported modes with human-readable labels and
# descriptions.
# Guidelines:
#   modes.*.label       — the product's name for this mode, in the words the
#                         picker puts on screen. The mode code is nowhere in
#                         the panel, so this is the only thing a reader can
#                         match an answer against: a name of the catalog's own
#                         invention names a mode no selector shows. English in
#                         every locale, the way the pickers hold them.
#   modes.*.description — what this mode is for, in prose. It reaches the agent
#                         quoted whole, beside the models and parameters this
#                         mode reaches, so the sources it names have to be the
#                         ones the picker offers for this mode: a description
#                         naming a reference image, a driving video, a portrait
#                         or a first frame is telling a reader which slots they
#                         will be given, and "no media input needed" is telling
#                         them there are none. Guarded by domain's
#                         guides-name-what-the-model-takes test, which reads
#                         each model's own `fill` declarations — over the
#                         modes a generation node's picker offers, which is
#                         where that answer quotes them. A mode no picker
#                         offers is walked by no guard, so the rule above is
#                         what a person holds it to.
#   The material a run needs is declared on each model (its canvas and pool
#   params, and `source_groups`), not here: two models in one mode can take
#   different sources.

image:
  modes:
    t2i:
      label: Text to Image
      description: >
        Generate a new image from a text description.
    i2i:
      label: Image to Image
      description: >
        Edit an image using it as the source: inpainting, object add or
        remove, style transfer, background changes.
    edit:
      label: Image Editing
      description: >
        Modify specific content of an existing image — add, remove, or
        replace elements, change text, apply style transfer. The source
        image is preserved with only targeted changes applied.
    upscale:
      label: Image Upscaling
      description: >
        Enlarge an image to higher resolution (2K/4K/8K) while preserving
        detail and sharpness. Standard or creative (prompt-guided) modes.
    remove_bg:
      label: Background Removal
      description: >
        Remove the background from an image, outputting the subject
        on a transparent background with precise alpha matting.

video:
  modes:
    t2v:
      label: Text to Video
      description: >
        Generate a new video from a text description. Some models also take
        reference images, reference videos and reference audio to steer the
        look, motion and sound.
    i2v:
      label: Image to Video
      description: >
        Animate a still image into a video. The image becomes the first frame.
    first_last:
      label: First-Last Frame
      description: >
        Generate a video that starts from one image and ends on another.
        Both frames are required; the model fills the motion between them.
    ref:
      label: Reference to Video
      description: >
        Generate a video from reference images for character and style
        consistency, with reference videos and reference audio on the models
        that take them. Unlike i2v, the references guide the result rather
        than being the first frame.
    multi_shot:
      label: Multi-Shot
      description: >
        Describe one video shot by shot: each shot gets its own prompt, and the
        model cuts between them in order. Some models also take a first frame
        or reference images.
    extend:
      label: Video Extension
      description: >
        Continue an existing video with consistent style and motion.
    edit:
      label: Video Editing
      description: >
        Modify the content of an existing video (add/remove/change elements).
    motion:
      label: Motion Control
      description: >
        Drive character movement using a reference image and motion description.
    animate:
      label: Image Animation
      description: >
        Animate a character image with driving motion.
    talking_head:
      label: Talking Head
      description: >
        Generate a talking head video from a portrait image and audio.
    upscale:
      label: Video Upscaling
      description: >
        Enhance resolution of an existing video (e.g. 720p to 4K) while
        preserving detail and temporal consistency.
    interpolate:
      label: Frame Interpolation
      description: >
        Increase frame rate by inserting AI-generated intermediate frames
        for smoother motion or slow-motion effects.

audio:
  modes:
    t2m:
      label: Text to Music
      description: >
        Generate music from a text description of genre, mood and instruments,
        with lyrics on the models that sing them. One model also takes an
        image whose mood the music follows.
    a2m:
      label: Reference to Music
      description: >
        Generate new music guided by a reference audio track, a melody, a
        voice to sing with, or a video to score. The reference shapes the
        output.
    sfx:
      label: Sound Effects
      description: >
        Generate sound effects or ambient audio from a text description.
        Short-form audio clips for Foley, UI sounds, or environmental audio.
    extend:
      label: Music Extension
      description: >
        Continue an existing audio track with a seamless tail in the same
        style.
    separate:
      label: Audio Separation
      description: >
        Separate vocals from instrumental in any audio track. Outputs
        isolated vocal or instrumental stem.

tts:
  modes:
    tts:
      label: Text to Speech
      description: >
        Convert text into natural-sounding speech in one voice, with
        emotion control and multiple languages.
    voice_clone:
      label: Voice Cloning
      description: >
        Clone a voice from a short reference audio sample, then synthesize
        new speech in that voice. No fine-tuning required.

three_d:
  modes:
    t23d:
      label: Text to 3D
      description: >
        Generate a 3D model from a text description. Outputs mesh with
        textures in GLB/FBX/OBJ format. Supports PBR materials, topology
        control, and polycount targeting.
    i23d:
      label: Image to 3D
      description: >
        Convert one or more 2D images into a 3D model. Single-image input
        for quick conversion, multi-view input for higher fidelity. Some
        models support mask-based object extraction.
