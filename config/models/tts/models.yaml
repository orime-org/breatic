  - name: "minimax-voice-clone"
    display_name: "MiniMax Voice Clone"
    mode: "voice_clone"
    takes_prompt: true
    prompt_upstream: "text"
    tier: "recommended"
    description: "One voice ID reused across shots"
    guide: "One character's voice, minted once and reused by ID across every shot in the project."
    generation_time: 120
    icon: "minimax"
    max_input_chars: 2000
    params:
      audio:
        description: "Source audio"
        default: null
        accepts: "audio"
        fill: "canvas"
      custom_voice_id:
        description: "Id for the cloned voice"
        default: null
        fill: "none"
        note: "worker generates it on the first use of a reference audio and reuses it for that audio (keep reason)"
      model:
        description: "Speech model that uses the clone"
        default: "speech-2.8-hd"
        values: ["speech-02-hd", "speech-02-turbo", "speech-2.5-hd-preview", "speech-2.5-turbo-preview", "speech-2.6-hd", "speech-2.6-turbo", "speech-2.8-hd", "speech-2.8-turbo"]
        fill: "none"
        note: "our default: the TTS model we keep"
      need_noise_reduction:
        description: "Clean background noise from the sample"
        default: true
        fill: "none"
        note: "our default: cleaner clone"
    extra_steps:
      - endpoint: "minimax/speech-2.8-hd"
        at: "after"
        pricing:
          base_price: 100000
          formula: "{\"total_price\":base_price * $length(text) / 1000}"
          discount_rate: 100
    reused_by: "audio"
    providers:
      - name: "wavespeed"
        model_id: "minimax/voice-clone"
        priority: 1
        pricing:
          base_price: 1600000
          formula: ""
          discount_rate: 100

