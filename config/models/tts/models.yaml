        # The BCP-47 tag of each value above, same order: the panel names the
        # language in the reader's own words from it.
        value_locales: ["ar-EG", "bn-BD", "nl-NL", "en-IN", "en-US", "fr-FR", "de-DE", "hi-IN", "id-ID", "it-IT", "ja-JP", "ko-KR", "mr-IN", "pl-PL", "pt-BR", "ro-RO", "ru-RU", "es-ES", "ta-IN", "te-IN", "th-TH", "tr-TR", "uk-UA", "vi-VN"]
        fill: "panel"
      speakers:
        description: "Named speakers and their voices"
        label: "Speakers"
        default: null
        type: "items"
        # The upstream takes exactly two, and ignores the single voice once
        # they are given.
        min_items: 2
        max_items: 2
        replaces: "voice_id"
        fields:
          speaker:
            type: "text"
          voice:
            values: ["Achernar", "Achird", "Algenib", "Algieba", "Alnilam", "Aoede", "Autonoe", "Callirrhoe", "Charon", "Despina", "Enceladus", "Erinome", "Fenrir", "Gacrux", "Iapetus", "Kore", "Laomedeia", "Leda", "Orus", "Puck", "Pulcherrima", "Rasalgethi", "Sadachbia", "Sadaltager", "Schedar", "Sulafat", "Umbriel", "Vindemiatrix", "Zephyr", "Zubenelgenubi"]
        fill: "panel"
      voice_id:
        upstream: "voice"
        description: "Voice"
        default: "Kore"
        remote_source: "voices"
        fill: "remote"
    providers:
      - name: "wavespeed"
        model_id: "google/gemini-3.1-flash/text-to-speech"
        priority: 1
        pricing:
          base_price: 200000
          formula: "{\"total_price\": $max([10000, $ceil(base_price * $length(text) / 1000)])}"
          discount_rate: 100

