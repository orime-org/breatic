    params:
      voice_id:
        description: "Voice identifier"
        # Filled by the voice picker, from GET /models/:name/voices. Both
        # upstreams behind this model read the same ElevenLabs voice id: the
        # direct connection because it is ElevenLabs, and WaveSpeed because it
        # forwards to it. Probed 2026-09-04 — of the 52 display names WaveSpeed
        # publishes, 8 come back "not found", every one of them a voice
        # ElevenLabs lists as Legacy; sending ids instead reaches those too,
        # since the vendor reroutes a Legacy id to its replacement.
        remote_source: voices
        # Alice.
        default: "Xb7hH8MSUJpSbSDYk0k2"
      stability:
        description: "Voice consistency (0-1)"
        # 0.0-1.0, default 0.5, on both upstreams that carry this model and on
        # fal, which serves it too
        # (elevenlabs.io/docs/api-reference/text-to-speech/convert,
        # wavespeed.ai/docs/docs-api/elevenlabs/elevenlabs-eleven-v3,
        # fal.ai/models/fal-ai/elevenlabs/tts/eleven-v3/api).
        min: 0.0
        max: 1.0
        step: 0.05
        default: 0.5
      similarity:
        description: "Closeness to base voice (0-1)"
        # 0.0-1.0, default 0.75 (elevenlabs/skills, text-to-speech/references/
        # voice-settings.md).
        min: 0.0
        max: 1.0
        step: 0.05
        default: 0.75
    providers:
      - name: elevenlabs
        model_id: "eleven_v3"
        priority: 1
      - name: wavespeed
        model_id: "elevenlabs/eleven-v3"
        priority: 2
