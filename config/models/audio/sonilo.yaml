# Sonilo Audio Model Family — Sound Effects
# Guidelines:
#   model.description    — max 40 chars (shown in UI model selector, keep short)
#   model.guide          — what this model is for, in prose. The Skill prompt
#                          quotes it whole, to help the model choose; so does
#                          the canvas capability answer, for the models a canvas
#                          generation mode can reach, beside a parameter list
#                          built from the panel's own tables. So a sentence
#                          here the catalog or the panel can prove wrong is a
#                          promise nothing keeps: a slot this entry does not
#                          declare, a capability no control on this node
#                          reaches, a span of seconds its own duration denies,
#                          a "cheapest" or "slowest" its credits and
#                          generation_time deny. Judgement calls ("best for
#                          portraits") are the point of the field and stay.
#                          Guarded by domain's guides-name-what-the-model-takes
#                          test, over the models a canvas generation mode can
#                          reach.
#   model.mode           — sfx (sound effects)
#   param.description    — max 50 chars (shown as tooltip / help text)
#   param.default        — every param MUST have a default (used as fallback for invalid values)
#   param names          — user-facing; model family code converts to API format

models:
  - name: "sonilo-sfx-v1"
    display_name: "Sonilo SFX"
    icon: "sonilo"
    mode: "sfx"
    takes_prompt: true
    tier: recommended
    description: "Text to sound effects, 1-180s"
    guide: "Generate a sound effect from a text description. Stereo, at one of ten preset lengths. Choose for Foley, ambience, UI sounds, impacts and transitions."
    # The pre-enqueue balance gate reads this field, and the panel reads `rate`
    # below. A gate wants a floor, so this is the repo's shared minimum rather
    # than the cheapest preset — at the rate below, the longest preset is 36.
    cost_per_call: 5
    # $0.002 per second, measured against `POST /billings/search` on
    # 2026-09-04 (five seconds billed $0.010, three seconds $0.006), at
    # 1 credit = 1 US cent on the zero-margin deduction rule.
    rate:
      credits: 1
      per: 5
      unit: seconds
    generation_time: 10
    params:
      duration:
        description: "Clip length in seconds"
        # Probed 2026-09-04: the gateway refuses a missing duration, 0 ("must
        # be at least 1"), 181 ("must be at most 180") and 2.5 ("must be an
        # integer"). Named stops rather than a slider, the shape ElevenLabs'
        # playground uses; the stops themselves are ours, chosen as integers
        # across the 1..180 this gateway accepts.
        values: [1, 2, 5, 10, 15, 20, 30, 60, 120, 180]
        default: 5
      audio_format:
        # Omitting this returns aac, while `dispatch.ts` stores every audio
        # artefact under a `.mp3` extension. Declared rather than left to the
        # upstream so the bytes match the name they are stored under. A lone
        # default is not a constraint: `validateParams` substitutes it only for
        # a value outside a declared `values` list, so without one any format
        # sent would ride through while the artefact is stored under `.mp3`.
        description: "Output container"
        values: ["mp3"]
        default: "mp3"
    providers:
      - name: wavespeed
        model_id: "sonilo/v1/text-to-sfx"
        priority: 1
