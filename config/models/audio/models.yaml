# Models of this modality, every one run on WaveSpeed. Within a mode the first
# model listed is the one a panel opens on, so entries are ordered by how the
# catalog ranks them for their mode.
# Guidelines:
#   model.description    — max 40 chars, English. The picker draws it under
#                          display_name, so it is what tells a reader which of
#                          several models for one mode to pick: say what this
#                          model is good at, never restate the name or the mode.
#                          Only capabilities the panel reaches.
#   model.guide          — what this model is for, in prose. The Skill prompt
#                          and the canvas capability answer quote it whole, so a
#                          sentence here the catalog or the panel can prove wrong
#                          is a promise nothing keeps. Guarded by domain's
#                          guides-name-what-the-model-takes test.
#   model.prompt_upstream — the upstream field the prompt is sent as, when it is
#                          not `prompt` (`text`, `text_prompt`).
#   model.source_groups  — per mode, params of which at least one has to carry
#                          material, for inputs the upstream schema leaves
#                          optional one by one but refuses all empty.
#   model.extra_steps    — upstream calls a run makes besides the model's own
#                          endpoint, each priced by its own WaveSpeed contract;
#                          `at` says whether it runs before or after that call.
#   param.upstream       — the upstream field this param is sent as, when the
#                          names differ. The one mapping the request builder,
#                          the price estimate and the source check all read.
#   param.label          — English label for a control only this model has;
#                          shared controls take theirs from the locales.
#   param.value_labels   — how a value of `values` reads on screen, when its
#                          own spelling is not that (English); the rest read
#                          as themselves with a capital first letter.
#   param.type           — list (reference pool), items (a list editor, with
#                          `fields` and `max_items`), text (a free text field).
#                          `values: [true, false]` draws a switch; `min`, `max`
#                          and `step` draw a slider; other `values` an option group.
#   param.default        — what a run sends when the reader sets nothing.
#   provider.pricing     — the endpoint's WaveSpeed pricing contract, verbatim:
#                          base_price (1,000,000 = 1 USD), the JSONata formula
#                          (empty means base_price per call) and discount_rate
#                          in percent. The price estimate evaluates it.
#   generation_time      — max generation time in seconds (worst case)

models:

  - name: "mureka-v9.5-generate-song"
    display_name: "Mureka V9.5 Song"
    mode: ["t2m", "a2m"]
    takes_prompt: true
    tier: "recommended"
    description: "Top-ranked; sings lyrics you write"
    guide: "The full song when you have written the lyrics yourself."
    generation_time: 300
    icon: "mureka"
    source_groups:
      - mode: "a2m"
        any_of: ["song", "vocal", "melody"]
    params:
      lyrics:
        description: "Lyrics to sing"
        default: null
        fill: "editor"
      melody:
        upstream: "melody_id"
        description: "Melody to follow"
        default: null
        accepts: "audio"
        optional: true
        modes: ["a2m"]
        fill: "canvas"
      song:
        upstream: "reference_id"
        description: "Reference song"
        default: null
        accepts: "audio"
        optional: true
        modes: ["a2m"]
        fill: "canvas"
      vocal:
        upstream: "vocal_id"
        description: "Voice to sing with"
        default: null
        accepts: "audio"
        optional: true
        modes: ["a2m"]
        fill: "canvas"
    extra_steps:
      - endpoint: "mureka-ai/create-upload-id"
        at: "before"
        for_param: "song"
        pricing:
          base_price: 10000
          formula: ""
          discount_rate: 100
      - endpoint: "mureka-ai/create-upload-id"
        at: "before"
        for_param: "melody"
        pricing:
          base_price: 10000
          formula: ""
          discount_rate: 100
      - endpoint: "mureka-ai/vocal-clone"
        at: "before"
        for_param: "vocal"
        reused: true
        pricing:
          base_price: 7500000
          formula: ""
          discount_rate: 100
    providers:
      - name: "wavespeed"
        model_id: "mureka-ai/mureka-v9.5/generate-song"
        priority: 1
        pricing:
          base_price: 225000
          formula: ""
          discount_rate: 100

  - name: "mureka-v9.5-generate-bgm"
    display_name: "Mureka V9.5 BGM"
    mode: "t2m"
    takes_prompt: true
    tier: "optional"
    description: "Instrumental beds, no vocals"
    guide: "An instrumental bed when you have no lyrics and do not want vocals."
    generation_time: 300
    icon: "mureka"
    params: {}
    providers:
      - name: "wavespeed"
        model_id: "mureka-ai/mureka-v9.5/generate-bgm"
        priority: 1
        pricing:
          base_price: 225000
          formula: ""
          discount_rate: 100

