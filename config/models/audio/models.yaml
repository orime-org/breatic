  - name: "sonilo-video-to-music"
    display_name: "Sonilo Video to Music"
    mode: "a2m"
    takes_prompt: true
    tier: "optional"
    description: "Music timed to a clip's cuts"
    guide: "A moving image as the reference, with the music following its pacing."
    generation_time: 300
    icon: "sonilo"
    params:
      video:
        description: "Source video"
        default: null
        accepts: "video"
        fill: "canvas"
    providers:
      - name: "wavespeed"
        model_id: "sonilo/video-to-music"
        priority: 1
        pricing:
          base_price: 9000
          formula: "{\"total_price\": base_price * $max([10, $min([$ceil(get_duration(video)), 360])])}"
          discount_rate: 100

  - name: "sfx-1.6-text-to-audio"
    display_name: "Mirelo SFX 1.6"
    mode: "sfx"
    takes_prompt: true
    prompt_upstream: "text_prompt"
    tier: "recommended"
    description: "Foley-grade effects, seamless loops"
    guide: "Text input — one effect per take, with ambience that loops seamlessly."
    generation_time: 300
    icon: "mirelo"
    params:
      loop:
        upstream: "ambience"
        description: "Loops seamlessly end to start"
        label: "Seamless loop"
        default: false
        values: [true, false]
        fill: "panel"
      double_output:
        description: "Return two variations"
        default: false
        fill: "none"
        note: "pinned: one generation lands one result"
      duration:
        description: "Length in seconds"
        default: 10
        min: 0.1
        max: 60
        step: 0.1
        fill: "panel"
      num_samples:
        description: "Results per run"
        default: 1
        fill: "none"
        note: "pinned: one generation lands one result"
    providers:
      - name: "wavespeed"
        model_id: "mirelo-ai/sfx-1.6/text-to-audio"
        priority: 1
        pricing:
          base_price: 10000
          formula: "{\"total_price\": base_price * duration * num_samples}"
          discount_rate: 100

  - name: "sonilo-sfx-v1"
    display_name: "Sonilo Text to SFX"
    mode: "sfx"
