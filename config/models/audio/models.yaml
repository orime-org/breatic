    guide: "An existing recording kept as the melody and re-recorded in another style."
    generation_time: 300
    icon: "minimax"
    params:
      audio:
        description: "Source audio"
        default: null
        accepts: "audio"
        fill: "canvas"
    providers:
      - name: "wavespeed"
        model_id: "minimax/music-cover"
        priority: 1
        pricing:
