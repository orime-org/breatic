# ElevenLabs Audio Model Family — Music & Sound Effects
# Guidelines:
#   model.description    — max 40 chars (shown in UI model selector, keep short)
#   model.guide          — what this model is for, in prose. The Skill prompt
#                          quotes it whole, to help the model choose; so does
#                          the canvas capability answer, for the models a canvas
#                          generation mode can reach, beside a parameter list
#                          built from the declarations. So a sentence
#                          here the catalog or the panel can prove wrong is a
#                          promise nothing keeps: a slot this entry does not
#                          declare, a capability no control on this node
#                          reaches, a span of seconds its own duration denies,
#                          a "cheapest" or "slowest" its credits and
#                          generation_time deny. Judgement calls ("best for
#                          portraits") are the point of the field and stay.
#                          Guarded by domain's guides-name-what-the-model-takes
#                          test, over the models a canvas generation mode can
#                          reach.
#   model.mode           — t2m (text-to-music) | sfx (sound effects)
#   param.description    — max 50 chars (shown as tooltip / help text)
#   param.default        — every param MUST have a default (used as fallback for invalid values)
#   param names          — user-facing; model family code converts to API format

models:
  - name: "elevenlabs-sfx-v2"
    display_name: "ElevenLabs SFX V2"
    mode: "sfx"
    takes_prompt: true
    tier: recommended
    description: "Text-to-sound-effects, 0.5-22s"
    guide: "Generate sound effects from text descriptions. Best for Foley, UI sounds, ambient backgrounds, and short audio clips."
    cost_per_call: 5
    generation_time: 30
    params:
      duration_seconds:
        description: "Audio length in seconds (0.5-22)"
        default: null
        fill: none
        note: "the sound-effects length control is not built"
      prompt_influence:
        description: "How closely to follow prompt (0-1)"
        default: 0.3
        fill: none
        note: "the sound-effects adherence control is not built"
      loop:
        description: "Enable seamless looping"
        default: false
        fill: none
        note: "the sound-effects loop switch is not built"
    providers:
      - name: elevenlabs
        model_id: "eleven_text_to_sound_v2"
        priority: 1
      - name: fal
        model_id: "fal-ai/elevenlabs/sound-effects/v2"
        priority: 2
