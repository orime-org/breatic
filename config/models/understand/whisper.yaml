# Whisper Model Family — Speech-to-Text Transcription
# Guidelines:
#   model.description    — max 40 chars (shown in UI model selector, keep short)
#   model.guide          — what this model is for, in prose. The Skill prompt
#                          quotes it whole, to help the model choose; so does
#                          the canvas capability answer, for the models a canvas
#                          generation mode can reach, beside a parameter list
#                          built from the declarations. So a sentence
#                          here the catalog or the panel can prove wrong is a
#                          promise nothing keeps: a slot this entry does not
#                          declare, a capability no control on this node
#                          reaches, a span of seconds its own duration denies,
#                          a "cheapest" or "slowest" its credits and
#                          generation_time deny. Judgement calls ("best for
#                          portraits") are the point of the field and stay.
#                          Guarded by domain's guides-name-what-the-model-takes
#                          test, over the models a canvas generation mode can
#                          reach.
#   model.mode           — transcribe
#   param.description    — max 50 chars (shown as tooltip / help text)
#   param.default        — every param MUST have a default (used as fallback for invalid values)

models:
  - name: "whisper-turbo"
    display_name: "Whisper Large V3 Turbo"
    mode: "transcribe"
    takes_prompt: true
    tier: recommended
    description: "Fastest ASR, 30% cheaper"
    guide: "Fastest and cheapest speech-to-text. OpenAI Whisper Large V3 Turbo optimized for speed. 50+ languages with auto-detection. $0.0007/second. Choose for bulk transcription or when speed matters."
    cost_per_call: 1
    generation_time: 15
    params:
      audio:
        description: "Audio URL (MP3/WAV/FLAC, max 60min)"
        default: null
        fill: none
        accepts: audio
        note: "no generation panel reaches this model"
      language:
        description: "Language code or auto-detect"
        default: "auto"
        values: ["auto", "en", "zh", "ja", "ko", "de", "fr", "es", "pt", "ru", "ar", "hi", "it", "nl", "pl", "sv", "tr", "uk", "vi"]
        fill: none
        note: "no generation panel reaches this model"
    providers:
      - name: wavespeed
        model_id: "wavespeed-ai/openai-whisper-turbo"
        priority: 1
