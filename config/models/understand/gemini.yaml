# Gemini Vision Model Family — Full Multimodal Understanding
# Guidelines:
#   model.description    — max 40 chars. No panel shows it: the picker draws
#                          display_name. Its one reader is the canvas capability
#                          answer, which takes it when guide is empty.
#   model.guide          — what this model is for, in prose. The Skill prompt
#                          quotes it whole, to help the model choose; so does
#                          the canvas capability answer, for the models a canvas
#                          generation mode can reach, beside a parameter list
#                          built from the declarations. So a sentence
#                          here the catalog or the panel can prove wrong is a
#                          promise nothing keeps: a slot this entry does not
#                          declare, a capability no control on this node
#                          reaches, a span of seconds its own duration denies,
#                          a "cheapest" or "slowest" its credits and
#                          generation_time deny. Judgement calls ("best for
#                          portraits") are the point of the field and stay.
#                          Guarded by domain's guides-name-what-the-model-takes
#                          test, over the models a canvas generation mode can
#                          reach.
#   model.mode           — vi (vision-image) | vv (vision-video) | va (vision-audio)
#   param.description    — max 50 chars. No panel shows it either: the controls
#                          take their labels from the locales. It is what the
#                          canvas capability answer says this param is for.
#   param.default        — every param MUST have a default (used as fallback for invalid values)

models:
  # Gemini 2.5 Flash — cheapest, supports all 3 modes
  - name: "gemini-flash-vi"
    display_name: "Gemini Flash Image"
    mode: "vi"
    takes_prompt: true
    tier: optional
    description: "Cheapest image understanding"
    guide: "Fast and cheap image understanding. Describe content, extract text (OCR), analyze composition, reverse-engineer prompts. 1M token context supports many images at once. Choose for bulk image analysis or budget-sensitive tasks."
    cost_per_call: 1
    generation_time: 10
    params:
      images:
        description: "Image URLs to analyze"
        type: "list"
        default: null
        max_items: 20
        fill: none
        accepts: image
        note: "no generation panel reaches this model"
      max_tokens:
        description: "Max response length"
        default: 2048
        fill: none
        note: "no generation panel reaches this model"
    providers:
      - name: gemini
        model_id: "gemini-2.5-flash-preview-05-20"
        priority: 1
      - name: openrouter
        model_id: "google/gemini-2.5-flash-preview-05-20"
        priority: 2

  - name: "gemini-flash-vv"
    display_name: "Gemini Flash Video"
    mode: "vv"
    takes_prompt: true
    tier: optional
    description: "Cheapest video understanding"
    guide: "Fast and cheap video understanding. Describe scenes, analyze motion, identify actions, reverse-engineer video prompts. Supports long videos via Gemini's 1M context. Choose for video content analysis."
    cost_per_call: 3
    generation_time: 30
    params:
      video_url:
        description: "Video URL to analyze"
        default: null
        fill: none
        accepts: video
        note: "no generation panel reaches this model"
      max_tokens:
        description: "Max response length"
        default: 4096
        fill: none
        note: "no generation panel reaches this model"
    providers:
      - name: gemini
        model_id: "gemini-2.5-flash-preview-05-20"
        priority: 1
      - name: openrouter
        model_id: "google/gemini-2.5-flash-preview-05-20"
        priority: 2

  - name: "gemini-flash-va"
    display_name: "Gemini Flash Audio"
    mode: "va"
    takes_prompt: true
    tier: optional
    description: "Cheapest audio understanding"
    guide: "Fast and cheap audio understanding. Describe music style, identify instruments, transcribe lyrics, analyze mood, reverse-engineer audio prompts. Choose for audio content analysis."
    cost_per_call: 2
    generation_time: 20
    params:
      audio_url:
        description: "Audio URL to analyze"
        default: null
        fill: none
        accepts: audio
        note: "no generation panel reaches this model"
      max_tokens:
        description: "Max response length"
        default: 2048
        fill: none
        note: "no generation panel reaches this model"
    providers:
      - name: gemini
        model_id: "gemini-2.5-flash-preview-05-20"
        priority: 1
      - name: openrouter
        model_id: "google/gemini-2.5-flash-preview-05-20"
        priority: 2

  # Gemini 2.5 Pro — strongest understanding, supports all 3 modes
  - name: "gemini-pro-vi"
    display_name: "Gemini Pro Image"
    mode: "vi"
    takes_prompt: true
    tier: recommended
    description: "Best image understanding"
    guide: "Strongest image understanding with advanced reasoning. Best for complex visual analysis, detailed style extraction, precise prompt reverse-engineering, and multi-image comparison. Higher cost but significantly better quality."
