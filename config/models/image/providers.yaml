# Shared provider configuration for all image models (t2i, i2i, post).
# Each provider defines: base_url, api_key_env, max_concurrency. Calls are
# bounded by the task's own deadline, not by a figure here (inner#1367).

wavespeed:
  base_url: "https://api.wavespeed.ai/api/v3"
  api_key_env: WAVESPEED_API_KEY
  max_concurrency: 50
