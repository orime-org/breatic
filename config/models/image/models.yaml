# Models of this modality, every one run on WaveSpeed. Within a mode the first
# model listed is the one a panel opens on, so entries are ordered by how the
# catalog ranks them for their mode.
# Guidelines:
#   model.display_name   — the vendor's name for the model, never the mode it
#                          runs in: the mode picker already says that.
#   model.variant        — what tells this model apart from another one with
#                          the same display_name in some mode; a list joins
#                          it on only where both appear (`modelLabel`). The
#                          catalog refuses namesakes in one mode without one.
#   model.description    — max 40 chars, English. The picker draws it under
#                          display_name, so it is what tells a reader which of
#                          several models for one mode to pick: say what this
#                          model is good at, never restate the name or the mode.
#                          Only capabilities the panel reaches.
#   model.guide          — what this model is for, in prose. The canvas capability
#                          answer quotes it whole, so a
#                          sentence here the catalog or the panel can prove wrong
#                          is a promise nothing keeps. Guarded by domain's
#                          guides-name-what-the-model-takes test.
#   model.prompt_upstream — the upstream field the prompt is sent as, when it is
#                          not `prompt` (`text`, `text_prompt`).
#   model.source_groups  — per mode, params of which at least one has to carry
#                          material, for inputs the upstream schema leaves
#                          optional one by one but refuses all empty.
#   model.extra_steps    — upstream calls a run makes besides the model's own
#                          endpoint, each priced by its own WaveSpeed contract;
#                          `at` says whether it runs before or after that call.
#   param.upstream       — the upstream field this param is sent as, when the
#                          names differ. The one mapping the request builder,
#                          the price estimate and the voice-sample planner read.
#   param.label          — marks a control only this model has; on screen it
#                          is named by canvas.generatePanel.param.<name> in
#                          locales/*.json, like the shared controls.
#   param.value_labels   — how a value reads on screen, in English and never
#                          localized: a value of `values`, or a step of a
#                          `min`/`max`/`step` range; unlabelled values read as
#                          themselves with a capital first letter.
#   param.type           — list (reference pool), items (a list editor, with
#                          `fields` and `max_items`), text (a free text field).
#                          `values: [true, false]` draws a switch; `min`, `max`
#                          and `step` draw a slider; other `values` an option group.
#   param.default        — what the param holds when the reader sets nothing;
#                          a run sends it unless it equals `absent_value`.
#   param.absent_value   — the value that is sent as nothing: holding it
#                          leaves the param out of the request (`auto` lets
#                          the upstream decide).
#   provider.pricing     — the endpoint's WaveSpeed pricing contract, verbatim:
#                          base_price (1,000,000 = 1 USD), the JSONata formula
#                          (empty means base_price per call) and discount_rate
#                          in percent. The price estimate evaluates it.
#   generation_time      — max generation time in seconds (worst case)

models:

  - name: "gpt-image-2.5-sunburst-text-to-image"
    display_name: "GPT Image 2.5 Sunburst"
    mode: "t2i"
    takes_prompt: true
    tier: "recommended"
    description: "Top-ranked fidelity, 4K, 5 quality tiers"
    guide: "The default when the image simply has to be as good as it gets — highest measured fidelity and prompt adherence of anything available."
    generation_time: 120
    icon: "openai"
    params:
      aspect_ratio:
        description: "Output aspect ratio"
        default: "1:1"
        values: ["1:1", "1:2", "2:1", "1:3", "3:1", "2:3", "3:2", "3:4", "4:3", "4:5", "5:4", "9:16", "16:9", "9:21", "21:9"]
        fill: "panel"
      quality:
        description: "Rendering quality"
        label: "Quality"
        default: "medium"
        values: ["low", "medium", "high", "xhigh", "max"]
        value_labels: {xhigh: "XHigh"}
        fill: "panel"
      resolution:
        description: "Output resolution"
        default: "1k"
        values: ["1k", "2k", "4k"]
        fill: "panel"
    providers:
      - name: "wavespeed"
        model_id: "openai/gpt-image-2.5-sunburst/text-to-image"
        priority: 1
        pricing:
          base_price: 24000
          formula: "{\"total_price\": ((quality = \"low\") ? (resolution = \"4k\" ? 30000 : (resolution = \"2k\" ? 20000 : 10000)) : ((quality = \"high\") ? (resolution = \"4k\" ? 270000 : (resolution = \"2k\" ? 150000 : 90000)) : ((quality = \"xhigh\") ? (resolution = \"4k\" ? 480000 : (resolution = \"2k\" ? 270000 : 160000)) : ((quality = \"max\") ? (resolution = \"4k\" ? 1000000 : (resolution = \"2k\" ? 600000 : 360000)) : (resolution = \"4k\" ? 70000 : (resolution = \"2k\" ? 40000 : 24000))))))}"
          discount_rate: 100

