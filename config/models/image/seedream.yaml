# Seedream Image Models (ByteDance) — 5.0 Lite
# Guidelines:
#   model.description    — max 40 chars. No panel shows it: the picker draws
#                          display_name. Its one reader is the canvas capability
#                          answer, which takes it when guide is empty.
#   model.guide          — what this model is for, in prose. The Skill prompt
#                          quotes it whole, to help the model choose; so does
#                          the canvas capability answer, for the models a canvas
#                          generation mode can reach, beside a parameter list
#                          built from the declarations. So a sentence
#                          here the catalog or the panel can prove wrong is a
#                          promise nothing keeps: a slot this entry does not
#                          declare, a capability no control on this node
#                          reaches, a span of seconds its own duration denies,
#                          a "cheapest" or "slowest" its credits and
#                          generation_time deny. Judgement calls ("best for
#                          portraits") are the point of the field and stay.
#                          Guarded by domain's guides-name-what-the-model-takes
#                          test, over the models a canvas generation mode can
#                          reach.
#   model.mode           — t2i, i2i
#   param.description    — max 50 chars. No panel shows it either: the controls
#                          take their labels from the locales. It is what the
#                          canvas capability answer says this param is for.
#   param.max_items      — max number of items for list-type params (used by frontend + validation)
#   param.default        — every param MUST have a default (used as fallback for invalid values)
#   param names          — user-facing; model family code converts to API format
#   provider.priority    — lower number = tried first
#   cost_per_call        — estimated credits per call (1 credit = 1 US cent). Not
#                          display only: the pre-enqueue balance gate reads it and
#                          refuses with a 402 when the studio holds less. What is
#                          charged is taken afterwards, on actual usage.
#   generation_time      — max generation time in seconds (worst case)

models:
  # -- Seedream 5.0 Lite (t2i) ---------------------------------------------------

  - name: "seedream-5.0-lite"
    display_name: "Seedream 5.0 Lite"
    icon: "seedream"
    mode: "t2i"
    takes_prompt: true
    tier: recommended
    description: "Latest, reasoning + web search"
    guide: "Intelligence-first model with spatial reasoning. Best at infographics, diagrams, labeled illustrations, and knowledge-rich content. Supports one style reference image. Strong prompt understanding. Choose for knowledge-rich content and complex layouts."
    cost_per_call: 4
    generation_time: 20
    params:
      aspect_ratio:
        description: "Aspect ratio of the output image"
        values: ["1:1", "3:2", "2:3", "3:4", "4:3", "4:5", "5:4", "9:16", "16:9"]
        default: "1:1"
        fill: panel
      resolution:
        description: "Output resolution"
        values: ["1k", "2k", "4k"]
        default: "2k"
        fill: panel
      style_images:
        description: "Style reference image URL"
        type: "list"
        max_items: 1
        default: null
        fill: canvas
        accepts: image
        optional: true
    providers:
      - name: byteplus
        model_id: "seedream-5-0-260128"
        priority: 1
      - name: wavespeed
        model_id: "bytedance/seedream-v5.0-lite"
        priority: 2


