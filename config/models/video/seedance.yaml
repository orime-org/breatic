# Seedance Video Models (ByteDance) — 2.0, 1.5
# Guidelines:
#   model.description    — max 40 chars (shown in UI model selector, keep short)
#   model.guide          — what this model is for, in prose. The Skill prompt
#                          quotes it whole, to help the model choose; so does
#                          the canvas capability answer, for the models a canvas
#                          generation mode can reach, beside a parameter list
#                          built from the declarations. So a sentence
#                          here the catalog or the panel can prove wrong is a
#                          promise nothing keeps: a slot this entry does not
#                          declare, a capability no control on this node
#                          reaches, a span of seconds its own duration denies,
#                          a "cheapest" or "slowest" its credits and
#                          generation_time deny. Judgement calls ("best for
#                          portraits") are the point of the field and stay.
#                          Guarded by domain's guides-name-what-the-model-takes
#                          test, over the models a canvas generation mode can
#                          reach.
#   model.mode           — t2v, i2v, first_last
#   param.description    — max 50 chars (shown as tooltip / help text)
#   param.default        — every param MUST have a default (used as fallback for invalid values)
#   param names          — user-facing; model family code converts to API format
#   provider.priority    — lower number = tried first
#   cost_per_call        — estimated credits per call (1 credit = 1 US cent), display only
#   generation_time      — max generation time in seconds (worst case)


models:
  - name: "seedance-1.5-pro-i2v"
    display_name: "Seedance 1.5 Pro I2V"
    # Both frames ride the same request; the end frame is optional to the
    # vendor, required by the first-last mode (#1904).
    mode: ["i2v", "first_last"]
    takes_prompt: true
    tier: optional
    description: "Seedance 1.5 image-to-video"
    guide: "Animate an image into a video using Seedance 1.5 Pro. Supports end frame guidance and audio generation. Duration 4-12s, up to 1080p."
    cost_per_call: 60
    generation_time: 120
    params:
      image:
        description: "First frame image URL"
        default: null
        fill: canvas
        accepts: image
      end_image:
        description: "End frame image URL"
        default: null
        fill: canvas
        accepts: image
        modes: [first_last]
      aspect_ratio:
        description: "Output aspect ratio"
        values: ["16:9", "9:16", "1:1", "4:3", "3:4"]
        default: "16:9"
        fill: panel
      resolution:
        description: "Output resolution"
        values: ["480p", "720p", "1080p"]
        default: "720p"
        fill: panel
      duration:
        description: "Video length in seconds"
        min: 4
        max: 12
        default: 5
        fill: panel
      generate_audio:
        description: "Generate audio track"
        values: [true, false]
        default: false
        fill: panel
      camera_fixed:
        description: "Lock camera position"
        values: [true, false]
        default: false
        fill: none
        note: "part of the camera cluster, which the video panel does not mount"
      seed:
        description: "Random seed for reproducibility"
        default: -1
        fill: none
        note: "reproducibility plumbing; the product does not expose it"
    providers:
      - name: byteplus
        model_id: "seedance-1.5-pro-i2v"
        priority: 1
      - name: wavespeed
        model_id: "bytedance/seedance-v1.5-pro/image-to-video"
        priority: 2

  # -- Seedance 2.0 ------------------------------------------------------------

  - name: "seedance-2.0"
    display_name: "Seedance 2.0"
    mode: "t2v"
    takes_prompt: true
    tier: recommended
    description: "ByteDance latest, multimodal refs"
    guide: "ByteDance's latest cinematic video generator. Duration 5-15s. Best for high-quality cinematic content."
    cost_per_call: 80
    generation_time: 180
    params:
      aspect_ratio:
        description: "Output aspect ratio"
        values: ["16:9", "9:16", "4:3", "3:4"]
        default: "16:9"
        fill: panel
      duration:
        description: "Video length in seconds"
        values: [5, 10, 15]
        default: 5
        fill: panel
      seed:
        description: "Random seed for reproducibility"
        default: -1
        fill: none
        note: "reproducibility plumbing; the product does not expose it"
    providers:
      - name: byteplus
        model_id: "seedance-2.0"
        priority: 1
      - name: wavespeed
        model_id: "wavespeed-ai/cinematic-video-generator"
        priority: 2

