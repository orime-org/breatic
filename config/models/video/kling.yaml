# Kling Video Models (KwaiVGI) — O3, V3 Motion
# Guidelines:
#   model.description    — max 40 chars. No panel shows it: the picker draws
#                          display_name. Its one reader is the canvas capability
#                          answer, which takes it when guide is empty.
#   model.guide          — what this model is for, in prose. The Skill prompt
#                          quotes it whole, to help the model choose; so does
#                          the canvas capability answer, for the models a canvas
#                          generation mode can reach, beside a parameter list
#                          built from the declarations. So a sentence
#                          here the catalog or the panel can prove wrong is a
#                          promise nothing keeps: a slot this entry does not
#                          declare, a capability no control on this node
#                          reaches, a span of seconds its own duration denies,
#                          a "cheapest" or "slowest" its credits and
#                          generation_time deny. Judgement calls ("best for
#                          portraits") are the point of the field and stay.
#                          Guarded by domain's guides-name-what-the-model-takes
#                          test, over the models a canvas generation mode can
#                          reach.
#   model.mode           — t2v, i2v, first_last, ref, edit, motion
#   param.description    — max 50 chars. No panel shows it either: the controls
#                          take their labels from the locales. It is what the
#                          canvas capability answer says this param is for.
#   param.default        — every param MUST have a default (used as fallback for invalid values)
#   param names          — user-facing; model family code converts to API format
#   provider.priority    — lower number = tried first
#   cost_per_call        — estimated credits per call (1 credit = 1 US cent). Not
#                          display only: the pre-enqueue balance gate reads it and
#                          refuses with a 402 when the studio holds less. What is
#                          charged is taken afterwards, on actual usage.
#   generation_time      — max generation time in seconds (worst case)


models:
  # ── O3 Pro ──────────────────────────────────────────────────────────────

  - name: "kling-o3-pro"
    display_name: "Kling O3 Pro"
    mode: "t2v"
    takes_prompt: true
    tier: recommended
    description: "Latest Kling flagship, best quality"
    guide: "Top-tier text-to-video. Supports multi-shot scenes, element consistency, and AI sound generation. Duration 3-15s. Choose for highest quality video generation."
    cost_per_call: 56
    generation_time: 120
    params:
      aspect_ratio:
        description: "Output aspect ratio"
        values: ["16:9", "9:16", "1:1"]
        default: "16:9"
        fill: panel
      duration:
        description: "Video length in seconds"
        min: 3
        max: 15
        default: 5
        fill: panel
      generate_audio:
        description: "Generate audio track"
        values: [true, false]
        default: false
        fill: panel
      negative_prompt:
        description: "Elements to avoid"
        default: null
        fill: none
        note: "the prompt editor is the one place a reader writes words"
      seed:
        description: "Random seed for reproducibility"
        default: -1
        fill: none
        note: "reproducibility plumbing; the product does not expose it"
    providers:
      - name: klingai
        model_id: "kling-v3"
        extra_params: { mode: "pro" }
        priority: 1
      - name: wavespeed
        model_id: "kwaivgi/kling-video-o3-pro/text-to-video"
        priority: 2

  - name: "kling-o3-pro-i2v"
    display_name: "Kling O3 Pro I2V"
    # Both frames ride the same request; the end frame is optional to the
    # vendor, required by the first-last mode (#1904).
    mode: ["i2v", "first_last"]
    takes_prompt: true
    tier: recommended
    description: "Kling O3 image-to-video"
    guide: "Animate an image into a video using Kling O3 Pro. Supports end frame guidance and AI sound. Duration 3-15s."
    cost_per_call: 56
    generation_time: 120
    params:
      image:
        description: "First frame image URL"
        default: null
        fill: canvas
        accepts: image
      end_image:
        description: "End frame image URL"
        default: null
        fill: canvas
        accepts: image
        modes: [first_last]
      duration:
        description: "Video length in seconds"
        min: 3
        max: 15
        default: 5
        fill: panel
      generate_audio:
        description: "Generate audio track"
        values: [true, false]
        default: false
        fill: panel
      negative_prompt:
        description: "Elements to avoid"
        default: null
        fill: none
        note: "the prompt editor is the one place a reader writes words"
      seed:
        description: "Random seed for reproducibility"
        default: -1
        fill: none
        note: "reproducibility plumbing; the product does not expose it"
    providers:
      - name: klingai
        model_id: "kling-v3"
        extra_params: { mode: "pro" }
        priority: 1
      - name: wavespeed
        model_id: "kwaivgi/kling-video-o3-pro/image-to-video"
        priority: 2

  # ── O3 Pro Reference ───────────────────────────────────────────────────

  - name: "kling-o3-pro-ref"
    display_name: "Kling O3 Pro Ref"
    mode: "ref"
    takes_prompt: true
    tier: recommended
    description: "Kling O3 reference-to-video"
    guide: "Generate a video from reference images using Kling O3 Pro. Maintains character/style consistency. Duration 3-15s. Provide 1-7 reference images, or 1-4 alongside an optional reference video whose motion the result follows."
    cost_per_call: 56
    generation_time: 120
    params:
      images:
        description: "Reference image URLs (1-7, or 1-4 with video)"
        type: "list"
        max_items: 7
        max_items_when_present:
          video: 4
        default: null
        fill: pool
        accepts: image
      video:
        description: "Optional video whose motion the result follows"
        default: null
        fill: canvas
        accepts: video
        optional: true
      keep_original_sound:
        description: "Keep the reference video's own audio in the result"
        values: [true, false]
        default: true
        fill: panel
        when: { source: video }
      aspect_ratio:
        description: "Output aspect ratio"
        values: ["16:9", "9:16", "1:1"]
        default: "16:9"
        fill: panel
      duration:
        description: "Video length in seconds"
        min: 3
        max: 15
        default: 5
        fill: panel
      generate_audio:
        description: "Generate audio track"
        values: [true, false]
        default: false
        fill: panel
      seed:
        description: "Random seed for reproducibility"
        default: -1
        fill: none
        note: "reproducibility plumbing; the product does not expose it"
    providers:
      - name: klingai
        model_id: "kling-v3"
        extra_params: { mode: "pro" }
        priority: 1
      - name: wavespeed
        model_id: "kwaivgi/kling-video-o3-pro/reference-to-video"
        priority: 2

  # ── O3 Pro Edit ────────────────────────────────────────────────────────

  - name: "kling-o3-pro-edit"
    display_name: "Kling O3 Pro Edit"
    mode: "edit"
    takes_prompt: true
    tier: recommended
    description: "Kling O3 video editing"
    guide: "Edit an existing video using Kling O3 Pro. Modify content, add elements, or change style. Input video max 10s."
    cost_per_call: 84
    generation_time: 180
    params:
      video:
        description: "Source video URL (required)"
        default: null
        fill: none
        accepts: video
        note: "no generation panel reaches this model"
      seed:
        description: "Random seed for reproducibility"
        default: -1
        fill: none
        note: "no generation panel reaches this model"
    providers:
      - name: klingai
        model_id: "kling-v3"
        extra_params: { mode: "pro" }
        priority: 1
      - name: wavespeed
        model_id: "kwaivgi/kling-video-o3-pro/video-edit"
        priority: 2

  # ── V3 Pro Motion ──────────────────────────────────────────────────────

  - name: "kling-v3-pro-motion"
    display_name: "Kling V3 Pro Motion"
    mode: "motion"
    takes_prompt: true
    tier: recommended
    description: "Kling V3 motion control"
    guide: "Motion control using Kling V3 Pro. Drive character movement with a reference video or image. Duration 3-30s."
    cost_per_call: 84
    generation_time: 180
    params:
      image:
        description: "Character source image URL"
        default: null
        fill: none
        accepts: image
        note: "no generation panel reaches this model"
      duration:
        description: "Video length in seconds"
        min: 3
        max: 30
        default: 5
        fill: none
        note: "no generation panel reaches this model"
      seed:
        description: "Random seed for reproducibility"
        default: -1
        fill: none
        note: "no generation panel reaches this model"
    providers:
      - name: klingai
        model_id: "kling-v3.0-pro"
        priority: 1
      - name: wavespeed
        model_id: "kwaivgi/kling-v3.0-pro/motion-control"
        priority: 2


