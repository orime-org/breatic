    guide: "The strongest plain prompt-to-video when there are no assets to feed it: second-best measured model in the world, at up to 30 seconds with audio."
    generation_time: 600
    icon: "alibaba"
    params:
      aspect_ratio:
        description: "Output aspect ratio"
        default: "16:9"
        values: ["16:9", "9:16", "1:1", "4:3", "3:4"]
        fill: "panel"
      duration:
        description: "Length in seconds"
        default: 5
        min: 2
        max: 30
        fill: "panel"
      generate_audio:
        upstream: "enable_audio"
        description: "Generate a soundtrack with the video"
        default: true
        values: [true, false]
        fill: "panel"
      resolution:
        description: "Output resolution"
        default: "720p"
        values: ["480p", "720p", "1080p"]
