# Membership tiers and the ceilings each one carries.
#
# Ratified 2026-07-30: a tier decides capacity and collaboration scale, never
# what a person can create. Every generation feature and every model is
# available on every tier.
#
# EVERY NUMBER BELOW IS AN ORDINARY CEILING. There is no "unlimited" value and
# no sentinel — the check is always `count >= limit`, with no special case
# anywhere in the code. A deployment that does not want to cap something
# writes a number nobody reaches. That is why zero still means zero:
# base.team_studios is 0 because that tier genuinely cannot create a team
# studio, and the same comparison refuses it.
#
# No field has a default. Leave one out and the first request that needs a
# quota fails loudly — this file is read on first use, not at startup, so the
# service will start either way. What must not happen is a quota quietly
# falling back to a number we invented, which would leave you believing the
# file you wrote is what is being enforced.

# Which tier a newly registered account lands in.
#
# This single field is what distinguishes a self-hosted install from our
# hosted service — there is no separate "self-hosted mode" switch.
#   self-hosted (this file as shipped): self_hosted, whose numbers you set
#   our hosted service:                 base, and people pay their way up
#
# Applied at registration. The database column has its own default of `base`,
# but that one is for the rows the migration found already there — it is not
# what a new account falls back to.
default_tier: self_hosted

tiers:
  # Free tier. One personal studio, no team studios.
  base:
    team_studios: 0            # a real zero: this tier cannot create one
    projects_per_studio: 10
    concurrent_editors: 2
    studio_members: 1
    project_members: 4
    storage_bytes: 5368709120  # 5 GiB

  # $12/month.
  pro:
    team_studios: 1
    projects_per_studio: 100
    concurrent_editors: 6
    studio_members: 10
    project_members: 12
    storage_bytes: 214748364800  # 200 GiB

  # $39/month, flat — not per seat.
  team:
    team_studios: 3
    projects_per_studio: 300
    concurrent_editors: 20
    studio_members: 100
    project_members: 40
    storage_bytes: 536870912000  # 500 GiB

  # Every account on a self-hosted install lands here. The numbers come from
  # whoever runs this deployment, not from our price list.
  #
  # Shipped wide open. These are not markers — they are ordinary ceilings set
  # high enough that nobody reaches them. Lower any of them to a real number
  # and it takes effect immediately, no code change involved.
  #
  # The negotiated enterprise tier is NOT here and is not in the tier enum
  # either. Its ceilings are agreed per customer, so there is no one set of
  # them to write down; that work reads them from the database. Inventing a
  # set here would hand an account put on that tier a ceiling nobody agreed
  # to, and it would not complain.
  self_hosted:
    team_studios: 9999
    projects_per_studio: 9999
    concurrent_editors: 9999
    studio_members: 9999
    project_members: 9999
    storage_bytes: 109951162777600  # 100 TiB
