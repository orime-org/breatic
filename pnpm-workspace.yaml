packages:
  - "packages/*"
  - "eslint-rules"
  - "repo-lint"

# Single source of truth for versions shared across packages.
# Packages reference these with "catalog:" instead of a version range,
# so a version can only be changed in one place — and no caret is left
# to quietly float an install onto a newer release.
catalog:
  # Node typings: every one of our packages links the same major.
  "@types/node": 22.0.0

  # The editor stack moves as one unit — a mixed set produces unmet
  # peer ranges and, historically, two copies of the same extension.
  "@tiptap/core": 3.29.2
  "@tiptap/extension-blockquote": 3.29.2
  "@tiptap/extension-bubble-menu": 3.29.2
  "@tiptap/extension-code-block": 3.29.2
  "@tiptap/extension-code-block-lowlight": 3.29.2
  "@tiptap/extension-collaboration": 3.29.2
  "@tiptap/extension-collaboration-caret": 3.29.2
  "@tiptap/extension-document": 3.29.2
  "@tiptap/extension-floating-menu": 3.29.2
  "@tiptap/extension-heading": 3.29.2
  "@tiptap/extension-highlight": 3.29.2
  "@tiptap/extension-horizontal-rule": 3.29.2
  "@tiptap/extension-image": 3.29.2
  "@tiptap/extension-link": 3.29.2
  "@tiptap/extension-mention": 3.29.2
  "@tiptap/extension-paragraph": 3.29.2
  "@tiptap/extension-placeholder": 3.29.2
  "@tiptap/extension-table": 3.29.2
  "@tiptap/extension-table-cell": 3.29.2
  "@tiptap/extension-table-header": 3.29.2
  "@tiptap/extension-table-row": 3.29.2
  "@tiptap/extension-task-item": 3.29.2
  "@tiptap/extension-task-list": 3.29.2
  "@tiptap/extension-text": 3.29.2
  "@tiptap/extension-text-align": 3.29.2
  "@tiptap/extension-text-style": 3.29.2
  "@tiptap/extension-underline": 3.29.2
  "@tiptap/pm": 3.29.2
  "@tiptap/react": 3.29.2
  "@tiptap/starter-kit": 3.29.2
  "@tiptap/suggestion": 3.29.2
  "@tiptap/y-tiptap": 3.0.8
