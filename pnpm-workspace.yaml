packages:
  - "packages/*"
  - "eslint-rules"
  - "repo-lint"

# Single source of truth for versions shared across packages.
# Packages reference these with "catalog:" instead of a version range, so a
# version can only be changed in one place.
#
# Ranges keep their caret: the lockfile is what makes an install reproducible,
# so a caret here is a statement about what we accept, not a licence for an
# install to wander. The exception is the editor stack below, pinned exactly
# because those packages only work as a matched set.
catalog:
  # Node typings: every one of our packages links the same major. It only ever
  # types test code — nothing under any src/ imports node: — so the major is
  # what matters and patch-level fixes are worth taking.
  "@types/node": ^22.20.1

  # The editor stack moves as one unit — a mixed set produces unmet
  # peer ranges and, historically, two copies of the same extension.
  "@tiptap/core": 3.29.2
  "@tiptap/extension-collaboration": 3.29.2
  "@tiptap/extension-collaboration-caret": 3.29.2
  "@tiptap/extension-document": 3.29.2
  "@tiptap/extension-heading": 3.29.2
  "@tiptap/extension-paragraph": 3.29.2
  "@tiptap/extension-placeholder": 3.29.2
  "@tiptap/extension-text": 3.29.2
  "@tiptap/pm": 3.29.2
  "@tiptap/react": 3.29.2
  "@tiptap/starter-kit": 3.29.2
  "@tiptap/suggestion": 3.29.2
  "@tiptap/y-tiptap": 3.0.8

  # The AI SDK and its providers move together — a provider built against a
  # different core version fails at the call site, not at install.
  "@ai-sdk/anthropic": ^4.0.37
  "@ai-sdk/google": ^4.0.41
  "@ai-sdk/openai": ^4.0.37
  # The React bindings depend on an exact core version, so the core entry
  # follows theirs. Anything looser risks two copies of `ai` in one install —
  # the browser holding one and the server the other, agreeing at the type
  # level and disagreeing at runtime.
  "@ai-sdk/react": ^4.0.71
  "ai": ^7.0.68

  # Collaboration: the Yjs stack is shared by web, collab and the server, and a
  # split here means two clients speaking different wire formats.
  "@hocuspocus/extension-redis": ^4.6.0
  "@hocuspocus/server": ^4.6.0
  "y-protocols": ^1.0.7
  "yjs": ^13.6.32

  # Backend infrastructure every service reaches for.
  "@types/nodemailer": ^8.0.1
  "ali-oss": ^6.23.0
  "bcryptjs": ^3.0.3
  "bullmq": ^5.81.3
  "dotenv": ^16.6.1
  "drizzle-orm": ^0.45.2
  "google-auth-library": ^10.9.1
  "ipaddr.js": ^2.5.0
  "nodemailer": ^8.0.11
  "pino": ^9.14.0
  "postgres": ^3.4.9
  "zod": ^4.4.3

  # Toolchain: linting and type-checking must agree across packages or the
  # same source reads as clean in one package and broken in another.
  #
  # ESLint stays on 9 because that is the only version the whole repo can
  # share: eslint-plugin-react caps its peer range at ^9.7 (7.37.5, the
  # latest, still does), and web needs it. The root had drifted to 10 —
  # nothing there required it, and pointing both at 10 breaks web's lint
  # outright with "contextOrFilename.getFilename is not a function".
  "@eslint/js": ^9.39.5
  "eslint": ^9.39.5
  "eslint-plugin-jsdoc": ^63.3.3
  "fast-check": ^4.9.0
  "globals": ^16.5.0
  "tsup": ^8.5.1
  "tsx": ^4.23.12
  "typescript": ~5.8.3
  "typescript-eslint": ^8.67.0
  "vitest": ^3.2.7

  # Everything else two or more packages share.
  "lib0": ^0.2.117
  "pino-pretty": ^13.1.3
  "stripe": ^21.0.1
  "yaml": ^2.9.0
